name: One-time Pages runtime release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-triggers/pages-runtime-20260819.txt'

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: one-time-pages-runtime-20260819
  cancel-in-progress: false

jobs:
  release-pages:
    if: >-
      github.repository == 'codingwally/Bar-Exam-simulator' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'release: deploy Free Trial runtime artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_REFERENCE: owner-approved-2026-08-19-retainer-subject-matter-payment-fix
      ACCESS_FIX_SHA: a1bfe0e6561329fc74b8268f7a986e7ce5701836
      ARTIFACT_FIX_SHA: 12b50c057ee96c702f43ed3b108e77521fc07507
      WORKER_URL: https://duediligence-gemini-examiner.wallyesteban1993.workers.dev
      SITE_URL: https://duediligence.ph
    steps:
      - name: Checkout approved main release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify owner approval and approved fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/release-triggers/pages-runtime-20260819.txt)" = "$APPROVAL_REFERENCE"
          git merge-base --is-ancestor "$ACCESS_FIX_SHA" HEAD
          git merge-base --is-ancestor "$ARTIFACT_FIX_SHA" HEAD
          test "$(git branch --show-current)" = "main"

      - name: Dispatch and verify production Pages
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml \
            --ref main \
            -f confirm_production=true \
            -f approval_reference="$APPROVAL_REFERENCE"

          pages_run_id=""
          for attempt in $(seq 1 60); do
            pages_run_id="$(
              gh run list \
                --workflow deploy.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" \
                | head -n 1
            )"
            [ -n "$pages_run_id" ] && break
            sleep 2
          done
          test -n "$pages_run_id"
          echo "run_id=$pages_run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$pages_run_id" --exit-status

      - name: Verify deployed access runtime and plan catalog
        shell: bash
        run: |
          set -euo pipefail

          verified="false"
          for attempt in $(seq 1 36); do
            phase4="$(curl -fsS "$SITE_URL/assets/phase4-experience.js?release=$GITHUB_SHA" || true)"
            loader="$(curl -fsS "$SITE_URL/assets/feature-loader.js?release=$GITHUB_SHA" || true)"
            daily="$(curl -fsS "$SITE_URL/assets/free-trial-five-daily.js?release=$GITHUB_SHA" || true)"
            if grep -q 'ensureProtectedAccess' <<<"$phase4" \
              && grep -q "'subject-matter': '#subject-matter'" <<<"$loader" \
              && grep -q 'assets/free-trial-five-daily.js' <<<"$loader" \
              && grep -q '5 protected question submissions' <<<"$daily" \
              && grep -q 'daily_limit_reached' <<<"$daily"; then
              verified="true"
              break
            fi
            sleep 5
          done
          test "$verified" = "true"

          plans="$(
            curl -fsS -X POST \
              -H 'Origin: https://duediligence.ph' \
              -H 'Content-Type: application/json' \
              -H 'X-Request-ID: pages_runtime_verify_20260819' \
              --data '{}' \
              "$WORKER_URL/plans"
          )"
          PLANS_JSON="$plans" node <<'NODE'
          const payload = JSON.parse(process.env.PLANS_JSON || '{}');
          if (payload.ok !== true || !Array.isArray(payload.plans)) process.exit(1);
          const free = payload.plans.find((plan) => plan.planCode === 'free');
          const early = payload.plans.find((plan) => plan.planCode === 'early_access_beta');
          if (!free || free.billing !== 'daily_free_trial' || Number(free.priceCentavos) !== 0) process.exit(1);
          if (!early || Number(early.priceCentavos) !== 14900) process.exit(1);
          NODE

      - name: Publish production evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-comment.md" <<COMMENT
          ## Production Pages runtime verified

          The focused packaging correction passed the normal production Pages workflow and live verification.

          - Approval: \`$APPROVAL_REFERENCE\`
          - Pages workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${{ steps.pages.outputs.run_id }}
          - Source commit: \`$GITHUB_SHA\`
          - Verified live: Retainer access guard, Subject Matter protected-route gate, Free Trial five-question runtime, and the Free Trial / ₱149 Early Access catalog.

          The payment destination and approved visual design were not changed.
          COMMENT
          gh pr comment 152 --body-file "$RUNNER_TEMP/release-comment.md"
