name: Release verified Examination Room optional schedule fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/retry-examination-room-optional-schedule.yml

permissions:
  contents: write

concurrency:
  group: release-examination-room-optional-schedule
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the isolated Examination Room patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-examination-room-optional-schedule.yml').read_text(encoding='utf-8')
          step = source.index('      - name: Patch only Examination Room scheduling\n')
          start_marker = '        run: |\n'
          start = source.index(start_marker, step) + len(start_marker)
          end = source.index('\n      - name: Validate syntax and focused behavior', start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/examination-room-optional-schedule-patch.sh').write_text(script, encoding='utf-8')
          PY
          bash -n /tmp/examination-room-optional-schedule-patch.sh
          bash /tmp/examination-room-optional-schedule-patch.sh

      - name: Replace the obsolete fixed-schedule integration contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worker/examination-room-v1-owner.test.mjs')
          source = path.read_text(encoding='utf-8')
          old_title = "test('owner approval fails recoverably when the published exam has no exact usable schedule and never invents a 24-hour window'"
          new_title = "test('owner approval converts a blank published schedule into a fresh 24-hour key window'"
          end_marker = '\n\nfunction bytes('
          start = source.find(old_title)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the obsolete Examination Room schedule test safely.')
          block = source[start:end].replace(old_title, new_title, 1)
          block = block.replace(
              '  let activationCalls = 0;\n',
              '  let activationCalls = 0;\n  let activationPayload = null;\n  const beforeRequest = Date.now();\n',
              1,
          )
          old_activation = (
              "    if (String(url).endsWith('/rest/v1/rpc/examination_room_v1_api')) activationCalls += 1;\n"
              "    throw new Error(`Unexpected fetch ${url}`);"
          )
          new_activation = (
              "    if (String(url).endsWith('/rest/v1/rpc/examination_room_v1_api')) {\n"
              "      activationCalls += 1;\n"
              "      activationPayload = body.p_payload;\n"
              "      return jsonResponse({\n"
              "        ok: false,\n"
              "        error: {\n"
              "          code: 'EXPECTED_ACTIVATION_STOP',\n"
              "          message: 'The test stops after verifying the generated activation window.',\n"
              "          status: 409,\n"
              "          recovery: 'No recovery is required in this test.',\n"
              "        },\n"
              "      });\n"
              "    }\n"
              "    throw new Error(`Unexpected fetch ${url}`);"
          )
          if old_activation not in block:
              raise SystemExit('Could not locate the former no-activation assertion safely.')
          block = block.replace(old_activation, new_activation, 1)
          old_assertions = (
              "  const result = await response.json();\n"
              "  assert.equal(response.status, 409);\n"
              "  assert.equal(result.error.code, 'EXAM_ROOM_V1_PUBLISHED_SCHEDULE_INVALID');\n"
              "  assert.match(result.error.recovery, /exact start date, time, and duration/u);\n"
              "  assert.equal(activationCalls, 0);"
          )
          new_assertions = (
              "  const afterRequest = Date.now();\n"
              "  const result = await response.json();\n"
              "  const opens = Date.parse(activationPayload?.opensAt || '');\n"
              "  const closes = Date.parse(activationPayload?.closesAt || '');\n"
              "  assert.equal(response.status, 409);\n"
              "  assert.equal(result.error.code, 'EXPECTED_ACTIVATION_STOP');\n"
              "  assert.equal(activationCalls, 1);\n"
              "  assert.equal(activationPayload.replaceCurrent, false);\n"
              "  assert.ok(Number.isFinite(opens));\n"
              "  assert.ok(Number.isFinite(closes));\n"
              "  assert.ok(opens >= beforeRequest - 1_000);\n"
              "  assert.ok(opens <= afterRequest + 1_000);\n"
              "  assert.equal(closes - opens, 24 * 60 * 60 * 1_000);"
          )
          if old_assertions not in block:
              raise SystemExit('Could not locate the obsolete schedule assertions safely.')
          block = block.replace(old_assertions, new_assertions, 1)
          source = source[:start] + block + source[end:]
          if 'never invents a 24-hour window' in source:
              raise SystemExit('The obsolete schedule contract remains after patching.')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Install the existing worker test dependencies
        working-directory: worker
        run: npm ci

      - name: Validate syntax and focused behavior
        shell: bash
        run: |
          node --check worker/index.mjs
          node --check worker/examination-room-activation-window.mjs
          node --check examination-room/professor.js
          node --test worker/examination-room-activation-window.test.mjs
          node --test worker/examination-room-v1-owner.test.mjs
          node --test examination-room/professor.client.test.cjs
          git diff --check

      - name: Enforce the Examination Room-only scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
              'worker/index.mjs',
              'worker/examination-room-activation-window.mjs',
              'worker/examination-room-activation-window.test.mjs',
              'worker/examination-room-v1-owner.test.mjs',
              'examination-room/professor.js',
              'examination-room/index.html',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f'Unexpected out-of-scope files changed: {unexpected}')
          if missing:
              raise SystemExit(f'Expected Examination Room files were not changed: {missing}')
          PY

      - name: Commit and publish the verified fix
        shell: bash
        run: |
          git config user.name "Due Diligence Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-examination-room-optional-schedule.yml
          rm .github/workflows/retry-examination-room-optional-schedule.yml
          git add worker/index.mjs \
            worker/examination-room-activation-window.mjs \
            worker/examination-room-activation-window.test.mjs \
            worker/examination-room-v1-owner.test.mjs \
            examination-room/professor.js \
            examination-room/index.html \
            .github/workflows/fix-examination-room-optional-schedule.yml \
            .github/workflows/retry-examination-room-optional-schedule.yml
          git commit -m "fix(examination-room): make room-key schedule optional"
          git push origin HEAD:main
