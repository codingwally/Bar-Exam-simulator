name: Release unlimited Forecast and Bar Simulation access

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this exact unlimited-feature release may publish to production"
        required: true
        default: false
        type: boolean
      product_sha:
        description: "Exact merged main SHA to stage and publish"
        required: true
        type: string
      validation_run_id:
        description: "Successful pull-request validation run for the exact product tree"
        required: true
        type: string
      expected_current_pages_sha:
        description: "Exact SHA currently serving duediligence.ph"
        required: true
        type: string
      forecast_content_verified_sha256:
        description: "Exact Forecast manifest SHA after protected production import and read-back"
        required: true
        type: string
      approval_reference:
        description: "Owner approval or reviewed change reference"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: examination-room-production-cutover
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize the exact unlimited-feature product tree
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the exact main release candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.product_sha }}

      - name: Enforce main, owner approval, exact validation, and exact scope
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          PRODUCT_SHA: ${{ inputs.product_sha }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          EXPECTED_CURRENT_PAGES_SHA: ${{ inputs.expected_current_pages_sha }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "codingwally/Bar-Exam-simulator"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" != "dependabot[bot]"
          test "$CONFIRM_PRODUCTION" = "true"
          test -n "${APPROVAL_REFERENCE//[[:space:]]/}"
          [[ "$PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_CURRENT_PAGES_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          test "$PRODUCT_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          git cat-file -e "$EXPECTED_CURRENT_PAGES_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_CURRENT_PAGES_SHA" "$PRODUCT_SHA"

          validation_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID")"
          test "$(jq -r '.event' <<<"$validation_run")" = "pull_request"
          test "$(jq -r '.path' <<<"$validation_run")" = ".github/workflows/validate-mandatory-early-access.yml"
          test "$(jq -r '.status' <<<"$validation_run")" = "completed"
          test "$(jq -r '.conclusion' <<<"$validation_run")" = "success"
          validated_head="$(jq -r '.head_sha' <<<"$validation_run")"
          [[ "$validated_head" =~ ^[0-9a-f]{40}$ ]]
          pr_number="$(jq -r '.pull_requests[0].number // empty' <<<"$validation_run")"
          if [[ -z "$pr_number" ]]; then
            validation_prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$validated_head/pulls" -H 'Accept: application/vnd.github+json')"
            pr_number="$(jq -r --arg sha "$validated_head" --arg repository "$GITHUB_REPOSITORY" '
              map(select(.base.ref == "main" and .head.sha == $sha and .head.repo.full_name == $repository))
              | if length == 1 then .[0].number else empty end
            ' <<<"$validation_prs")"
          fi
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          test "$(jq -r '.base.ref' <<<"$pr")" = "main"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$validated_head"
          base_sha="$(jq -r '.base.sha' <<<"$pr")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/$pr_number/head:refs/remotes/origin/unlimited-feature-validation-head"
          test "$(git rev-parse refs/remotes/origin/unlimited-feature-validation-head)" = "$validated_head"
          test "$(git rev-parse "$validated_head^{tree}")" = "$(git rev-parse "$PRODUCT_SHA^{tree}")"
          git diff --quiet "$validated_head" "$PRODUCT_SHA" -- .

          approved_scope="$(printf '%s\n' \
            .github/workflows/release-unlimited-feature-access.yml \
            .github/workflows/validate-mandatory-early-access.yml \
            assets/bar-forecast.css \
            assets/bar-forecast.js \
            assets/examinations.js \
            assets/feature-loader.js \
            assets/phase2-experience.js \
            assets/phase4-experience.js \
            assets/private-beta-landing.js \
            content/duediligence-2026/bar-forecast-methodology.json \
            content/duediligence-2026/bar-forecast-statistical-audit.json \
            content/duediligence-2026/bar-forecast.json \
            content/duediligence-2026/syllabus-units.json \
            content/question-bank/website-upload.json \
            docs/evidence/bar-forecast-examplify-audit-20260901/local-preview.html \
            index.html \
            scripts/audit-bar-forecast-statistics.mjs \
            scripts/build-bar-forecast-google-sheet.mjs \
            scripts/build-bar-forecast-qbank-google-batch.mjs \
            scripts/import-website-upload.mjs \
            scripts/project-bar-forecast-to-question-bank.mjs \
            scripts/test-complete-beta-staging.mjs \
            scripts/renovation-20260820/mandatory-plan-gate.test.mjs \
            scripts/revise-bar-forecast-allocation.mjs \
            scripts/revise-syllabus-priors.mjs \
            scripts/test-approved-renovation-shell.mjs \
            scripts/test-auth-route-overlay.mjs \
            scripts/test-bar-forecast-boundary.mjs \
            scripts/test-bar-forecast-frontend.mjs \
            scripts/test-bar-forecast-google-sheet.mjs \
            scripts/test-bar-forecast-qbank-google-batch.mjs \
            scripts/test-bar-forecast-question-bank-projection.mjs \
            scripts/test-design-correction-release.mjs \
            scripts/test-examinations.mjs \
            scripts/test-leb-subject-matter-premium.mjs \
            scripts/test-login-loop-p0.mjs \
            scripts/test-mobile-responsive-hotfix.mjs \
            scripts/test-pedro-release2-integration.mjs \
            scripts/test-phase4-release4.mjs \
            scripts/test-premium-navigation-race.mjs \
            scripts/test-private-beta-landing.mjs \
            scripts/test-private-beta-auth-regression.mjs \
            scripts/test-admin-bar-forecast-deployment-smoke.mjs \
            scripts/test-syllabus-review-reveal-contract.mjs \
            scripts/test-unlimited-feature-access-live.mjs \
            scripts/test-unlimited-feature-access.mjs \
            scripts/test-unlimited-feature-access-release-workflow.mjs \
            scripts/test-website-question-bank.mjs \
            scripts/validate-duediligence-2026-content.mjs \
            scripts/verify-unlimited-feature-access-live.mjs \
            scripts/verify-admin-bar-forecast-deployment.mjs \
            service-worker.js \
            supabase/migrations/20260902090000_unlimited_forecast_access.sql \
            worker/access-core.mjs \
            worker/bar-forecast-core.mjs \
            worker/bar-forecast-database-policy.test.mjs \
            worker/bar-forecast-core.test.mjs \
            worker/bar-forecast-provider-policy.test.mjs \
            worker/bar-forecast-routes.mjs \
            worker/bar-forecast-routes.test.mjs \
            worker/examinations-core.mjs \
            worker/examinations-core.test.mjs \
            worker/examinations-routes.test.mjs \
            worker/index.mjs \
            worker/phase4-access.test.mjs \
            worker/question-visibility-release.test.mjs | sort -u)"
          actual_scope="$(git diff --name-only "$base_sha" "$validated_head" | sort -u)"
          test -n "$actual_scope"
          unexpected="$(comm -23 <(printf '%s\n' "$actual_scope") <(printf '%s\n' "$approved_scope") || true)"
          if [[ -n "$unexpected" ]]; then
            echo "The release contains files outside the reviewed Forecast and Bar Simulation boundary:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          deleted="$(git diff --diff-filter=D --name-only "$base_sha" "$validated_head")"
          if [[ -n "$deleted" ]]; then
            echo "This focused release may not delete files." >&2
            exit 1
          fi

      - name: Verify the current production Pages baseline
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CURRENT_PAGES_SHA: ${{ inputs.expected_current_pages_sha }}
        shell: bash
        run: |
          set -euo pipefail
          authoritative=""
          while IFS=$'\t' read -r deployment_id deployment_sha; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state // "unknown"')"
            case "$state" in
              inactive|failure|error) continue ;;
              success|queued|pending|in_progress|unknown)
                authoritative="$state"$'\t'"$deployment_sha"
                break
                ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq '.[] | [.id, .sha] | @tsv')
          test "$authoritative" = "success"$'\t'"$EXPECTED_CURRENT_PAGES_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Re-run focused access, Forecast, content, and release contracts
        run: |
          set -euo pipefail
          node --check assets/bar-forecast.js
          node --check assets/feature-loader.js
          node --check assets/phase2-experience.js
          node --check assets/phase4-experience.js
          node --check assets/private-beta-landing.js
          node --check worker/bar-forecast-core.mjs
          node --check worker/bar-forecast-routes.mjs
          node --check worker/examinations-core.mjs
          node --check worker/index.mjs
          node --test worker/*.test.mjs
          node scripts/test-bar-forecast-frontend.mjs
          node scripts/test-bar-forecast-boundary.mjs
          node scripts/test-private-beta-landing.mjs
          node scripts/test-examinations.mjs
          node scripts/validate-duediligence-2026-content.mjs
          node scripts/test-website-question-bank.mjs
          node --test scripts/test-unlimited-feature-access-live.mjs
          node scripts/test-unlimited-feature-access.mjs
          node scripts/test-unlimited-feature-access-release-workflow.mjs
          node scripts/test-pages-artifact.mjs
          git diff --check

  deploy_staging:
    name: Stage exact content, Worker, client, and access journeys
    needs: authorize
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout the authorized release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.product_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Resolve approved staging browser configuration
        env:
          CONFIGURED_STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          staging_publishable_key="$CONFIGURED_STAGING_PUBLISHABLE_KEY"
          if [[ -z "$staging_publishable_key" ]]; then
            staging_publishable_key="$(node --input-type=module -e "const response = await fetch('https://duediligence-examinations-staging.wallyesteban1993.workers.dev/assets/phase2-config.js', { headers: { 'cache-control': 'no-cache' } }); if (!response.ok) process.exit(1); const source = await response.text(); const match = source.match(/sb_publishable_[A-Za-z0-9_-]{20,}/); if (!match) process.exit(1); process.stdout.write(match[0]);")"
          fi
          [[ "$staging_publishable_key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]
          echo "::add-mask::$staging_publishable_key"
          echo "STAGING_SUPABASE_PUBLISHABLE_KEY=$staging_publishable_key" >> "$GITHUB_ENV"

      - name: Import and read back the exact Forecast content on staging
        env:
          DD2026_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
          DD2026_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          import_report="$RUNNER_TEMP/unlimited-feature-forecast-import.json"
          verify_report="$RUNNER_TEMP/unlimited-feature-forecast-verify.json"
          trap 'rm -f -- "$import_report" "$verify_report"' EXIT
          expected="$(node scripts/verify-admin-bar-forecast-content.mjs --print-attestation)"
          [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
          node scripts/import-duediligence-2026-content.mjs --apply --environment staging --content-type bar_forecast_question > "$import_report"
          node scripts/verify-admin-bar-forecast-content.mjs --verify --environment staging > "$verify_report"
          IMPORT_REPORT="$import_report" VERIFY_REPORT="$verify_report" EXPECTED="$expected" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const imported = JSON.parse(await readFile(process.env.IMPORT_REPORT, 'utf8'));
          const verified = JSON.parse(await readFile(process.env.VERIFY_REPORT, 'utf8'));
          assert.equal(imported.targetRef, 'hlzqmreeoghbldnhlybr');
          assert.equal(imported.contentType, 'bar_forecast_question');
          assert.equal(imported.total, 120);
          assert.equal(imported.counts?.bar_forecast_question, 120);
          assert.equal(verified.targetRef, 'hlzqmreeoghbldnhlybr');
          assert.equal(verified.count, 120);
          assert.equal(verified.sha256, process.env.EXPECTED);
          NODE

      - name: Build and verify the isolated staging artifact
        env:
          STAGING_PUBLIC_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
        run: node scripts/test-staging-artifact.mjs

      - name: Deploy the exact Worker and client to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.staging.toml

      - name: Verify the staging Forecast public boundary
        env:
          ADMIN_BAR_FORECAST_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          ADMIN_BAR_FORECAST_ALLOWED_ORIGIN: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        run: node scripts/verify-admin-bar-forecast-deployment.mjs

      - name: Verify staging payment, provisional unlimited access, and cleanup
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-staging-e2e-suite.mjs complete-beta

      - name: Verify staging Bar Simulation access and cleanup
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.54.2
          node scripts/run-staging-e2e-suite.mjs examinations

  deploy_production_worker:
    name: Verify content, then deploy Worker and public API first
    needs: deploy_staging
    environment: production-worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the staging-verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.product_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Require exact protected production Forecast import and read-back
        env:
          FORECAST_CONTENT_VERIFIED_SHA256: ${{ inputs.forecast_content_verified_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node scripts/verify-admin-bar-forecast-content.mjs --print-attestation)"
          [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$FORECAST_CONTENT_VERIFIED_SHA256" != "$expected" ]]; then
            echo "Protected production import and exact read-back are required before Worker deployment." >&2
            echo "Run: node scripts/import-duediligence-2026-content.mjs --apply --environment production --content-type bar_forecast_question --confirm-production hbllomlijfznnuudpdvr" >&2
            echo "Then: node scripts/verify-admin-bar-forecast-content.mjs --verify --environment production --confirm-production hbllomlijfznnuudpdvr" >&2
            echo "Required attestation: $expected" >&2
            exit 1
          fi
          echo "The exact Forecast manifest was imported and read back on production before cutover."

      - name: Verify required production Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['GEMINI_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_URL']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Required production Worker secrets are missing: ' + missing.join(', ') + '.'); process.exit(1); } });"

      - name: Recheck the live Pages baseline immediately before Worker mutation
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CURRENT_PAGES_SHA: ${{ inputs.expected_current_pages_sha }}
        shell: bash
        run: |
          set -euo pipefail
          authoritative=""
          while IFS=$'\t' read -r deployment_id deployment_sha; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state // "unknown"')"
            case "$state" in
              inactive|failure|error) continue ;;
              success|queued|pending|in_progress|unknown)
                authoritative="$state"$'\t'"$deployment_sha"
                break
                ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq '.[] | [.id, .sha] | @tsv')
          test "$authoritative" = "success"$'\t'"$EXPECTED_CURRENT_PAGES_SHA"

      - name: Deploy Worker before exposing the matching Pages client
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy

      - name: Deploy provider-neutral public API before Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.public-api.toml

      - name: Verify both signed-out API boundaries before Pages
        env:
          ADMIN_BAR_FORECAST_WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
          ADMIN_BAR_FORECAST_ALLOWED_ORIGIN: https://duediligence.ph
          WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
          ALLOWED_ORIGIN: https://duediligence.ph
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-admin-bar-forecast-deployment.mjs
          response="$RUNNER_TEMP/bar-simulation-signed-out.json"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header "Origin: $ALLOWED_ORIGIN" \
            --header 'Content-Type: application/json' \
            --data '{"operation":"catalog","track":"bar_feels"}' \
            "$WORKER_URL/examinations/query")"
          test "$status" = "401"
          RESPONSE="$response" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const value = JSON.parse(await readFile(process.env.RESPONSE, 'utf8'));
          assert.equal(value.ok, false);
          assert.doesNotMatch(JSON.stringify(value), /"(?:questions|answers|results|payload)"/iu);
          NODE

  deploy_production_pages:
    name: Deploy the matching Pages client second
    needs: deploy_production_worker
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the Worker-verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.product_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Build and verify the sanitized Pages artifact
        run: node scripts/test-pages-artifact.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload the exact public artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Recheck the old live Pages baseline inside the Pages lock
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CURRENT_PAGES_SHA: ${{ inputs.expected_current_pages_sha }}
        shell: bash
        run: |
          set -euo pipefail
          authoritative=""
          while IFS=$'\t' read -r deployment_id deployment_sha; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state // "unknown"')"
            if [[ "$deployment_sha" == "$GITHUB_SHA" && "$state" != "success" ]]; then
              continue
            fi
            case "$state" in
              inactive|failure|error) continue ;;
              success|queued|pending|in_progress|unknown)
                authoritative="$state"$'\t'"$deployment_sha"
                break
                ;;
            esac
          done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq '.[] | [.id, .sha] | @tsv')
          test "$authoritative" = "success"$'\t'"$EXPECTED_CURRENT_PAGES_SHA"

      - name: Deploy Pages after the Worker and API gates
        id: deployment
        uses: actions/deploy-pages@v4

  verify_production:
    name: Verify exact Pages bytes and two live access journeys
    needs: deploy_production_pages
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the published release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.product_sha }}

      - name: Verify the exact Pages SHA and reviewed client bytes
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: https://duediligence.ph
        shell: bash
        run: |
          set -euo pipefail
          latest_authoritative_pages_deployment() {
            local deployment_id deployment_sha state
            while IFS=$'\t' read -r deployment_id deployment_sha; do
              state="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=1" --jq '.[0].state // "unknown"')"
              case "$state" in
                inactive|failure|error) continue ;;
                success|queued|pending|in_progress|unknown)
                  printf '%s\t%s' "$state" "$deployment_sha"
                  return 0
                  ;;
              esac
            done < <(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq '.[] | [.id, .sha] | @tsv')
            printf 'missing\t'
          }
          exact_sha_is_latest=false
          for attempt in {1..12}; do
            record="$(latest_authoritative_pages_deployment)"
            state="${record%%$'\t'*}"
            sha="${record#*$'\t'}"
            if [[ "$state" == "success" && "$sha" == "$GITHUB_SHA" ]]; then
              exact_sha_is_latest=true
              break
            fi
            sleep 5
          done
          test "$exact_sha_is_latest" = "true"

          approved_assets=(
            index.html
            service-worker.js
            assets/bar-forecast.css
            assets/bar-forecast.js
            assets/examinations.js
            assets/feature-loader.js
            assets/phase2-experience.js
            assets/phase4-experience.js
            assets/private-beta-landing.js
            assets/pricing-checkout-safety.js
            assets/pricing-renderer.css
            assets/pricing-renderer.js
          )
          live_root="$(mktemp -d "$RUNNER_TEMP/unlimited-feature-pages.XXXXXX")"
          trap 'rm -rf -- "$live_root"' EXIT
          printf '%s\n' "$GITHUB_SHA" > "$live_root/expected-release.txt"
          all_match=false
          for attempt in {1..24}; do
            attempt_root="$live_root/$attempt"
            mkdir -p "$attempt_root"
            all_match=true
            if ! curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
              --output "$attempt_root/release.txt" \
              "$SITE_URL/.well-known/duediligence-release.txt?release=$GITHUB_SHA" \
              || ! cmp -s "$live_root/expected-release.txt" "$attempt_root/release.txt"; then
              all_match=false
            fi
            for relative_path in "${approved_assets[@]}"; do
              live_file="$attempt_root/$relative_path"
              mkdir -p "$(dirname "$live_file")"
              if ! curl --fail --location --silent --show-error -H 'Cache-Control: no-cache' \
                --output "$live_file" "$SITE_URL/$relative_path?release=$GITHUB_SHA"; then
                all_match=false
                continue
              fi
              test "$(sha256sum "$relative_path" | awk '{print $1}')" = "$(sha256sum "$live_file" | awk '{print $1}')" \
                || all_match=false
            done
            if [[ "$all_match" == "true" ]]; then
              record="$(latest_authoritative_pages_deployment)"
              test "$record" = "success"$'\t'"$GITHUB_SHA"
              break
            fi
            sleep 5
          done
          test "$all_match" = "true"

      - name: Run post-publish live access journey 1 of 2
        env:
          UNLIMITED_FEATURE_SITE_URL: https://duediligence.ph
          UNLIMITED_FEATURE_WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
          UNLIMITED_FEATURE_ALLOWED_ORIGIN: https://duediligence.ph
          UNLIMITED_FEATURE_RELEASE_SHA: ${{ inputs.product_sha }}
        run: node scripts/verify-unlimited-feature-access-live.mjs

      - name: Run post-publish live access journey 2 of 2
        env:
          UNLIMITED_FEATURE_SITE_URL: https://duediligence.ph
          UNLIMITED_FEATURE_WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
          UNLIMITED_FEATURE_ALLOWED_ORIGIN: https://duediligence.ph
          UNLIMITED_FEATURE_RELEASE_SHA: ${{ inputs.product_sha }}
        run: node scripts/verify-unlimited-feature-access-live.mjs
