name: Deploy approved frontend-only release to Pages

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this isolated frontend-only production release has explicit approval"
        required: true
        default: false
        type: boolean
      approval_reference:
        description: "Approval/change reference recorded in the release log"
        required: true
        type: string
      expected_base_sha:
        description: "Exact currently deployed Pages source SHA"
        required: true
        type: string
      expected_source_sha:
        description: "Exact reviewed frontend release source SHA"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "examination-room-production-cutover"
  cancel-in-progress: false

jobs:
  deploy_pages:
    name: Verify and deploy the isolated Pages artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact reviewed frontend release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authorize the isolated production release
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PRODUCTION" = "true"
          test -n "${APPROVAL_REFERENCE//[[:space:]]/}"
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_SOURCE_SHA"

          allowed='^(\.github/workflows/deploy-pages-only\.yml|assets/feature-loader\.js|assets/icons/(community/image|navigation/(circle-check|cloud-upload|hand|mic|monitor-up|pin|settings|shield-check))\.svg|assets/lex-forum\.css|assets/lex-forum\.js|assets/payments/(bpi-instapay-199-qr\.png|bpi-mark\.png)|assets/pedro-navigation\.js|assets/phase2-experience\.js|assets/phase2\.css|assets/pricing-checkout-safety\.js|assets/pricing-renderer\.(css|js)|assets/private-beta-landing\.js|assets/study-room-backgrounds\.js|assets/study-room-live\.(css|js)|assets/study-room-preview\.(css|js)|assets/study-room/(dimasalang-library|participant-2-tropical|participant-3-bedroom|participant-4-condo|virtual-background-due-diligence-branded)\.webp|assets/subscription-cta\.css|assets/subscription-cta\.js|assets/vendor/mediapipe/(LICENSE|PROVENANCE)\.txt|assets/vendor/mediapipe/selfie_segmenter-float16-2023-05-07\.tflite|design-qa\.md|index\.html|scripts/build-pages-artifact\.mjs|scripts/test-home-post-collapse\.mjs|scripts/test-lex-forum\.mjs|scripts/test-pages-artifact\.mjs|scripts/test-pedro-navigation\.mjs|scripts/test-pricing-checkout-safety\.mjs|scripts/test-public-home-responsive-css\.mjs|scripts/test-public-release1-reliability\.mjs|scripts/test-quorum\.mjs|scripts/test-september-pricing-(sql|ui)-contract\.mjs|scripts/test-study-room-(backgrounds|hotfix-behavior|live|preview)\.mjs|service-worker\.js|study-room/index\.html)$'
          unexpected="$(git diff --name-only "$EXPECTED_BASE_SHA..$EXPECTED_SOURCE_SHA" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "The frontend-only release contains files outside the approved isolation boundary:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify the pricing checkout, subscription CTA, and unchanged community contracts
        run: |
          node --check assets/subscription-cta.js
          node --check assets/pricing-checkout-safety.js
          node --check assets/pricing-renderer.js
          node --check assets/study-room-backgrounds.js
          node --check assets/study-room-live.js
          node --check assets/study-room-preview.js
          node --check assets/phase2-experience.js
          node scripts/test-study-room-backgrounds.mjs
          node scripts/test-study-room-live.mjs
          node scripts/test-study-room-hotfix-behavior.mjs
          node scripts/test-study-room-preview.mjs
          node scripts/test-syllabus-review-reveal-contract.mjs
          node scripts/test-quorum.mjs
          node scripts/test-public-home-responsive-css.mjs
          node scripts/test-lex-forum.mjs
          node scripts/test-public-release1-reliability.mjs
          node scripts/test-pedro-navigation.mjs
          node scripts/test-pricing-checkout-safety.mjs
          node scripts/test-september-pricing-ui-contract.mjs
          node scripts/test-september-pricing-sql-contract.mjs

      - name: Build and verify the sanitized Pages artifact
        run: node scripts/test-pages-artifact.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload the reviewed artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the exact frontend release is live
        env:
          SITE_URL: https://duediligence.ph
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 36); do
            index="$(curl -fsS "$SITE_URL/?release=$GITHUB_SHA" || true)"
            cta_js="$(curl -fsS "$SITE_URL/assets/subscription-cta.js?release=$GITHUB_SHA" || true)"
            cta_css="$(curl -fsS "$SITE_URL/assets/subscription-cta.css?release=$GITHUB_SHA" || true)"
            loader="$(curl -fsS "$SITE_URL/assets/feature-loader.js?release=$GITHUB_SHA" || true)"
            forum_js="$(curl -fsS "$SITE_URL/assets/lex-forum.js?release=$GITHUB_SHA" || true)"
            forum_css="$(curl -fsS "$SITE_URL/assets/lex-forum.css?release=$GITHUB_SHA" || true)"
            navigation_js="$(curl -fsS "$SITE_URL/assets/private-beta-landing.js?release=$GITHUB_SHA" || true)"
            pedro_js="$(curl -fsS "$SITE_URL/assets/pedro-navigation.js?release=$GITHUB_SHA" || true)"
            pricing_js="$(curl -fsS "$SITE_URL/assets/phase2-experience.js?release=$GITHUB_SHA" || true)"
            study_room_js="$(curl -fsS "$SITE_URL/assets/study-room-preview.js?release=$GITHUB_SHA" || true)"
            study_room_css="$(curl -fsS "$SITE_URL/assets/study-room-preview.css?release=$GITHUB_SHA" || true)"
            study_room_page="$(curl -fsS "$SITE_URL/study-room/?release=$GITHUB_SHA" || true)"
            study_room_live="$(curl -fsS "$SITE_URL/assets/study-room-live.js?release=$GITHUB_SHA" || true)"
            study_room_backgrounds="$(curl -fsS "$SITE_URL/assets/study-room-backgrounds.js?release=$GITHUB_SHA" || true)"
            study_room_processors="$(curl -fsS "$SITE_URL/assets/vendor/livekit-track-processors.iife.js?release=$GITHUB_SHA" || true)"
            study_room_images=true
            for image in dimasalang-library participant-2-tropical participant-3-bedroom participant-4-condo; do
              if ! curl -fsS -o /dev/null "$SITE_URL/assets/study-room/$image.webp?release=$GITHUB_SHA"; then
                study_room_images=false
              fi
            done
            study_room_runtime=true
            for asset in \
              assets/icons/community/image.svg \
              assets/icons/navigation/hand.svg \
              assets/icons/navigation/mic.svg \
              assets/icons/navigation/monitor-up.svg \
              assets/icons/navigation/pin.svg \
              assets/icons/navigation/settings.svg \
              assets/study-room/virtual-background-due-diligence-branded.webp \
              assets/vendor/mediapipe/selfie_segmenter-float16-2023-05-07.tflite \
              assets/vendor/mediapipe/wasm/vision_wasm_internal.js \
              assets/vendor/mediapipe/wasm/vision_wasm_internal.wasm \
              assets/vendor/mediapipe/wasm/vision_wasm_nosimd_internal.js \
              assets/vendor/mediapipe/wasm/vision_wasm_nosimd_internal.wasm; do
              if ! curl -fsSI -o /dev/null "$SITE_URL/$asset?release=$GITHUB_SHA"; then
                study_room_runtime=false
              fi
            done
            if grep -q 'home-subscription-cta-20260828-3' <<<"$index" \
              && grep -q 'private-beta-landing.js?v=public-reliability-20260827-2&amp;feedback=quiet-navigation-20260828-1' <<<"$index" \
              && grep -q 'pedro-navigation.js?v=pedro-release2-20260827-1&amp;feedback=quiet-navigation-20260828-1' <<<"$index" \
              && grep -q 'home-subscription-20260828-2' <<<"$loader" \
              && grep -q 'collapse=home-read-more-20260828-1' <<<"$loader" \
              && grep -q 'refreshWhenAuthReady' <<<"$cta_js" \
              && grep -q 'duediligence:subscription-cta' <<<"$cta_js" \
              && grep -q 'dd2-subscription-invitation' <<<"$cta_css" \
              && grep -q 'function renderPostBody(item)' <<<"$forum_js" \
              && grep -q 'lex-post-read-more' <<<"$forum_css" \
              && grep -q "classList.toggle('dd2-sr-only'" <<<"$navigation_js" \
              && grep -q "announcementOnly = kind === 'loading'" <<<"$pedro_js" \
              && grep -q 'id="dd2-pricing-retry"' <<<"$pricing_js" \
              && grep -q 'Plans &amp; Pricing could not load just now\.' <<<"$pricing_js" \
              && grep -q 'pricing-checkout-safety.js?v=regular-checkout-r1' <<<"$index" \
              && grep -q 'phase2-experience.js[^" ]*pricing=regular-checkout-r2' <<<"$index" \
              && grep -q 'id="dd-study-room-trigger"' <<<"$index" \
              && grep -q 'id="dd-study-room-dialog"' <<<"$index" \
              && grep -q 'You won&rsquo;t have to study alone\.' <<<"$index" \
              && grep -q 'studyRoomPreviewModule' <<<"$study_room_js" \
              && grep -q 'openMarketingPreview' <<<"$study_room_js" \
              && grep -q '\.dd-study-room-overlay' <<<"$study_room_css" \
              && grep -q 'dd-study-room-radiance' <<<"$study_room_css" \
              && grep -q 'study-room-meet-layout-20260831-5' <<<"$study_room_page" \
              && grep -q 'study-room-optional-background-20260829-1' <<<"$study_room_page" \
              && grep -q "workerRequest('/study-room/rooms'" <<<"$study_room_live" \
              && grep -q "workerRequest('/study-room/join'" <<<"$study_room_live" \
              && grep -q 'registerTextStreamHandler' <<<"$study_room_live" \
              && grep -q 'setScreenShareEnabled' <<<"$study_room_live" \
              && grep -q 'DueDiligenceStudyRoomMandatoryBackground' <<<"$study_room_backgrounds" \
              && grep -q 'virtual-background-due-diligence-branded.webp' <<<"$study_room_backgrounds" \
              && grep -q 'due-diligence-mandatory-virtual-background-no-raw-first-frame' <<<"$study_room_processors" \
              && test "$study_room_images" = "true" \
              && test "$study_room_runtime" = "true"; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = "true"
