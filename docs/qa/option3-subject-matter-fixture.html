<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Subject Matter — Due Diligence browser QA</title>
  <link rel="icon" href="../../assets/brand/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Playfair+Display:wght@500;600;700&amp;family=Inter:wght@400;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/phase2.css">
  <link rel="stylesheet" href="../../assets/private-beta-landing.css">
  <link rel="stylesheet" href="../../assets/due-diligence-controls.css">
  <link rel="stylesheet" href="../../assets/examinations.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
  </style>
</head>
<body class="private-beta-public" data-qa-fixture="subject-matter-production-renderer">
  <header class="topbar pb-header pb-shared-header" id="site-header">
    <a class="brand pb-brand" href="../../index.html" aria-label="Due Diligence homepage">
      <img class="crest pb-crest" src="../../assets/brand/icon-192.png" width="50" height="50" alt="" aria-hidden="true">
      <span>
        <span class="brand-name pb-brand-name">Due Diligence</span>
        <span class="brand-sub pb-brand-sub">Amicus in Itinere Iuris</span>
      </span>
    </a>
    <button class="site-menu-toggle" type="button" aria-controls="spa-nav" aria-expanded="false">Menu</button>
    <div class="topbar-actions">
      <button class="pb-account-control" type="button">The Docket</button>
    </div>
    <nav class="spa-nav pb-chamber-nav" id="spa-nav" aria-label="Primary navigation">
      <div class="nav-audience-cluster" role="group" aria-label="Preparation chambers">
        <div class="pb-chamber-menu pb-chamber-academy is-active">
          <div class="pb-chamber-split"><a class="pb-chamber-link" href="#academy" aria-current="page">The Academy</a></div>
        </div>
        <div class="pb-chamber-menu pb-chamber-commons">
          <div class="pb-chamber-split"><a class="pb-chamber-link" href="#commons">The Commons</a></div>
        </div>
        <div class="pb-chamber-menu pb-chamber-barbound">
          <div class="pb-chamber-split"><a class="pb-chamber-link" href="#barbound">BarBound</a></div>
        </div>
      </div>
      <div class="nav-utilities pb-header-utilities" role="group" aria-label="Website utilities">
        <button type="button">Support</button>
        <button class="account-tab" type="button">The Docket</button>
      </div>
    </nav>
  </header>

  <main id="dd-per-subject-app" aria-label="Subject Matter"></main>

  <script>
    (() => {
      const proofParams = new URLSearchParams(location.search);
      const proofState = proofParams.get('state') || 'chooser';
      const failFirstReview = proofParams.get('review') === 'fail-once';
      let reviewRequestCount = 0;
      window.__DD_SUBJECT_QA_STATE = proofState;
      const storagePrefix = 'dd-browser-qa:examinations:';
      const catalogItems = [
        { subject: 'Philosophy of Law', courseCode: 'JD101', yearLevel: 1, term: 1, progressState: 'Not started' },
        { subject: 'Statutory Construction', courseCode: 'JD102', yearLevel: 1, term: 1, progressState: 'Not started' },
        { subject: 'Constitutional Law I', courseCode: 'JD301', yearLevel: 1, term: 1, progressState: 'Not started' },
        { subject: 'Criminal Law I', courseCode: 'JD401', yearLevel: 1, term: 1, progressState: 'Not started' },
        { subject: 'Legal Research and Writing', courseCode: 'JD501', yearLevel: 1, term: 2, progressState: 'In progress' },
        { subject: 'Obligations and Contracts', courseCode: 'JD502', yearLevel: 1, term: 2, progressState: 'Not started' },
        { subject: 'Civil Procedure I', courseCode: 'JD503', yearLevel: 1, term: 2, progressState: 'Not started' },
        { subject: 'Persons and Family Law', courseCode: 'JD601', yearLevel: 2, term: 1, progressState: 'Not started' },
        { subject: 'Evidence', courseCode: 'JD702', yearLevel: 2, term: 2, progressState: 'Not started' },
      ];
      const selectedSubject = 'Obligations and Contracts';
      const catalogStorageKey = `${storagePrefix}duediligence.subject-matter.catalog-state.v2`;

      for (const key of Object.keys(localStorage)) {
        if (key.startsWith(storagePrefix)) localStorage.removeItem(key);
      }
      if (['exam', 'room', 'flagged', 'queue', 'queue-open'].includes(proofState)) {
        localStorage.setItem(catalogStorageKey, JSON.stringify({
          version: 3,
          selectedSubject,
          selectionConfirmed: true,
          query: '',
          openYears: ['1'],
          openTerms: ['1-2'],
          selectorScroll: 0,
          pageScroll: 0,
          timerMode: 'selfPaced',
          savedAt: Date.now(),
        }));
      }

      const savedDraft = 'A civil obligation is a juridical necessity recognized by law. Its elements are the obligee, the obligor, the prestation, and the juridical tie.';
      const activeAttempt = {
        examination: {
          track: 'per_subject',
          subject: selectedSubject,
          title: `${selectedSubject} focused review`,
        },
        attempt: {
          attemptId: 'qa-attempt-obligations-01',
          versionId: 'qa-version-obligations-01',
          timerMode: 'selfPaced',
          elapsedSeconds: 0,
          remainingSeconds: null,
          assisted: false,
          assistanceKnown: true,
        },
        questions: [{
          questionId: 'LEB-Y1T2-JD502-20260730-Q01',
          prompt: 'Define a civil obligation and identify its four essential elements.',
          answerText: ['flagged', 'queue-open'].includes(proofState) ? savedDraft : '',
          answerHtml: '',
          revision: ['flagged', 'queue-open'].includes(proofState) ? 2 : 0,
          flagged: ['flagged', 'queue-open'].includes(proofState),
          questionType: 'definition',
        }],
      };
      const alternateAttempt = {
        examination: {
          track: 'per_subject',
          subject: selectedSubject,
          title: `${selectedSubject} focused review`,
        },
        attempt: {
          attemptId: 'qa-attempt-obligations-02',
          versionId: 'qa-version-obligations-02',
          timerMode: 'selfPaced',
          elapsedSeconds: 0,
          remainingSeconds: null,
          assisted: false,
          assistanceKnown: true,
        },
        questions: [{
          questionId: 'LEB-Y1T2-JD502-20260730-Q02',
          prompt: 'Identify the five sources of obligations under Article 1157 of the Civil Code.',
          answerText: '',
          answerHtml: '',
          revision: 0,
          flagged: false,
          questionType: 'enumeration',
        }],
      };

      const attemptForVersion = (versionId) => (
        versionId === alternateAttempt.attempt.versionId ? alternateAttempt : activeAttempt
      );
      const attemptForId = (attemptId) => (
        attemptId === alternateAttempt.attempt.attemptId ? alternateAttempt : activeAttempt
      );

      window.DueDiligencePhase2Config = { workerUrl: 'https://browser-qa.invalid' };
      window.DueDiligencePrivateWorkspace = {
        generation: () => 1,
        scopedKey: (namespace, key) => `${storagePrefix}${key}`,
        registerReset: () => {},
      };
      window.DueDiligencePhase4 = {
        getSession: () => ({
          access_token: 'browser-qa-session',
          user: { id: 'browser-qa-user', email: 'browser-qa@example.invalid' },
        }),
        request: async (path, options = {}) => {
          const operation = options.body?.operation;
          if (path === '/examinations/query' && operation === 'subject_catalog') {
            return { data: { items: catalogItems } };
          }
          if (path === '/examinations/query' && operation === 'subject_next') {
            return { data: {
              exhausted: false,
              setup: {
                versionId: activeAttempt.attempt.versionId,
                track: 'per_subject',
                subject: selectedSubject,
                title: activeAttempt.examination.title,
                questionCount: 1,
                timerMode: 'selfPaced',
              },
            } };
          }
          if (path === '/examinations/query' && operation === 'subject_performance') {
            const resumable = proofState === 'queue-open';
            return { data: {
              attemptedQuestions: resumable ? 1 : 0,
              completedQuestions: 0,
              skippedQuestions: resumable ? 0 : 1,
              unassistedCompletedQuestions: 0,
              unassistedAverageScore: null,
              flaggedForLater: [{
                attemptId: activeAttempt.attempt.attemptId,
                versionId: activeAttempt.attempt.versionId,
                questionId: activeAttempt.questions[0].questionId,
                subject: selectedSubject,
                topic: 'Civil obligations',
                prompt: activeAttempt.questions[0].prompt,
                answerText: savedDraft,
                status: resumable ? 'in_progress' : 'cancelled',
                resumable,
                queuedAt: '2026-08-17T19:30:00.000+08:00',
                skippedAt: resumable ? null : '2026-08-17T19:30:00.000+08:00',
              }],
              recentAttempts: [],
            } };
          }
          if (path === '/examinations/query' && operation === 'resume') {
            return { data: structuredClone(attemptForId(options.body?.attemptId)) };
          }
          if (path === '/examinations/command' && operation === 'start_attempt') {
            return { data: structuredClone(attemptForVersion(options.body?.versionId)) };
          }
          if (path === '/examinations/command' && operation === 'flag_response') {
            const attempt = attemptForId(options.body?.attemptId);
            const question = attempt.questions[0];
            question.flagged = options.body?.flagged === true;
            question.revision = Number(options.body?.expectedRevision || 0) + 1;
            return { data: {
              questionId: question.questionId,
              answerText: question.answerText,
              flagged: question.flagged,
              revision: question.revision,
              savedAt: new Date().toISOString(),
              remainingSeconds: null,
            } };
          }
          if (path === '/examinations/command' && operation === 'subject_skip_question') {
            return { data: {
              skipped: true,
              replayed: false,
              attemptId: activeAttempt.attempt.attemptId,
              skippedAt: new Date().toISOString(),
              flaggedForLater: activeAttempt.questions[0].flagged === true,
              setup: {
                versionId: alternateAttempt.attempt.versionId,
                track: 'per_subject',
                subject: selectedSubject,
                title: alternateAttempt.examination.title,
                timerMode: 'selfPaced',
              },
            } };
          }
          if (path === '/examinations/command' && operation === 'subject_reveal_review') {
            const reviewAttempt = attemptForId(options.body?.attemptId);
            reviewRequestCount += 1;
            if (failFirstReview && reviewRequestCount === 1) {
              throw new Error('The review response was interrupted for deterministic QA.');
            }
            return { data: {
              attemptId: reviewAttempt.attempt.attemptId,
              questionId: reviewAttempt.questions[0].questionId,
              assisted: true,
              assistanceKnown: true,
              reviewMaterialRevealedAt: new Date().toISOString(),
              suggestedAnswer: 'A civil obligation is a juridical necessity to give, to do, or not to do. Its essential elements are an active subject, a passive subject, a prestation, and an efficient cause or juridical tie.',
              legalBasis: 'Civil Code, Article 1156.',
              doctrine: 'An obligation requires identified parties, a determinate prestation, and a juridical tie recognized by law.',
              legalReview: {
                controllingLawAndDoctrine: 'Article 1156 defines an obligation as a juridical necessity to give, to do, or not to do. The relation requires an obligee, an obligor, a prestation, and a juridical tie.',
                authorityReferences: ['Civil Code, Article 1156'],
                jurisprudence: [],
                applicationToFacts: 'The question asks for the governing definition and each constituent element, so a complete answer should identify all four elements separately.',
                materialExceptionsOrLimits: 'The labels used for the parties may vary, but the underlying juridical roles and enforceable prestation must remain clear.',
                finalConclusion: 'A complete response states the statutory definition and identifies all four essential elements.',
              },
              sources: [{
                title: 'Civil Code of the Philippines',
                url: 'https://lawphil.net/statutes/repacts/ra1949/ra_386_1949.html',
                host: 'lawphil.net',
                verifiedOfficial: true,
              }],
            } };
          }
          if (path === '/examinations/command' && operation === 'save_response') {
            const attempt = attemptForId(options.body?.attemptId);
            const question = attempt.questions[0];
            question.answerText = String(options.body?.answerText || '');
            question.flagged = options.body?.flagged === true;
            question.revision = Number(options.body?.expectedRevision || 0) + 1;
            return { data: {
              answerText: question.answerText,
              flagged: question.flagged,
              revision: question.revision,
              savedAt: new Date().toISOString(),
              remainingSeconds: null,
            } };
          }
          if (path === '/examinations/command' && operation === 'heartbeat') {
            return { data: { remainingSeconds: null, elapsedSeconds: 0 } };
          }
          return { data: { items: [] } };
        },
        openSignIn: () => {},
      };
      window.showPage = () => {};
      window.toast = () => {};
    })();
  </script>
  <script src="../../assets/examinations.js"></script>
  <script>
    addEventListener('load', async () => {
      await window.DueDiligenceExaminations.openPerSubject();
      if (['room', 'flagged'].includes(window.__DD_SUBJECT_QA_STATE)) {
        document.querySelector('[data-subject-start]')?.click();
      } else if (['queue', 'queue-open'].includes(window.__DD_SUBJECT_QA_STATE)) {
        document.querySelector('[data-subject-performance]')?.click();
      }
    }, { once: true });
  </script>
</body>
</html>
