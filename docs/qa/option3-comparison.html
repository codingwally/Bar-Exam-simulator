<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Option 3 — Reference and Implementation Comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #ebe7de; color: #16243a; font-family: Arial, sans-serif; }
    main { width: min(100%, 1360px); margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 6px; font: 600 22px/1.2 Georgia, serif; }
    p { margin: 0 0 18px; color: #566274; font-size: 13px; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .surface { overflow: hidden; aspect-ratio: 1487 / 1058; border: 1px solid #b9b1a3; background: #041d3b; box-shadow: 0 12px 30px rgba(15, 23, 42, .14); }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .implementation { position: relative; }
    iframe { position: absolute; top: 0; left: 0; width: 1487px; height: 1058px; border: 0; transform: scale(.425); transform-origin: top left; }
    @media (max-width: 760px) { .comparison { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Subject Matter Option 3 fidelity comparison</h1>
    <p>Same active Subject Matter composition. The production header may differ; answer-left and review-right geometry is the acceptance focus.</p>
    <section class="comparison">
      <figure><figcaption>Approved reference</figcaption><div class="surface"><img src="option3-approved-reference.jpg" alt="Approved Option 3 Subject Matter design"></div></figure>
      <figure><figcaption>Current implementation</figcaption><div class="surface implementation"><iframe src="option3-subject-matter-fixture.html?state=room" title="Current Subject Matter implementation"></iframe></div></figure>
    </section>
  </main>
</body>
</html>
