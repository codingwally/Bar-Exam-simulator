name: Emergency Examination Room guaranteed answer upload release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-submit-receipt-20260922.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PRODUCTION_BASE_SHA: 3d568cca4b67badd610dd93d402d5dc7978f77f9
  RELEASE_SOURCE_SHA: 0ff2c457eddd2547738112600954df0286cac4fc
  SITE_URL: https://duediligence.ph
  APPROVAL_REFERENCE: owner-chat-hotfix-2026-09-22-examination-guaranteed-answer-upload

jobs:
  deploy:
    name: Verify and deploy Examination Room guaranteed answer upload hotfix
    if: "${{ github.event.head_commit.message == 'release: deploy Examination Room guaranteed answer upload hotfix' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact production hotfix source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove isolated production scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git cat-file -e "$PRODUCTION_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$RELEASE_SOURCE_SHA"

          python - <<'PY'
          import os
          import subprocess

          base = os.environ['PRODUCTION_BASE_SHA']
          source = os.environ['RELEASE_SOURCE_SHA']
          expected = {
              'examination-room/api.js',
              'examination-room/api.demo.test.cjs',
              'examination-room/student.html',
              'examination-room/student.js',
              'examination-room/student.client.test.cjs',
              'service-worker.js',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..{source}'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f'Unexpected production hotfix scope. expected={sorted(expected)} actual={sorted(changed)}'
              )
          print('Exact six-file Examination Room guaranteed answer-upload hotfix scope verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate guaranteed answer upload and submission contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check examination-room/api.js
          node --check examination-room/student.js
          node --check service-worker.js
          node --test examination-room/api.demo.test.cjs
          node --test examination-room/student.client.test.cjs
          git diff --check "$PRODUCTION_BASE_SHA..$RELEASE_SOURCE_SHA"

      - name: Build and verify exact Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node scripts/test-pages-artifact.mjs
          grep -Fq "submission.submittedAt || submission.receivedAt || result.submittedAt || result.receivedAt || payload.clientCompletedAt" .pages-dist/examination-room/api.js
          grep -Fq "answerRevisions" .pages-dist/examination-room/api.js
          grep -Fq "restoreMostRecentAttemptOnStartup" .pages-dist/examination-room/student.js
          grep -Fq "SYNC_REQUIRED" .pages-dist/examination-room/student.js
          grep -Fq "failedAnswerOperationIds" .pages-dist/examination-room/api.js
          grep -Fq "scheduleQueueSync(kind === 'answer.changed' || kind === 'question.flag_changed' ? 0 : 180)" .pages-dist/examination-room/student.js
          grep -Fq "var pendingAnswers = remaining.filter" .pages-dist/examination-room/student.js
          grep -Fq "const finalAnswers = Array.isArray(payload.answers) ? payload.answers : [];" .pages-dist/examination-room/api.js
          grep -Fq "source: 'submission'" .pages-dist/examination-room/api.js
          grep -Fq "state.syncRequested = true" .pages-dist/examination-room/student.js
          grep -Fq "scheduleQueueSync(Math.min(5000, 250 * Math.pow(2, state.syncRetryCount)))" .pages-dist/examination-room/student.js
          grep -Fq 'api.js?v=guaranteed-answer-upload-20260922-4' .pages-dist/examination-room/student.html
          grep -Fq 'student.js?v=guaranteed-answer-upload-20260922-4' .pages-dist/examination-room/student.html
          grep -Fq 'duediligence-shell-examination-guaranteed-answer-upload-20260922-4' .pages-dist/service-worker.js
          test "$(cat .pages-dist/.well-known/duediligence-release.txt)" = "$RELEASE_SOURCE_SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload exact sanitized Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Examination Room guaranteed answer upload client
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            marker="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/.well-known/duediligence-release.txt?release=$RELEASE_SOURCE_SHA" || true)"
            api="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/api.js?v=guaranteed-answer-upload-20260922-4&release=$RELEASE_SOURCE_SHA" || true)"
            page="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.html?release=$RELEASE_SOURCE_SHA" || true)"
            sw="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/service-worker.js?v=examination-room-guaranteed-answer-upload-20260922-4&release=$RELEASE_SOURCE_SHA" || true)"

            if [[ "$marker" == "$RELEASE_SOURCE_SHA" ]] \
              && grep -Fq "submission.submittedAt || submission.receivedAt || result.submittedAt || result.receivedAt || payload.clientCompletedAt" <<<"$api" \
              && grep -Fq "failedAnswerOperationIds" <<<"$api" \
              && grep -Fq "const finalAnswers = Array.isArray(payload.answers) ? payload.answers : [];" <<<"$api" \
              && grep -Fq 'api.js?v=guaranteed-answer-upload-20260922-4' <<<"$page" \
              && grep -Fq 'duediligence-shell-examination-guaranteed-answer-upload-20260922-4' <<<"$sw"; then
              echo "Examination Room guaranteed answer upload hotfix is live."
              exit 0
            fi
            sleep 10
          done
          echo "Pages deployed but the public guaranteed answer-upload hotfix verification did not converge in time." >&2
          exit 1
