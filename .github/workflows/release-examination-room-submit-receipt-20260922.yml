name: Examination Room direct-submit recovery release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-submit-receipt-20260922.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PRODUCTION_BASE_SHA: 85983df71d2d03875bee1ce0f0e4e4547bf5700e
  RELEASE_SOURCE_SHA: 2068b8cbe2f5f9b8924dabad8173d0ff9deaac1f
  SITE_URL: https://duediligence.ph
  APPROVAL_REFERENCE: owner-chat-direct-submit-recovery-2026-09-22

jobs:
  deploy:
    name: Verify and deploy Examination Room direct-submit recovery
    if: "${{ github.event.head_commit.message == 'release: deploy Examination Room direct-submit recovery' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact production hotfix source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove isolated production scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git cat-file -e "$PRODUCTION_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$RELEASE_SOURCE_SHA"

          python - <<'PY'
          import os
          import subprocess

          base = os.environ['PRODUCTION_BASE_SHA']
          source = os.environ['RELEASE_SOURCE_SHA']
          expected = {
              'examination-room/student.client.test.cjs',
              'examination-room/student.html',
              'examination-room/student.js',
              'examination-room/submission-recovery.client.test.cjs',
              'examination-room/submission-recovery.html',
              'examination-room/submission-recovery.js',
              'service-worker.js',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..{source}'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f'Unexpected production hotfix scope. expected={sorted(expected)} actual={sorted(changed)}'
              )
          print('Exact Examination Room direct-submit recovery scope verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate direct-submit and recovery flow
        shell: bash
        run: |
          set -euo pipefail
          node --check examination-room/student.js
          node --check examination-room/submission-recovery.js
          node --check service-worker.js
          node --test examination-room/student.client.test.cjs examination-room/submission-recovery.client.test.cjs
          git diff --check "$PRODUCTION_BASE_SHA..$RELEASE_SOURCE_SHA"
          grep -Fq "Final submission must never wait behind the ordinary autosave/integrity" examination-room/student.js
          ! grep -A12 -F "async function retryPendingSubmission()" examination-room/student.js | grep -Fq "await flushOperationQueue();"

      - name: Build and verify exact Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node scripts/test-pages-artifact.mjs
          grep -Fq "Final submission must never wait behind the ordinary autosave/integrity" .pages-dist/examination-room/student.js
          grep -Fq "state.api.submitAttempt" .pages-dist/examination-room/submission-recovery.js
          grep -Fq "Download copy and submit now" .pages-dist/examination-room/submission-recovery.html
          grep -Fq 'student.js?v=submission-recovery-20260922-8' .pages-dist/examination-room/student.html
          grep -Fq 'duediligence-shell-examination-submission-recovery-20260922-8' .pages-dist/service-worker.js
          test "$(cat .pages-dist/.well-known/duediligence-release.txt)" = "$RELEASE_SOURCE_SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload exact sanitized Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Examination Room direct-submit recovery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            marker="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/.well-known/duediligence-release.txt?release=$RELEASE_SOURCE_SHA" || true)"
            student="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.js?v=submission-recovery-20260922-8&release=$RELEASE_SOURCE_SHA" || true)"
            recovery="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/submission-recovery.js?v=submission-recovery-20260922-8&release=$RELEASE_SOURCE_SHA" || true)"
            recovery_page="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/submission-recovery.html?release=$RELEASE_SOURCE_SHA" || true)"
            student_page="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.html?release=$RELEASE_SOURCE_SHA" || true)"
            sw="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/service-worker.js?v=submission-recovery-20260922-8&release=$RELEASE_SOURCE_SHA" || true)"

            if [[ "$marker" == "$RELEASE_SOURCE_SHA" ]] \
              && grep -Fq "Final submission must never wait behind the ordinary autosave/integrity" <<<"$student" \
              && grep -Fq "state.api.submitAttempt" <<<"$recovery" \
              && grep -Fq "Download copy and submit now" <<<"$recovery_page" \
              && grep -Fq 'student.js?v=submission-recovery-20260922-8' <<<"$student_page" \
              && grep -Fq 'duediligence-shell-examination-submission-recovery-20260922-8' <<<"$sw"; then
              echo "Examination Room direct-submit recovery is live."
              exit 0
            fi
            sleep 10
          done
          echo "Pages deployed but direct-submit recovery did not converge in time." >&2
          exit 1
