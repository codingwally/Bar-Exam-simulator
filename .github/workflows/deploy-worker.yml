name: Deploy Gemini examiner Worker

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this production Worker release has explicit approval"
        required: true
        default: false
        type: boolean
      approval_reference:
        description: "Approval/change reference recorded in the release log"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "production-gemini-examiner-worker"
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm approved production release
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch and explicit confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production releases may only run from main." >&2
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION" != "true" ]]; then
            echo "Explicit production confirmation is required." >&2
            exit 1
          fi
          if [[ -z "${APPROVAL_REFERENCE//[[:space:]]/}" ]]; then
            echo "A non-empty approval/change reference is required." >&2
            exit 1
          fi

  deploy:
    needs: authorize
    environment:
      name: production-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify Worker and private-beta contracts
        run: |
          node --check worker/index.mjs
          node --check worker/commercial-entry.mjs
          node --test worker/*.test.mjs
          node scripts/test-website-question-bank.mjs
          node scripts/test-private-beta-admission.mjs
          node scripts/test-duediligence-2026-migrations.mjs
          node scripts/test-commercial-launch-migration.mjs
          node scripts/test-examination-room-2-migration.mjs
          node scripts/test-examination-room-past-exam-removal.mjs
          node scripts/test-examination-room-professor-virtual-room.mjs
          node scripts/test-examination-room-class-results.mjs
          node scripts/test-examination-room-five-step-revision-migration.mjs
          node scripts/test-import-duediligence-2026-content.mjs
          node scripts/validate-duediligence-2026-content.mjs

      - name: Verify production notification secrets exist
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['RESEND_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Required production Worker secrets are missing: ' + missing.join(', ')); process.exit(1); } console.log('Required payment-notification secrets are configured.'); });"

      - name: Ensure the student-code encryption key exists
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@4.114.0 secret list --format json \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const secrets = JSON.parse(value); process.exit(secrets.some(item => item.name === 'EXAM_ROOM_STUDENT_CODE_KEY_V1') ? 0 : 1); });"
          then
            echo "Student-code encryption key is already configured."
          else
            student_code_key="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('base64url'))")"
            printf '%s' "$student_code_key" \
              | npx --yes wrangler@4.114.0 secret put EXAM_ROOM_STUDENT_CODE_KEY_V1
            unset student_code_key
            echo "Student-code encryption key was created without printing its value."
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy
