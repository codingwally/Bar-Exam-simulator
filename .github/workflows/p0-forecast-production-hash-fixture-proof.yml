name: P0 Forecast production hash-fixture first-submit proof

on:
  push:
    branches:
      - hotfix/p0-production-first-submit-proof-20260903
    paths:
      - .github/workflows/p0-forecast-production-hash-fixture-proof.yml

permissions:
  contents: read

concurrency:
  group: p0-forecast-production-hash-fixture-proof
  cancel-in-progress: true

jobs:
  prove:
    name: Create internal Auth fixture, onboard, and submit once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: https://hbllomlijfznnuudpdvr.supabase.co
      WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
      ALLOWED_ORIGIN: https://duediligence.ph
      TERMS_VERSION: terms-soft-launch-v1-2026-08-21
      PRIVACY_VERSION: privacy-soft-launch-v1-2026-08-21
      DISCLOSURE_VERSION: trial-tokens-v1-2026-08-21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate hidden credential and publish only its one-way hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-production-hash-fixture
          npm install --no-save --no-package-lock bcryptjs@2.4.3
          node --input-type=module <<'NODE'
          import { randomBytes, randomUUID } from 'node:crypto';
          import { appendFile, writeFile } from 'node:fs/promises';
          import bcrypt from 'bcryptjs';

          const userId = randomUUID();
          const email = `p0-hash-${process.env.GITHUB_RUN_ID}@duediligence.ph`;
          const password = `Dd!${randomBytes(40).toString('base64url')}9z`;
          const bcryptHash = bcrypt.hashSync(password, 10);
          process.stdout.write(`::add-mask::${password}\n`);
          process.stdout.write(`::add-mask::${userId}\n`);
          await appendFile(process.env.GITHUB_ENV, [
            `P0_USER_ID=${userId}`,
            `P0_USER_EMAIL=${email}`,
            `P0_USER_PASSWORD=${password}`,
          ].join('\n') + '\n');
          await writeFile(
            'artifacts/p0-production-hash-fixture/setup.json',
            JSON.stringify({ userId, email, bcryptHash, runId: process.env.GITHUB_RUN_ID }, null, 2),
          );
          NODE

      - name: Upload non-secret fixture setup data
        uses: actions/upload-artifact@v4
        with:
          name: p0-forecast-production-hash-setup-${{ github.run_id }}
          path: artifacts/p0-production-hash-fixture/setup.json
          if-no-files-found: error
          retention-days: 1

      - name: Wait for connected production database to install the exact fixture
        shell: bash
        run: |
          set -euo pipefail
          publishable_key="$(grep -Eo 'sb_publishable_[A-Za-z0-9_-]{20,}' assets/phase2-config.js | head -n 1)"
          [[ "$publishable_key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]
          echo "::add-mask::$publishable_key"
          echo "P0_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"

          authenticated=false
          for attempt in {1..120}; do
            token_file="$RUNNER_TEMP/p0-token.json"
            token_status="$(curl --silent --show-error --output "$token_file" --write-out '%{http_code}' \
              --request POST \
              --header "apikey: $publishable_key" \
              --header "Authorization: Bearer $publishable_key" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg email "$P0_USER_EMAIL" --arg password "$P0_USER_PASSWORD" '{email:$email,password:$password}')" \
              "$SUPABASE_URL/auth/v1/token?grant_type=password")"
            if [[ "$token_status" == '200' ]] && jq -e '.access_token | type == "string" and length > 20' "$token_file" >/dev/null; then
              access_token="$(jq -r '.access_token' "$token_file")"
              echo "::add-mask::$access_token"
              echo "P0_ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"
              authenticated=true
              rm -f -- "$token_file"
              break
            fi
            rm -f -- "$token_file"
            sleep 5
          done
          test "$authenticated" = 'true'
          echo 'The exact short-lived production Auth fixture is installed and authenticated.'

      - name: Complete real onboarding and token acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          onboarding_file="$RUNNER_TEMP/p0-onboarding.json"
          onboarding_status="$(curl --silent --show-error --output "$onboarding_file" --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $P0_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $P0_ACCESS_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc \
              --arg terms "$TERMS_VERSION" \
              --arg privacy "$PRIVACY_VERSION" \
              --arg disclosure "$DISCLOSURE_VERSION" \
              '{p_display_name:"Forecast P0 Production Proof",p_law_school_id:"other",p_law_school_other:"Internal release testing",p_category:"review",p_professor_license_number:null,p_terms_version:$terms,p_privacy_version:$privacy,p_trial_disclosure_version:$disclosure,p_trial_acknowledged:true}')" \
            "$SUPABASE_URL/rest/v1/rpc/complete_commercial_profile_onboarding_v2")"
          if [[ "$onboarding_status" != '200' ]]; then
            echo "Authenticated onboarding failed with HTTP $onboarding_status." >&2
            jq -c '{code:(.code // "unknown"),message:(.message // "onboarding failed")}' "$onboarding_file" >&2 || true
            exit 1
          fi
          jq -e '.allowed == true and .unlimited == true and .profileCompleted == true and .tokenAcknowledgementRequired == false' \
            "$onboarding_file" >/dev/null
          rm -f -- "$onboarding_file"
          echo 'The fixture completed the same onboarding and token acknowledgement required from a real user.'

      - name: Submit all 20 answers exactly once and require complete coaching
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';

          const endpoint = `${process.env.WORKER_URL}/admin/dd2026/bar-forecast`;
          const token = process.env.P0_ACCESS_TOKEN;
          const subject = 'Political and Public International Law';
          const runId = process.env.GITHUB_RUN_ID;
          let submitRequests = 0;

          async function call(body) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                Origin: process.env.ALLOWED_ORIGIN,
                'Content-Type': 'application/json',
                'X-Request-ID': crypto.randomUUID(),
              },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(body.operation === 'submit' ? 15 * 60_000 : 60_000),
            });
            const payload = await response.json().catch(() => null);
            if (!response.ok) {
              const code = String(payload?.error?.code || `HTTP_${response.status}`)
                .replace(/[^A-Z0-9_]/gu, '')
                .slice(0, 80);
              throw new Error(`${body.operation.toUpperCase()}_${code || 'FAILED'}`);
            }
            return { response, payload };
          }

          const status = await call({ operation: 'status' });
          assert.equal(status.payload?.authorized, true);
          assert.equal(status.payload?.consentAccepted, true);

          const started = await call({ operation: 'start', subject });
          assert.match(String(started.payload?.setId || ''), /^sha256:[0-9a-f]{64}$/u);
          assert.equal(Array.isArray(started.payload?.questions), true);
          assert.equal(started.payload.questions.length, 20);

          const answers = started.payload.questions.map((question, index) => ({
            questionId: question.id,
            answer: `P0PROD-${runId}-Q${index + 1}. Yes. Applying the controlling rule to every material fact, the requested conclusion follows from the stated legal basis.`,
          }));
          submitRequests += 1;
          const submittedAt = Date.now();
          const submitted = await call({
            operation: 'submit',
            subject,
            setId: started.payload.setId,
            answers,
          });
          const durationMs = Date.now() - submittedAt;

          assert.equal(submitRequests, 1);
          assert.equal(submitted.response.status, 200);
          assert.equal(submitted.payload?.ok, true);
          assert.equal(submitted.payload?.maxScore, 100);
          assert.equal(submitted.payload?.analytics?.questionCount, 20);
          assert.equal(Array.isArray(submitted.payload?.results), true);
          assert.equal(submitted.payload.results.length, 20);
          submitted.payload.results.forEach((result, index) => {
            assert.equal(result.questionId, answers[index].questionId);
            assert.ok(String(result.userAnswer || '').includes(`P0PROD-${runId}-Q${index + 1}`));
            assert.ok(String(result.feedback || '').trim());
            assert.ok(String(result.suggestedAnswer || '').trim());
            assert.ok(String(result.explanation || '').trim());
            assert.ok(String(result.mockBarCoaching?.strength || '').trim());
            assert.ok(String(result.mockBarCoaching?.priorityImprovement || '').trim());
            assert.ok(String(result.mockBarCoaching?.nextStep || '').trim());
          });

          await fetch(`${process.env.SUPABASE_URL}/auth/v1/logout?scope=global`, {
            method: 'POST',
            headers: {
              apikey: process.env.P0_PUBLISHABLE_KEY,
              Authorization: `Bearer ${token}`,
            },
            signal: AbortSignal.timeout(30_000),
          }).catch(() => null);

          await writeFile(
            'artifacts/p0-production-hash-fixture/result.json',
            JSON.stringify({
              ok: true,
              environment: 'production',
              firstAttempt: true,
              submitRequests,
              submitStatus: submitted.response.status,
              durationMs,
              resultCount: submitted.payload.results.length,
              coachingComplete: submitted.payload.results.every((result) => (
                Boolean(String(result.feedback || '').trim())
                && Boolean(String(result.suggestedAnswer || '').trim())
                && Boolean(String(result.explanation || '').trim())
              )),
            }, null, 2),
          );
          NODE
          cat artifacts/p0-production-hash-fixture/result.json

      - name: Upload sanitized result proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-forecast-production-hash-result-${{ github.run_id }}
          path: artifacts/p0-production-hash-fixture/result.json
          if-no-files-found: warn
          retention-days: 30
