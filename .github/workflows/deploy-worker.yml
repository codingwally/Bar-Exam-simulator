name: Deploy Gemini examiner Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - "content/question-bank/website-upload.json"
      - "scripts/import-website-upload.mjs"
      - "scripts/test-website-question-bank.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "gemini-examiner-worker"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify Worker and private-beta contracts
        run: |
          node --check worker/index.mjs
          node --test worker/*.test.mjs
          node scripts/test-website-question-bank.mjs
          node scripts/test-private-beta-admission.mjs
          node scripts/test-duediligence-2026-migrations.mjs
          node scripts/test-import-duediligence-2026-content.mjs
          node scripts/validate-duediligence-2026-content.mjs

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy
