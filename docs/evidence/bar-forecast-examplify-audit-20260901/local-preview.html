<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Synthetic UI QA Harness — Not the 2026 Bar Forecast</title>
  <link rel="stylesheet" href="../../../assets/bar-forecast.css">
  <style>
    :root {
      color-scheme: light;
      --preview-navy: #071a31;
      --preview-gold: #c9a54a;
      --preview-paper: #f6f1e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #132238;
      background:
        radial-gradient(circle at 50% -12rem, rgba(201, 165, 74, 0.2), transparent 34rem),
        var(--preview-paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .preview-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .preview-card {
      width: min(720px, 100%);
      padding: clamp(1.5rem, 4vw, 3rem);
      border: 1px solid rgba(201, 165, 74, 0.72);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 24px 64px rgba(7, 26, 49, 0.14);
    }

    .preview-eyebrow {
      margin: 0 0 0.6rem;
      color: #8a6918;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .preview-card h1 {
      margin: 0;
      color: var(--preview-navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
    }

    .preview-card p { line-height: 1.65; }

    .preview-open {
      min-height: 44px;
      padding: 0.75rem 1.1rem;
      border: 1px solid var(--preview-gold);
      border-radius: 10px;
      color: #fff;
      background: var(--preview-navy);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .synthetic-qa-banner {
      position: fixed;
      z-index: 2147483647;
      inset: 0 0 auto;
      padding: 8px 14px;
      border-bottom: 2px solid #7c1f1f;
      background: #fff1f1;
      color: #721c24;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <section class="preview-card" aria-labelledby="preview-title">
      <p class="preview-eyebrow">Synthetic test only — not the product</p>
      <h1 id="preview-title">Forecast UI QA harness</h1>
      <p>
        This page supplies only invented interface-test questions and deterministic mock grading.
        It never loads real Forecast questions. Use it only to test buttons and layout.
      </p>
      <button class="preview-open" id="open-forecast" type="button">Open synthetic UI test</button>
    </section>
  </main>

  <script>
    (() => {
      document.documentElement.dataset.ddBarForecastQa = 'synthetic';
      window.__DD_BAR_FORECAST_SYNTHETIC_QA__ = '2026-09-01';
      const questions = Array.from({ length: 20 }, (_, index) => {
        const number = index + 1;
        return Object.freeze({
          id: `SYNTHETIC-UI-${String(number).padStart(2, '0')}`,
          number,
          prompt: `Synthetic interface-test question ${number}. Assume a fictional public office issued Mock Permit ${number} after a clearly stated notice and hearing. Should the permit be treated as valid solely for this interaction test? Explain your yes-or-no answer using one fictional rule.`,
        });
      });

      let consentAccepted = false;

      const session = Object.freeze({
        access_token: 'local-preview-token',
        user: Object.freeze({ id: 'local-preview-admin' }),
      });

      const delay = (milliseconds = 90) => new Promise((resolve) => setTimeout(resolve, milliseconds));

      async function request(_endpoint, options) {
        options = options || {};
        const body = options.body || {};
        await delay(body.operation === 'submit' ? 1200 : 90);

        if (body.operation === 'status') {
          return { authorized: true, consentAccepted };
        }

        if (body.operation === 'accept') {
          consentAccepted = body.version === '2026-09-01';
          return { authorized: true, consentAccepted };
        }

        if (body.operation === 'start') {
          return {
            authorized: true,
            subject: body.subject,
            sourceVersion: '2026.3',
            contentType: 'bar_forecast_question',
            setId: `sha256:${'1'.repeat(64)}`,
            schedule: { date: 'Synthetic date', time: 'Anytime' },
            questions,
          };
        }

        if (body.operation === 'submit') {
          const answers = new Map((body.answers || []).map((entry) => [entry.questionId, entry.answer]));
          const results = questions.map((question, index) => {
            const score = [5, 4, 3, 2][index % 4];
            const issueScore = [4.5, 4, 3, 2][index % 4];
            const grammarScore = [4, 3.5, 3, 2.5][index % 4];
            const userAnswer = answers.get(question.id) || '';
            return {
              questionId: question.id,
              number: question.number,
              score,
              maxScore: 5,
              feedback: `Synthetic coaching for interface test ${question.number}: the response reached the minimum and used a direct yes-or-no opening.`,
              userAnswer,
              suggestedAnswer: `Yes. Under Fictional Rule ${question.number}, a mock permit issued after the stated notice and hearing is treated as valid for this interface test. Thus, Mock Permit ${question.number} is valid for this synthetic exercise.`,
              explanation: 'This is deterministic mock output for visual and interaction testing only; it is not legal content or legal advice.',
              mockBarCoaching: {
                strength: 'The answer gives a direct conclusion and stays responsive to the stated facts.',
                priorityImprovement: score < 4
                  ? 'State the complete fictional rule before applying each decisive fact.'
                  : 'Make the transition from rule to application more explicit.',
                nextStep: 'Use one sentence for the issue, one for the rule, two for application, and one for the conclusion.',
              },
              grammar: {
                score: grammarScore,
                maxScore: 5,
                corrections: userAnswer.includes('This synthetic answer')
                  ? [{
                    original: 'Yes. This synthetic answer',
                    category: 'punctuation',
                    guidance: 'Review punctuation in this exact excerpt.',
                  }]
                  : [],
              },
              issueSpotting: {
                score: issueScore,
                maxScore: 5,
                identified: ['notice and hearing'],
                missed: score < 4 ? [`Fictional Rule ${question.number}`] : [],
                coaching: 'Frame the issue as a precise validity question tied to the decisive procedural facts.',
              },
            };
          });
          const average = (selector) => Number((
            results.reduce((total, result) => total + selector(result), 0) / results.length
          ).toFixed(1));
          return {
            authorized: true,
            subject: body.subject,
            totalScore: results.reduce((total, result) => total + result.score, 0),
            maxScore: 100,
            analytics: {
              questionCount: results.length,
              averageScore: average((result) => result.score),
              issueSpottingAverage: average((result) => result.issueSpotting.score),
              grammarAverage: average((result) => result.grammar.score),
              diagnosticMaxScore: 5,
              performanceBands: {
                strong: results.filter((result) => result.score >= 4).length,
                developing: results.filter((result) => result.score >= 2.5 && result.score < 4).length,
                needsFocus: results.filter((result) => result.score < 2.5).length,
              },
            },
            results,
          };
        }

        throw new Error('Unsupported local-preview operation.');
      }

      window.confirm = () => true;
      window.DueDiligencePhase4 = Object.freeze({
        getSession: () => session,
        ensureRequiredSetup: async () => true,
        request,
      });

      document.getElementById('open-forecast').addEventListener('click', (event) => {
        window.openBarForecast?.(event.currentTarget);
        const root = document.getElementById('bf26-root');
        if (root && !root.querySelector('.synthetic-qa-banner')) {
          const banner = document.createElement('div');
          banner.className = 'synthetic-qa-banner';
          banner.setAttribute('role', 'status');
          banner.textContent = 'Synthetic UI QA harness — not real Forecast questions or grading';
          root.append(banner);
        }
      });
    })();
  </script>
  <script src="../../../assets/bar-forecast.js"></script>
</body>
</html>
