name: Trusted staging E2E release gate

on:
  workflow_dispatch:
    inputs:
      deploy_greenfield:
        description: "Deploy the reviewed Worker and static artifact to staging before verification"
        required: true
        default: false
        type: boolean
      smoke_greenfield:
        description: "Verify the deployed greenfield static routes and public error contracts"
        required: true
        default: true
        type: boolean
      approval_reference:
        description: "Required approval/change reference when deploy_greenfield is selected"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging-e2e:
    name: Protected staging release gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'codingwally/Bar-Exam-simulator' &&
      github.actor != 'dependabot[bot]'
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Enforce repository and trusted release branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_NAME: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ACTOR: ${{ github.actor }}
          DEPLOY_GREENFIELD: ${{ inputs.deploy_greenfield }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$REPOSITORY_NAME" = "codingwally/Bar-Exam-simulator"
          test "$RELEASE_ACTOR" != "dependabot[bot]"
          case "$RELEASE_REF" in
            refs/heads/main|refs/heads/agent/master-experience-release-20260813|refs/heads/agent/header-subject-review-correction-20260814|refs/heads/agent/subject-matter-split-review-20260814|refs/heads/agent/high-value-subject-review-20260815|refs/heads/agent/homepage-feature-ledger-20260815|refs/heads/agent/commercial-launch-20260818|refs/heads/agent/commercial-terms-acceptance-hotfix-20260818|refs/heads/agent/commercial-terms-worker-persistence-20260818|refs/heads/agent/renovation-commercial-cutover-20260820|refs/heads/agent/soft-launch-five-token-20260821|refs/heads/codex/examination-room-greenfield-20260826|refs/heads/codex/examination-room-owner-command-center-20260826) ;;
            *)
              echo "The staging gate may run only from an explicitly trusted release branch." >&2
              exit 1
              ;;
          esac
          if [[ "$DEPLOY_GREENFIELD" == "true" && -z "${APPROVAL_REFERENCE//[[:space:]]/}" ]]; then
            echo "A non-empty approval/change reference is required before a staging deployment." >&2
            exit 1
          fi
          echo "Trusted manual staging dispatch accepted."

      - name: Checkout trusted release ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        if: inputs.deploy_greenfield == true
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify greenfield release contracts before staging deploy
        if: inputs.deploy_greenfield == true
        run: |
          node --check examination-room/api.js
          node --check examination-room/professor.js
          node --check examination-room/student.js
          node --check worker/index.mjs
          node --check worker/examination-room-v1-core.mjs
          node --check worker/examination-room-v1-routes.mjs
          node --test examination-room/*.test.cjs
          node --test admin/examination-room-admin.test.cjs
          node --test worker/*.test.mjs
          node scripts/test-examination-room-database.mjs
          node scripts/test-examination-room-commercial-stress.mjs
          node scripts/test-examination-room-door-menu.mjs
          node scripts/test-examination-room-release-workflows.mjs
          node scripts/test-feature-decommission-boundary.mjs
          node scripts/build-pages-artifact.mjs
          node scripts/test-pages-artifact.mjs

      - name: Apply and probe only the ordered Examination Room migrations
        if: inputs.deploy_greenfield == true
        env:
          EXAMINATION_ROOM_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_STAGING_DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXAMINATION_ROOM_DATABASE_URL"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
          psql --version
          release_bundle="$RUNNER_TEMP/examination-room-release.sql"
          node scripts/build-examination-room-release-bundle.mjs --output "$release_bundle"
          psql "$EXAMINATION_ROOM_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$release_bundle"
          rm -f -- "$release_bundle"

      - name: Verify staging Examination Room secrets exist
        if: inputs.deploy_greenfield == true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json --name duediligence-examinations-staging \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['SUPABASE_SERVICE_ROLE_KEY', 'EXAMINATION_ROOM_KEY_PEPPER', 'EXAMINATION_ROOM_OWNER_DATA_KEY_V1', 'EXAMINATION_ROOM_BACKUP_MASTER_KEY_V1', 'EXAMINATION_ROOM_ADMIN_EMAILS']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Required staging Worker secrets are missing: ' + missing.join(', ') + '. Configure the missing release secret; never rotate it during deploy.'); process.exit(1); } console.log('Required staging Examination Room secrets are configured.'); });"
          grep -F 'binding = "EXAMINATION_ROOM_BACKUPS"' wrangler.staging.toml
          npx --yes wrangler@4.114.0 r2 bucket list \
            | grep -F 'duediligence-examination-room-backups-staging'
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/duediligence-examination-room-backups-staging/lifecycle" \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const body = JSON.parse(value); const rules = body?.result?.rules; const minimumAge = 365 * 24 * 60 * 60; const ready = Array.isArray(rules) && rules.some(rule => rule?.enabled === true && rule?.conditions?.prefix === 'examination-room-recovery/v1/' && rule?.deleteObjectsTransition?.condition?.type === 'Age' && Number(rule.deleteObjectsTransition.condition.maxAge) >= minimumAge); if (!ready) { console.error('The staging recovery bucket needs an enabled 365-day-or-longer lifecycle rule for examination-room-recovery/v1/.'); process.exit(1); } console.log('Staging recovery lifecycle is configured for at least 365 days.'); });"

      - name: Resolve the approved staging publishable configuration
        if: inputs.deploy_greenfield == true
        env:
          CONFIGURED_STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          staging_publishable_key="$CONFIGURED_STAGING_PUBLISHABLE_KEY"
          if [[ -z "$staging_publishable_key" ]]; then
            staging_publishable_key="$(node --input-type=module -e "const response = await fetch('https://duediligence-examinations-staging.wallyesteban1993.workers.dev/assets/phase2-config.js', { headers: { 'cache-control': 'no-cache' } }); if (!response.ok) process.exit(1); const source = await response.text(); const match = source.match(/sb_publishable_[A-Za-z0-9_-]{20,}/); if (!match) process.exit(1); process.stdout.write(match[0]);")"
          fi
          if [[ ! "$staging_publishable_key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]; then
            echo "The approved staging publishable configuration is unavailable." >&2
            exit 1
          fi
          echo "::add-mask::$staging_publishable_key"
          echo "STAGING_SUPABASE_PUBLISHABLE_KEY=$staging_publishable_key" >> "$GITHUB_ENV"
          unset staging_publishable_key

      - name: Build and verify isolated staging artifact
        if: inputs.deploy_greenfield == true
        env:
          STAGING_PUBLIC_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
        run: node scripts/test-staging-artifact.mjs

      - name: Deploy reviewed Worker and static artifact to staging
        if: inputs.deploy_greenfield == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.staging.toml

      - name: Verify greenfield static routes and public error contracts
        if: inputs.deploy_greenfield == true || inputs.smoke_greenfield == true
        env:
          STAGING_EXAMINATION_ROOM_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        run: node scripts/test-examination-room-v1-staging-smoke.mjs

      - name: Verify staging-only endpoint contract
        run: node scripts/run-staging-e2e-suite.mjs --preflight

      - name: Complete beta staging suite
        id: complete_beta
        continue-on-error: true
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-staging-e2e-suite.mjs complete-beta

      - name: Due Diligence 2026 staging suite
        id: duediligence_2026
        continue-on-error: true
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-staging-e2e-suite.mjs duediligence-2026

      - name: Examinations staging suite
        id: examinations
        continue-on-error: true
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          node scripts/run-staging-e2e-suite.mjs examinations

      - name: Publish sanitized suite summary
        if: always()
        run: node scripts/run-staging-e2e-suite.mjs --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-sanitized-${{ github.run_id }}
          path: artifacts/staging-e2e/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce all three staging suites
        if: always()
        run: node scripts/run-staging-e2e-suite.mjs --enforce
