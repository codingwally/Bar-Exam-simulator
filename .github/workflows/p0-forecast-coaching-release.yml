name: Emergency P0 Forecast coaching release

on:
  push:
    branches:
      - hotfix/p0-forecast-coaching-release-20260903
      - main
    paths:
      - worker/bar-forecast-routes.mjs
      - worker/bar-forecast-coaching-release.test.mjs
      - .github/workflows/p0-forecast-coaching-release.yml

permissions:
  contents: read

concurrency:
  group: p0-forecast-coaching-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate unchanged coaching contract
    if: github.repository == 'codingwally/Bar-Exam-simulator'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Run Forecast coaching release contracts
        run: |
          set -euo pipefail
          node --check worker/bar-forecast-routes.mjs
          node --check worker/bar-forecast-coaching-release.test.mjs
          node --test \
            worker/bar-forecast-core.test.mjs \
            worker/bar-forecast-provider-policy.test.mjs \
            worker/bar-forecast-routes.test.mjs \
            worker/bar-forecast-coaching-release.test.mjs
          node scripts/test-bar-forecast-frontend.mjs
          node scripts/test-bar-forecast-boundary.mjs
          git diff --check HEAD^

  deploy_staging_and_prove_coaching:
    name: Deploy staging and complete one real 20-answer coaching journey
    if: github.ref == 'refs/heads/hotfix/p0-forecast-coaching-release-20260903'
    needs: validate
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify staging Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json --name duediligence-examinations-staging \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['GEMINI_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Required staging Forecast secrets are missing: ' + missing.join(', ')); process.exit(1); } });"

      - name: Resolve approved staging browser configuration
        env:
          CONFIGURED_STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          staging_publishable_key="$CONFIGURED_STAGING_PUBLISHABLE_KEY"
          if [[ -z "$staging_publishable_key" ]]; then
            staging_publishable_key="$(node --input-type=module -e "const response = await fetch('https://duediligence-examinations-staging.wallyesteban1993.workers.dev/assets/phase2-config.js', { headers: { 'cache-control': 'no-cache' } }); if (!response.ok) process.exit(1); const source = await response.text(); const match = source.match(/sb_publishable_[A-Za-z0-9_-]{20,}/); if (!match) process.exit(1); process.stdout.write(match[0]);")"
          fi
          [[ "$staging_publishable_key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]
          echo "::add-mask::$staging_publishable_key"
          echo "STAGING_SUPABASE_PUBLISHABLE_KEY=$staging_publishable_key" >> "$GITHUB_ENV"

      - name: Build and verify isolated staging artifact
        env:
          STAGING_PUBLIC_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
        run: node scripts/test-staging-artifact.mjs

      - name: Deploy exact candidate to staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.114.0'
          command: deploy --config wrangler.staging.toml

      - name: Verify staging Forecast boundary twice
        env:
          ADMIN_BAR_FORECAST_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          ADMIN_BAR_FORECAST_ALLOWED_ORIGIN: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        run: |
          node scripts/verify-admin-bar-forecast-deployment.mjs
          node scripts/verify-admin-bar-forecast-deployment.mjs

      - name: Prepare one-journey copy of the existing protected Forecast harness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('scripts/run-bar-forecast-live-journeys.mjs')
          target_path = Path('scripts/.p0-run-one-bar-forecast-live-journey.mjs')
          source = source_path.read_text(encoding='utf-8')
          replacements = {
              'const JOURNEY_COUNT = 30;': 'const JOURNEY_COUNT = 1;',
              'const BATCH_COUNT = 15;': 'const BATCH_COUNT = 1;',
              'const BATCH_SIZE = 2;': 'const BATCH_SIZE = 1;',
              'const DEFAULT_CONCURRENCY = 2;': 'const DEFAULT_CONCURRENCY = 1;',
              'const MAX_CONCURRENCY = 2;': 'const MAX_CONCURRENCY = 1;',
              "    assert.deepEqual(journeys.map((result) => result.batchMember).sort(), [1, 2]);":
                  "    assert.deepEqual(journeys.map((result) => result.batchMember).sort(), [1]);",
              '  const observedMinimumBatchIntervalMs = Math.min(...observedBatchGaps);':
                  '  const observedMinimumBatchIntervalMs = observedBatchGaps.length\n'
                  '    ? Math.min(...observedBatchGaps)\n'
                  '    : config.batchIntervalMs;',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'Expected one harness marker, found {source.count(old)}: {old}')
              source = source.replace(old, new)

          pattern = re.compile(
              r"  assert\.deepEqual\(\n"
              r"    Object\.values\(subjectCounts\),\n"
              r"    SUBJECTS\.map\(\(\) => JOURNEY_COUNT / SUBJECTS\.length\),\n"
              r"    'The exact 30-journey subject rotation is incomplete\.',\n"
              r"  \);\n"
          )
          source, count = pattern.subn('', source)
          if count != 1:
              raise SystemExit(f'Expected one protected subject-rotation assertion, found {count}.')
          target_path.write_text(source, encoding='utf-8')
          PY
          node --check scripts/.p0-run-one-bar-forecast-live-journey.mjs

      - name: Complete one real authenticated 20-answer coaching journey
        env:
          BAR_FORECAST_E2E_CONFIRM: staging:hlzqmreeoghbldnhlybr:30
          BAR_FORECAST_E2E_RELEASE_SHA: ${{ github.sha }}
          BAR_FORECAST_E2E_GITHUB_RUN_ID: ${{ github.run_id }}
          BAR_FORECAST_E2E_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          BAR_FORECAST_E2E_BATCH_INTERVAL_MS: '180000'
          BAR_FORECAST_E2E_JOURNEY_TIMEOUT_MS: '600000'
          BAR_FORECAST_E2E_BROWSER_CHANNEL: chrome
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-forecast-coaching
          npm install --no-save --no-package-lock playwright@1.54.2
          node scripts/.p0-run-one-bar-forecast-live-journey.mjs --environment staging --preflight > /dev/null
          node scripts/.p0-run-one-bar-forecast-live-journey.mjs --environment staging \
            > artifacts/p0-forecast-coaching/staging-one-journey.json
          EVIDENCE=artifacts/p0-forecast-coaching/staging-one-journey.json node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const evidence = JSON.parse(await readFile(process.env.EVIDENCE, 'utf8'));
          assert.equal(evidence.ok, true);
          assert.equal(evidence.target, 'staging');
          assert.equal(evidence.releaseSha, process.env.GITHUB_SHA);
          assert.equal(evidence.journeysRequested, 1);
          assert.equal(evidence.journeysPassed, 1);
          assert.equal(evidence.proof?.realForecastHttpJourneys, 1);
          assert.equal(evidence.proof?.twentyAnswerSubmissions, 1);
          assert.equal(evidence.proof?.suggestedAnswerAndExplanationSets, 1);
          assert.equal(evidence.proof?.unexpectedConsoleErrors, 0);
          assert.equal(evidence.journeys?.[0]?.resultCount, 20);
          assert.equal(evidence.cleanup?.complete, true);
          assert.equal(evidence.secretsLogged, false);
          NODE

      - name: Upload sanitized staging proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-forecast-coaching-staging-${{ github.run_id }}
          path: artifacts/p0-forecast-coaching/*.json
          if-no-files-found: warn
          retention-days: 30

  deploy_production_worker:
    name: Deploy staging-proven coaching release to production Worker
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[p0-forecast-coaching-release]')
    needs: validate
    environment: production-worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact merged release
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Re-run exact Forecast coaching contracts
        run: |
          set -euo pipefail
          node --check worker/bar-forecast-routes.mjs
          node --test \
            worker/bar-forecast-core.test.mjs \
            worker/bar-forecast-provider-policy.test.mjs \
            worker/bar-forecast-routes.test.mjs \
            worker/bar-forecast-coaching-release.test.mjs

      - name: Verify required production Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['GEMINI_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_URL']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Required production Forecast secrets are missing: ' + missing.join(', ')); process.exit(1); } });"

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.114.0'
          command: deploy

      - name: Deploy provider-neutral public API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.114.0'
          command: deploy --config wrangler.public-api.toml

      - name: Verify live production Forecast boundary three times
        env:
          ADMIN_BAR_FORECAST_WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
          ADMIN_BAR_FORECAST_ALLOWED_ORIGIN: https://duediligence.ph
        run: |
          set -euo pipefail
          node scripts/verify-admin-bar-forecast-deployment.mjs
          node scripts/verify-admin-bar-forecast-deployment.mjs
          node scripts/verify-admin-bar-forecast-deployment.mjs

      - name: Record deployed Cloudflare revisions
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.114.0 deployments list
          npx --yes wrangler@4.114.0 deployments list --config wrangler.public-api.toml
