name: Validate Bar-aligned rubric v2

on:
  pull_request:
    branches: ["main"]
    paths:
      - "worker/**"
      - "scripts/apply_bar_aligned_rubric_v2.py"
      - "docs/grading/**"
      - ".github/workflows/validate-rubric-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply approved rubric patch in isolated workspace
        run: python3 scripts/apply_bar_aligned_rubric_v2.py

      - name: Apply focused corrections from first safety run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker/examiner-core.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "|therefore|thus|hence)\\b/i.test(answer);": "|therefore|thus|hence|so)\\b/i.test(answer);",
              "Score capped because the student answer states a conclusion without a governing legal rule or meaningful reasoning.": "Score capped because the student answer states a conclusion without legal basis or application.",
              "Score capped because the student answer relies on a confirmed fabricated or nonexistent legal authority.": "Score capped because the student answer relies on a confirmed false or nonexistent legal authority.",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one correction anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify Worker syntax
        run: |
          node --check worker/index.mjs
          node --check worker/examiner-core.mjs

      - name: Run complete Worker regression suite
        run: node --test worker/*.test.mjs

      - name: Verify question-bank and beta contracts
        run: |
          node scripts/test-website-question-bank.mjs
          node scripts/test-private-beta-admission.mjs

      - name: Verify patch cleanliness and rubric scope
        run: |
          git diff --check
          grep -q "BAR-ALIGNED-HOLISTIC-v2" worker/examiner-core.mjs
          grep -q "usesBarAlignedRubric" worker/examiner-core.mjs
          grep -q "bar_easy" worker/examiner-core.mjs
          test -f worker/rubric-v2.test.mjs
          test -f docs/grading/bar-aligned-holistic-v2.md

      - name: Package validated source for review
        uses: actions/upload-artifact@v4
        with:
          name: rubric-v2-validated-source
          if-no-files-found: error
          retention-days: 7
          path: |
            worker/examiner-core.mjs
            worker/index.test.mjs
            worker/rubric-v2.test.mjs
            docs/grading/bar-aligned-holistic-v2.md
