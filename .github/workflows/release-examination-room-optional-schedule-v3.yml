name: Release Examination Room optional schedule fix v3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-optional-schedule-v3.yml

permissions:
  contents: write

concurrency:
  group: release-examination-room-optional-schedule-v3
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the isolated Examination Room implementation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fix-examination-room-optional-schedule.yml').read_text(encoding='utf-8')
          step = source.index('      - name: Patch only Examination Room scheduling\n')
          start_marker = '        run: |\n'
          start = source.index(start_marker, step) + len(start_marker)
          end = source.index('\n      - name: Install reviewed Worker dependencies', start) if '\n      - name: Install reviewed Worker dependencies' in source[start:] else source.index('\n      - name: Validate syntax and focused behavior', start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/examination-room-optional-schedule-patch.sh').write_text(script, encoding='utf-8')
          PY
          bash -n /tmp/examination-room-optional-schedule-patch.sh
          bash /tmp/examination-room-optional-schedule-patch.sh

      - name: Update the owner and professor regression contracts
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          owner_test = Path('worker/examination-room-v1-owner.test.mjs')
          owner_source = owner_test.read_text(encoding='utf-8')
          start_marker = "test('owner approval fails recoverably when the published exam has no exact usable schedule and never invents a 24-hour window', async () => {"
          end_marker = '\nfunction bytes(value) {'
          start = owner_source.find(start_marker)
          end = owner_source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not safely locate the obsolete owner schedule test.')
          replacement = base64.b64decode('').decode('utf-8')
          owner_source = owner_source[:start] + replacement + owner_source[end:]
          owner_test.write_text(owner_source, encoding='utf-8')

          professor_test = Path('examination-room/professor.client.test.cjs')
          professor_source = professor_test.read_text(encoding='utf-8')
          optional_test = r'''
          test('examination scheduling is optional while key access remains explicit', () => {
            assert.doesNotMatch(professorSource, /Set the start date and time/);
            assert.doesNotMatch(professorSource, /The room cannot be scheduled without a start time/);
            assert.match(professorSource, /No fixed date · opens when the student key is issued/);
            assert.match(professorHtml, /Start <small>\(optional\)<\/small>/);
            assert.match(professorHtml, /Leave blank to open the room when Admin issues the student key/);
            assert.doesNotMatch(professorHtml, /id="exam-date"[^>]*value=/);
            assert.doesNotMatch(professorHtml, /id="start-control"[^>]*value=/);
          });
          '''
          if "test('examination scheduling is optional while key access remains explicit'" not in professor_source:
              professor_source = professor_source.rstrip() + '\n\n' + optional_test.strip() + '\n'
          professor_test.write_text(professor_source, encoding='utf-8')
          PY

      - name: Install reviewed test dependencies
        working-directory: worker
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate syntax and focused Examination Room behavior
        shell: bash
        run: |
          node --check worker/index.mjs
          node --check worker/examination-room-activation-window.mjs
          node --check examination-room/professor.js
          node --test worker/examination-room-activation-window.test.mjs
          node --test worker/examination-room-v1-owner.test.mjs
          node --test examination-room/professor.client.test.cjs
          git diff --check

      - name: Enforce Examination Room-only scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess

          expected = {
              'worker/index.mjs',
              'worker/examination-room-activation-window.mjs',
              'worker/examination-room-activation-window.test.mjs',
              'worker/examination-room-v1-owner.test.mjs',
              'examination-room/professor.js',
              'examination-room/professor.client.test.cjs',
              'examination-room/index.html',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = sorted(changed - expected)
          missing = sorted(expected - changed)
          if unexpected:
              raise SystemExit(f'Unexpected out-of-scope files changed: {unexpected}')
          if missing:
              raise SystemExit(f'Expected Examination Room files were not changed: {missing}')
          PY

      - name: Commit and publish only the verified Examination Room fix
        shell: bash
        run: |
          git config user.name "Due Diligence Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.mjs \
            worker/examination-room-activation-window.mjs \
            worker/examination-room-activation-window.test.mjs \
            worker/examination-room-v1-owner.test.mjs \
            examination-room/professor.js \
            examination-room/professor.client.test.cjs \
            examination-room/index.html
          git commit -m "fix(examination-room): make examination schedule optional"
          git push origin HEAD:main
