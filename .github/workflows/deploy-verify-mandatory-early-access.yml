name: Deploy and verify mandatory Early Access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-verify-mandatory-early-access.yml'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: mandatory-early-access-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify mandatory access, payment notifications, and frontend gate
        run: |
          set -euo pipefail
          node --check worker/index.mjs
          node --check worker/commercial-entry.mjs
          node --check assets/phase4-experience.js
          node --test worker/commercial-access-gate.test.mjs
          node scripts/test-lifetime-grade-ui.mjs
          node scripts/test-commercial-launch-migration.mjs
          node scripts/test-phase2-contract.mjs
          node scripts/test-private-beta-landing.mjs

      - name: Build and verify sanitized Pages artifact
        run: |
          node scripts/build-pages-artifact.mjs
          node scripts/test-pages-artifact.mjs

      - name: Prevent verifier addresses or secrets from entering public code
        shell: bash
        run: |
          set -euo pipefail
          files=(
            worker/commercial-entry.mjs
            assets/phase4-experience.js
            supabase/migrations/20260818123000_require_early_access.sql
            supabase/migrations/20260818123100_private_payment_verifiers.sql
          )
          ! grep -nEi '@gmail\.com' "${files[@]}"
          ! grep -nE '(re_[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|CLOUDFLARE_API_TOKEN[[:space:]]*=)' "${files[@]}"

  deploy-worker:
    name: Deploy production Worker
    needs: verify
    environment: production-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify required Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['RESEND_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Missing required Worker secrets: ' + missing.join(', ')); process.exit(1); } console.log('Required payment-notification secrets are configured.'); });"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.114.0'
          command: deploy

  deploy-pages:
    name: Deploy production Pages
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and verify sanitized Pages artifact
        run: |
          node scripts/build-pages-artifact.mjs
          node scripts/test-pages-artifact.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-dist'

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  live-verify:
    name: Verify live Worker and Pages
    needs: [deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    steps:
      - name: Verify public plan catalog and deployed mandatory gate
        shell: bash
        run: |
          set -euo pipefail
          worker_url='https://duediligence-gemini-examiner.wallyesteban1993.workers.dev'
          site_url='https://duediligence.ph'
          plans_file="$(mktemp)"
          asset_file="$(mktemp)"

          for attempt in $(seq 1 20); do
            if curl -fsS --retry 2 --retry-delay 1 \
              -X POST "${worker_url}/plans" \
              -H 'Origin: https://duediligence.ph' \
              -H 'Content-Type: application/json' \
              -H "X-Request-ID: liveEarlyAccess${GITHUB_RUN_ID}${attempt}" \
              --data '{}' > "${plans_file}" \
              && node - "${plans_file}" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (payload?.ok !== true) process.exit(1);
          if (!Array.isArray(payload.plans) || payload.plans.length !== 1) process.exit(1);
          const plan = payload.plans[0];
          if (plan.planCode !== 'early_access_beta') process.exit(1);
          if (Number(plan.priceCentavos) !== 14900) process.exit(1);
          if (plan.checkoutEnabled !== true) process.exit(1);
NODE
            then
              break
            fi
            if [[ "$attempt" == '20' ]]; then
              echo 'Live Worker did not expose the required single ₱149 Early Access plan.' >&2
              cat "${plans_file}" >&2 || true
              exit 1
            fi
            sleep 6
          done

          for attempt in $(seq 1 20); do
            if curl -fsS --retry 2 --retry-delay 1 \
              "${site_url}/assets/phase4-experience.js?release=${GITHUB_SHA}-${attempt}" \
              > "${asset_file}" \
              && grep -q "payment_required" "${asset_file}" \
              && grep -q "Subscribe — ₱149 Early Access" "${asset_file}" \
              && grep -q "data-dd2-early-access-card" "${asset_file}"
            then
              break
            fi
            if [[ "$attempt" == '20' ]]; then
              echo 'Live Pages asset did not contain the mandatory Early Access gate.' >&2
              exit 1
            fi
            sleep 6
          done

          curl -fsS --retry 3 --retry-delay 2 \
            "${site_url}/assets/payments/bpi-instapay-149.png?release=${GITHUB_SHA}" \
            -o /dev/null

          echo 'Live Worker and Pages mandatory Early Access checks passed.'

      - name: Record verified production result on PR 146
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Production deployment verified',
              '',
              `Release commit: \`${context.sha}\``,
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '- Production Worker serves exactly one public plan: ₱149 Early Access.',
              '- Checkout is open.',
              '- Live Pages serves the mandatory payment gate and clickable Early Access card.',
              '- The BPI InstaPay QR asset is reachable.',
              '- Payment-notification Worker secrets were confirmed before deployment.',
              '',
              'The private verifier directory is database-controlled and is not printed in this public comment.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 146,
              body,
            });
