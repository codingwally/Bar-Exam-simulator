name: Emergency Study Room green-frame zero-flash release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-study-room-rollback.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  KNOWN_GOOD_SHA: 895380afa2b6dbb8892e29a8c250d1923235fd00
  KNOWN_GOOD_STUDY_LIVE_BLOB: 0822278a88cfb264fa3a5332adae25bd66473bf4
  GREEN_FRAME_MARKER: chrome152-greenframe-zero-flash-20260911-3

jobs:
  restore:
    name: Patch and deploy zero-flash Study Room camera rendering
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove this push changed only the emergency release workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "codingwally/Bar-Exam-simulator"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/emergency-study-room-rollback.yml"

      - name: Checkout exact pre-issue production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KNOWN_GOOD_SHA }}
          path: release-src
          fetch-depth: 1

      - name: Verify exact pre-issue Study Room source
        working-directory: release-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KNOWN_GOOD_SHA"
          test "$(git rev-parse HEAD:assets/study-room-live.js)" = "$KNOWN_GOOD_STUDY_LIVE_BLOB"
          grep -Fq 'Background off is genuinely processor-free.' assets/study-room-live.js
          grep -Fq 'Talking is a visual indicator, never a layout, tile-order, or media event.' assets/study-room-live.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        working-directory: release-src
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify unchanged source contracts and build artifact
        working-directory: release-src
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/study-room-live.js
          node --check assets/study-room-backgrounds.js
          node --check assets/study-room-preview.js
          node scripts/test-study-room-live.mjs
          node scripts/test-study-room-backgrounds.mjs
          node scripts/test-study-room-always-open.mjs
          node scripts/test-study-room-background-picker.mjs
          node scripts/test-study-room-hotfix-behavior.mjs
          node scripts/test-study-room-preview.mjs
          node scripts/test-pages-artifact.mjs

      - name: Apply zero-flash canvas guard to Pages artifact only
        working-directory: release-src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          marker = 'chrome152-greenframe-zero-flash-20260911-3'
          dist = Path('.pages-dist')
          js_path = dist / 'assets/study-room-live.js'
          css_path = dist / 'assets/study-room-live.css'
          html_path = dist / 'study-room/index.html'
          guard_path = dist / 'assets/study-room-green-frame-guard.js'

          js = js_path.read_text()
          js, camera_count = re.subn(
              r"(function cameraPublishOptions\(\) \{\s*return \{\s*source: LiveKit\?\.Track\?\.Source\?\.Camera \|\| 'camera',\s*)simulcast: true,",
              r"\1simulcast: false,",
              js,
              count=1,
              flags=re.M,
          )
          if camera_count != 1:
              raise SystemExit(f'Expected one camera simulcast replacement, got {camera_count}')
          js, defaults_count = re.subn(
              r"(publishDefaults: \{\s*\.\.\.microphonePublishOptions\(\),\s*)simulcast: true,",
              r"\1simulcast: false,",
              js,
              count=1,
              flags=re.M,
          )
          if defaults_count != 1:
              raise SystemExit(f'Expected one publish-default simulcast replacement, got {defaults_count}')
          js += f"\n// {marker}: single-layer camera publication with zero-flash local canvas gate.\n"
          js_path.write_text(js)

          css = css_path.read_text()
          css += f'''\n\n/* {marker}: the raw local video remains active for decoding but is never visually composited. */\n.sr-preview-frame video,\n.sr-participant-tile.is-self > video,\n.sr-participant-tile.is-self.is-camera > video {{\n  opacity: 0 !important;\n  transform: none !important;\n  filter: none !important;\n  will-change: auto !important;\n  backface-visibility: visible !important;\n}}\n.sr-greenframe-safe-canvas {{\n  position: absolute !important;\n  inset: 0 !important;\n  z-index: 4 !important;\n  display: block !important;\n  width: 100% !important;\n  height: 100% !important;\n  pointer-events: none !important;\n  object-fit: cover !important;\n  background: #071b30 !important;\n  opacity: 1 !important;\n}}\n'''
          css_path.write_text(css)

          guard = r'''(function studyRoomGreenFrameGuard(global) {
            'use strict';
            const MARKER = 'chrome152-greenframe-zero-flash-20260911-3';
            const installed = new WeakMap();
            const sample = document.createElement('canvas');
            sample.width = 32;
            sample.height = 18;
            const sampleCtx = sample.getContext('2d', { willReadFrequently: true });
            const CLEAN_FRAMES_TO_OPEN = 6;
            const CLEAN_FRAMES_AFTER_BAD = 4;

            function frameStats(video) {
              if (!sampleCtx || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return { bad: true, valid: false };
              try {
                sampleCtx.drawImage(video, 0, 0, sample.width, sample.height);
                const data = sampleCtx.getImageData(0, 0, sample.width, sample.height).data;
                let green = 0;
                let vividGreen = 0;
                let visible = 0;
                let sumR = 0, sumG = 0, sumB = 0;
                for (let i = 0; i < data.length; i += 4) {
                  const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                  if (a < 24) continue;
                  visible += 1;
                  sumR += r; sumG += g; sumB += b;
                  if (g > 72 && g > r * 1.22 && g > b * 1.18) green += 1;
                  if (g > 105 && g > r * 1.42 && g > b * 1.34) vividGreen += 1;
                }
                if (!visible) return { bad: true, valid: false };
                const ratio = green / visible;
                const vividRatio = vividGreen / visible;
                const meanR = sumR / visible, meanG = sumG / visible, meanB = sumB / visible;
                const greenLead = meanG - Math.max(meanR, meanB);
                const bad = vividRatio > 0.11 || ratio > 0.22 || (ratio > 0.10 && greenLead > 22) || greenLead > 46;
                return { bad, valid: true };
              } catch {
                return { bad: true, valid: false };
              }
            }

            function drawCover(ctx, video, width, height, mirror) {
              const vw = video.videoWidth || width;
              const vh = video.videoHeight || height;
              if (!vw || !vh || !width || !height) return;
              const srcRatio = vw / vh;
              const dstRatio = width / height;
              let sx = 0, sy = 0, sw = vw, sh = vh;
              if (srcRatio > dstRatio) {
                sw = vh * dstRatio;
                sx = (vw - sw) / 2;
              } else if (srcRatio < dstRatio) {
                sh = vw / dstRatio;
                sy = (vh - sh) / 2;
              }
              ctx.save();
              ctx.clearRect(0, 0, width, height);
              if (mirror) {
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
              }
              ctx.drawImage(video, sx, sy, sw, sh, 0, 0, width, height);
              ctx.restore();
            }

            function install(video, mirror) {
              if (!video || installed.has(video)) return;
              const parent = video.parentElement;
              if (!parent) return;
              const canvas = document.createElement('canvas');
              canvas.className = 'sr-greenframe-safe-canvas';
              canvas.dataset.greenframeGuard = MARKER;
              canvas.setAttribute('aria-hidden', 'true');
              const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
              if (!ctx) return;

              const previousOpacity = video.style.opacity;
              const previousPointerEvents = video.style.pointerEvents;
              video.style.setProperty('opacity', '0', 'important');
              video.style.setProperty('pointer-events', 'none', 'important');
              video.style.setProperty('transform', 'none', 'important');

              parent.appendChild(canvas);
              let stopped = false;
              let opened = false;
              let cleanStreak = 0;
              let recoveryStreak = 0;
              let sawBad = false;

              function paintSafeBackground() {
                if (!canvas.width || !canvas.height) return;
                ctx.fillStyle = '#071b30';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
              }

              function frame() {
                if (stopped || !video.isConnected || !canvas.isConnected) return;
                const rect = parent.getBoundingClientRect();
                const dpr = Math.min(global.devicePixelRatio || 1, 1.5);
                const width = Math.max(2, Math.round(rect.width * dpr));
                const height = Math.max(2, Math.round(rect.height * dpr));
                if (canvas.width !== width || canvas.height !== height) {
                  canvas.width = width;
                  canvas.height = height;
                  paintSafeBackground();
                }

                if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
                  const stats = frameStats(video);
                  if (!stats.valid || stats.bad) {
                    sawBad = true;
                    cleanStreak = 0;
                    recoveryStreak = 0;
                    if (!opened) paintSafeBackground();
                  } else if (!opened) {
                    cleanStreak += 1;
                    if (cleanStreak >= CLEAN_FRAMES_TO_OPEN) {
                      drawCover(ctx, video, width, height, mirror);
                      opened = true;
                      sawBad = false;
                      recoveryStreak = 0;
                    }
                  } else if (sawBad) {
                    recoveryStreak += 1;
                    if (recoveryStreak >= CLEAN_FRAMES_AFTER_BAD) {
                      drawCover(ctx, video, width, height, mirror);
                      sawBad = false;
                      recoveryStreak = 0;
                    }
                  } else {
                    drawCover(ctx, video, width, height, mirror);
                  }
                }

                if (typeof video.requestVideoFrameCallback === 'function') {
                  video.requestVideoFrameCallback(frame);
                } else {
                  global.setTimeout(frame, 66);
                }
              }

              installed.set(video, {
                canvas,
                stop() {
                  stopped = true;
                  video.style.opacity = previousOpacity;
                  video.style.pointerEvents = previousPointerEvents;
                  canvas.remove();
                },
              });
              paintSafeBackground();
              if (typeof video.requestVideoFrameCallback === 'function') {
                video.requestVideoFrameCallback(frame);
              } else {
                global.setTimeout(frame, 66);
              }
            }

            function scan() {
              const preview = document.getElementById('sr-local-preview');
              if (preview) install(preview, true);
              document.querySelectorAll('.sr-participant-tile.is-self.is-camera video, .sr-participant-tile.is-self video').forEach((video) => install(video, true));
            }

            const observer = new MutationObserver(scan);
            observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
            document.addEventListener('play', scan, true);
            global.addEventListener('pagehide', () => observer.disconnect(), { once: true });
            scan();
            console.info('[Study Room] zero-flash green-frame guard active:', MARKER);
          })(window);'''
          guard_path.write_text(guard)

          html = html_path.read_text()
          html = html.replace(
              '../assets/study-room-live.css?v=study-room-admin-manager-20260908-1&amp;share=screen-recovery-20260909-1&amp;entry=v3-20260909-1',
              f'../assets/study-room-live.css?v=study-room-admin-manager-20260908-1&amp;share=screen-recovery-20260909-1&amp;entry=v3-20260909-1&amp;greenframe={marker}',
          )
          html = html.replace(
              '&responsiveness=catalog-read-20260910-1',
              f'&responsiveness=catalog-read-20260910-1&greenframe={marker}',
          )
          script_tag = f'<script src="../assets/study-room-green-frame-guard.js?v={marker}" defer></script>'
          if script_tag not in html:
              html = html.replace('</body>', f'  {script_tag}\n</body>')
          if marker not in html or 'study-room-green-frame-guard.js' not in html:
              raise SystemExit('Failed to install zero-flash guard in Study Room HTML')
          html_path.write_text(html)
          PY

          node --check .pages-dist/assets/study-room-live.js
          node --check .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq "$GREEN_FRAME_MARKER" .pages-dist/assets/study-room-live.js
          grep -Fq "$GREEN_FRAME_MARKER" .pages-dist/assets/study-room-live.css
          grep -Fq "$GREEN_FRAME_MARKER" .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq 'CLEAN_FRAMES_TO_OPEN = 6' .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq "setProperty('opacity', '0', 'important')" .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq 'study-room-green-frame-guard.js' .pages-dist/study-room/index.html
          grep -Fq 'simulcast: false' .pages-dist/assets/study-room-live.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload patched Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release-src/.pages-dist

      - name: Deploy patched Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify zero-flash guard is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            html_ok=0
            guard_ok=0
            css_ok=0
            if curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' \
              "https://duediligence.ph/study-room/?greenframe=$GREEN_FRAME_MARKER&attempt=$attempt" \
              --output /tmp/study-room.html; then
              grep -Fq "$GREEN_FRAME_MARKER" /tmp/study-room.html \
                && grep -Fq 'study-room-green-frame-guard.js' /tmp/study-room.html && html_ok=1 || true
            fi
            if curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' \
              "https://duediligence.ph/assets/study-room-green-frame-guard.js?greenframe=$GREEN_FRAME_MARKER&attempt=$attempt" \
              --output /tmp/green-frame-guard.js; then
              grep -Fq "$GREEN_FRAME_MARKER" /tmp/green-frame-guard.js \
                && grep -Fq 'CLEAN_FRAMES_TO_OPEN = 6' /tmp/green-frame-guard.js \
                && grep -Fq "setProperty('opacity', '0', 'important')" /tmp/green-frame-guard.js && guard_ok=1 || true
            fi
            if curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' \
              "https://duediligence.ph/assets/study-room-live.css?greenframe=$GREEN_FRAME_MARKER&attempt=$attempt" \
              --output /tmp/study-room-live.css; then
              grep -Fq "$GREEN_FRAME_MARKER" /tmp/study-room-live.css \
                && grep -Fq 'opacity: 0 !important' /tmp/study-room-live.css && css_ok=1 || true
            fi
            if [[ "$html_ok" == 1 && "$guard_ok" == 1 && "$css_ok" == 1 ]]; then
              echo "Zero-flash Study Room guard is live on production Pages."
              exit 0
            fi
            sleep 10
          done
          echo "Pages deployed but zero-flash guard verification did not converge." >&2
          exit 1
