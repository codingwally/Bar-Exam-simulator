name: Examination Room resilient submission release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-resilient-submit-20260922.yml

permissions:
  contents: read
  pages: write
  id-token: write

env:
  RELEASE_SOURCE_SHA: 1ff3645365bbc3d1aa9624a069649072c3a69d7e
  PUBLIC_API_URL: https://duediligence-api.wallyesteban1993.workers.dev
  APPLICATION_URL: https://duediligence-gemini-examiner.wallyesteban1993.workers.dev
  SITE_URL: https://duediligence.ph

jobs:
  deploy_worker:
    name: Deploy resilient Examination Room submission backend
    if: "${{ github.event.head_commit.message == 'release: deploy resilient Examination Room submission' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-worker

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate resilient submission contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check examination-room/student.js
          node --check examination-room/api.js
          node --check worker/examination-room-v1-routes.mjs
          node --test examination-room/student.client.test.cjs
          node --test --test-name-pattern="legacy open student tabs can upload their local answer snapshot during submit" worker/examination-room-v1-routes.test.mjs
          grep -Fq "SUBMISSION_RETRY_WINDOW_MS = 15 * 60 * 1000" examination-room/student.js
          grep -Fq "Please wait — your answers are being uploaded." examination-room/student.js
          grep -Fq "Do not close this window" examination-room/student.js
          grep -Fq "STUDENT_SUBMISSION_REQUEST_TIMEOUT_MS = 60_000" examination-room/api.js
          grep -Fq "const submittedAnswers = Array.isArray(payload.answers) ? payload.answers : [];" worker/examination-room-v1-routes.mjs
          grep -Fq "source: 'submission'" worker/examination-room-v1-routes.mjs

      - name: Prepare behavior-equivalent Worker deployment config
        shell: bash
        run: |
          set -euo pipefail
          cp worker/wrangler.toml worker/wrangler.examination-room-submit.toml
          sed -i             -e '/^GEMINI_GROUNDING_ENABLED =/d'             -e '/^ALLOW_LEGACY_GUESTS =/d'             -e '/^AI_PREPARED_BETA_BADGE =/d'             -e '/^CONTENT_HUMAN_REVIEW_REQUIRED =/d'             worker/wrangler.examination-room-submit.toml

      - name: Deploy application Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.examination-room-submit.toml

      - name: Deploy public API alias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.public-api.toml

      - name: Verify live API route
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in "$PUBLIC_API_URL" "$APPLICATION_URL"; do
            body="$RUNNER_TEMP/exam-room-submit-probe.json"
            status="$(curl --silent --show-error --max-time 20               --output "$body"               --write-out '%{http_code}'               --request POST               --header 'Origin: https://duediligence.ph'               --header 'Content-Type: application/json'               --header 'X-Request-ID: submission:resilient-release-probe'               --data '{"operation":"submit","payload":{"sessionId":"00000000-0000-0000-0000-000000000000","sessionToken":"ers1_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","answers":[{"questionId":"q001","answer":"probe","flagged":false}]},"idempotencyKey":"submission:resilient-release-probe"}'               "$endpoint/examination-room/v1/student/command" || true)"
            test "$status" = "400" || test "$status" = "401"
            grep -Eq 'IDENTIFIER_INVALID|SESSION_INVALID|EXAM_ROOM_V1_' "$body"
          done

  deploy_pages:
    name: Deploy resilient Examination Room submission frontend
    needs: deploy_worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Build and verify Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node scripts/test-pages-artifact.mjs
          grep -Fq "SUBMISSION_RETRY_WINDOW_MS = 15 * 60 * 1000" .pages-dist/examination-room/student.js
          grep -Fq "Please wait — your answers are being uploaded." .pages-dist/examination-room/student.js
          grep -Fq "STUDENT_SUBMISSION_REQUEST_TIMEOUT_MS = 60_000" .pages-dist/examination-room/api.js
          grep -Fq 'student.js?v=submission-retry-20260922-9' .pages-dist/examination-room/student.html
          grep -Fq 'api.js?v=submission-retry-20260922-9' .pages-dist/examination-room/student.html
          grep -Fq 'duediligence-shell-examination-submission-retry-20260922-9' .pages-dist/service-worker.js

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live resilient submission assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            student="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.js?v=submission-retry-20260922-9&release=$RELEASE_SOURCE_SHA" || true)"
            api="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/api.js?v=submission-retry-20260922-9&release=$RELEASE_SOURCE_SHA" || true)"
            page="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.html?release=$RELEASE_SOURCE_SHA" || true)"
            if grep -Fq "SUBMISSION_RETRY_WINDOW_MS = 15 * 60 * 1000" <<<"$student"               && grep -Fq "Please wait — your answers are being uploaded." <<<"$student"               && grep -Fq "STUDENT_SUBMISSION_REQUEST_TIMEOUT_MS = 60_000" <<<"$api"               && grep -Fq 'student.js?v=submission-retry-20260922-9' <<<"$page"; then
              echo "Resilient Examination Room submission client is live."
              exit 0
            fi
            sleep 5
          done
          echo "Resilient submission assets did not converge in time." >&2
          exit 1
