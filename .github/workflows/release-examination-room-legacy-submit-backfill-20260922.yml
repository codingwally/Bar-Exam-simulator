name: Emergency Examination Room submission fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-legacy-submit-backfill-20260922.yml

permissions:
  contents: read

concurrency:
  group: examination-room-worker-hotfix
  cancel-in-progress: false

env:
  BASE_SHA: 5946be54cd1703765818e663ebc4094c3cad5a52
  RELEASE_SOURCE_SHA: 269451184ad03736d538d8a367becdf4f0e5debf
  PUBLIC_API_URL: https://duediligence-api.wallyesteban1993.workers.dev
  APPLICATION_URL: https://duediligence-gemini-examiner.wallyesteban1993.workers.dev

jobs:
  deploy:
    name: Verify and deploy Examination Room submission fix
    if: "${{ github.event.head_commit.message == 'release: deploy Examination Room submission fix' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-worker

    steps:
      - name: Checkout exact Worker hotfix source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove isolated Examination Room scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          python - <<'PY'
          import os, subprocess
          base=os.environ['BASE_SHA']
          source=os.environ['RELEASE_SOURCE_SHA']
          expected={
            'worker/examination-room-origin.test.mjs',
            'worker/examination-room-v1-core.mjs',
            'worker/examination-room-v1-core.test.mjs',
            'worker/examination-room-v1-routes.mjs',
            'worker/examination-room-v1-routes.test.mjs',
            'worker/index.mjs',
          }
          changed=set(subprocess.check_output(
            ['git','diff','--name-only',f'{base}..{source}'],
            text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected Examination Room hotfix scope: {sorted(changed)}')
          print('Exact Examination Room submission hotfix scope verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate origin and submission contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/index.mjs
          node --check worker/examination-room-v1-core.mjs
          node --check worker/examination-room-v1-routes.mjs
          node --test             worker/examination-room-origin.test.mjs             worker/examination-room-v1-core.test.mjs             worker/examination-room-v1-routes.test.mjs             worker/public-api-alias.test.mjs             examination-room/api.demo.test.cjs             examination-room/student.client.test.cjs
          git diff --check "$BASE_SHA..$RELEASE_SOURCE_SHA"
          grep -Fq "requestOrigin === 'https://www.duediligence.ph'" worker/index.mjs
          grep -Fq "A blank response is still a final response." worker/examination-room-v1-routes.mjs
          grep -Fq "student submit persists blank answers and still produces a receipt" worker/examination-room-v1-routes.test.mjs

      - name: Prepare behavior-equivalent free-plan deployment config
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "String(env.GEMINI_GROUNDING_ENABLED).toLowerCase() === 'true'" worker/index.mjs
          grep -Fq "String(env.ALLOW_LEGACY_GUESTS).toLowerCase() === 'true'" worker/index.mjs
          grep -Fq 'AI_PREPARED_BETA_BADGE: false' worker/duediligence-2026-core.mjs
          grep -Fq 'CONTENT_HUMAN_REVIEW_REQUIRED: false' worker/duediligence-2026-core.mjs
          cp worker/wrangler.toml worker/wrangler.examination-room-release.toml
          sed -i \
            -e '/^GEMINI_GROUNDING_ENABLED =/d' \
            -e '/^ALLOW_LEGACY_GUESTS =/d' \
            -e '/^AI_PREPARED_BETA_BADGE =/d' \
            -e '/^CONTENT_HUMAN_REVIEW_REQUIRED =/d' \
            worker/wrangler.examination-room-release.toml
          test "$(grep -Ec '^[A-Z0-9_]+ = ' worker/wrangler.examination-room-release.toml)" -eq 41

      - name: Deploy application Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.examination-room-release.toml

      - name: Verify both live Examination Room origins
        shell: bash
        run: |
          set -euo pipefail
          verify_approved_origins() {
            for endpoint in "$PUBLIC_API_URL" "$APPLICATION_URL"; do
              for origin in 'https://duediligence.ph' 'https://www.duediligence.ph'; do
                body="$RUNNER_TEMP/exam-room-$(echo "$endpoint-$origin" | tr -cd '[:alnum:]').json"
                headers="$body.headers"
                status="$(curl --silent --show-error --max-time 20 \
                  --output "$body" \
                  --dump-header "$headers" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header "Origin: $origin" \
                  --header 'Content-Type: application/json' \
                  --header 'X-Request-ID: submission:origin-release-probe' \
                  --data '{"operation":"submit","payload":{"sessionId":"not-a-session"},"idempotencyKey":"submission:origin-release-probe"}' \
                  "$endpoint/examination-room/v1/student/command" || true)"
                test "$status" = '400' || return 1
                grep -Fq 'EXAM_ROOM_V1_IDENTIFIER_INVALID' "$body" || return 1
                grep -qi "^access-control-allow-origin: $origin" "$headers" || return 1
              done
            done
          }

          verified=false
          for attempt in {1..12}; do
            if verify_approved_origins; then
              verified=true
              break
            fi
            echo "Production propagation check $attempt did not pass yet; retrying."
            sleep 5
          done
          test "$verified" = 'true'

          hostile_body="$RUNNER_TEMP/exam-room-hostile-origin.json"
          hostile_status="$(curl --silent --show-error --max-time 20             --output "$hostile_body"             --write-out '%{http_code}'             --request POST             --header 'Origin: https://attacker.example'             --header 'Content-Type: application/json'             --data '{}'             "$APPLICATION_URL/examination-room/v1/student/command")"
          test "$hostile_status" = '403'
          grep -Fq 'ORIGIN_NOT_ALLOWED' "$hostile_body"
          echo 'Both approved Examination Room origins are live; unapproved origins remain blocked.'
