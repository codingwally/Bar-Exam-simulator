<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Beta Landing — Visual QA Comparison</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #07172d; color: #f4f0e8; font-family: Arial, sans-serif; }
    main { width: 100%; padding: 22px; }
    h1 { margin: 0 0 18px; font-size: 18px; font-weight: 600; letter-spacing: .04em; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; overflow: hidden; border: 1px solid rgba(196, 164, 95, .55); background: #041123; }
    figcaption { padding: 10px 12px; border-bottom: 1px solid rgba(196, 164, 95, .35); color: #d9b86b; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Due Diligence private-beta landing — approved reference vs. implementation at 1487 × 1058</h1>
    <div class="comparison">
      <figure>
        <figcaption>Approved reference</figcaption>
        <img src="../../visual-references/private-beta/Due_Diligence_Private_Beta_Landing_Approved_Reference.png" width="1487" height="1058" alt="Approved private-beta landing reference">
      </figure>
      <figure>
        <figcaption>Current implementation</figcaption>
        <img src="landing-implementation-1487x1058.png" width="1487" height="1058" alt="Current private-beta landing implementation">
      </figure>
    </div>
  </main>
</body>
</html>
