name: Trusted staging E2E release gate

on:
  workflow_dispatch:
    inputs:
      deploy_greenfield:
        description: "Deploy the reviewed Worker and static artifact to staging before verification"
        required: true
        default: false
        type: boolean
      smoke_greenfield:
        description: "Verify the deployed greenfield static routes and public error contracts"
        required: true
        default: true
        type: boolean
      database_release_preapplied:
        description: "The reviewed Examination Room database release was manually applied and live-probed"
        required: true
        default: false
        type: boolean
      release2_database_preapplied:
        description: "The reviewed Pedro and profile-photo database release was manually applied and live-probed"
        required: true
        default: false
        type: boolean
      admin_analytics_database_preapplied:
        description: "Exact 20260828133000 + 20260828133500 + 20260828134000 bundle, ledger hashes, and live probe are complete"
        required: true
        default: false
        type: boolean
      support_results_database_preapplied:
        description: "Exact Support identity + Bar Simulation history bundle, ledger hashes, privileges, and rollback-only probe are complete"
        required: true
        default: false
        type: boolean
      pricing_database_preapplied:
        description: "Exact 20260830054727 Admin pricing migration and rollback-only live probe are complete"
        required: true
        default: false
        type: boolean
      september_pricing_database_preapplied_sha256:
        description: "When DB URL is absent: SHA-256 of exact 20260831100000/20260831101000 bundle + probe"
        required: false
        default: ""
        type: string
      admin_bar_forecast_database_preapplied_sha256:
        description: "When DB URL is absent: SHA-256 of exact 20260831170000 bundle + rollback-only probe"
        required: false
        default: ""
        type: string
      admin_bar_forecast_content_preapplied_sha256:
        description: "When content credentials are absent: exact reviewed Forecast content-manifest SHA-256"
        required: false
        default: ""
        type: string
      approval_reference:
        description: "Required approval/change reference when deploy_greenfield is selected"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: duediligence-staging-worker
  cancel-in-progress: false

jobs:
  staging-e2e:
    name: Protected staging release gate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'codingwally/Bar-Exam-simulator' &&
      github.actor != 'dependabot[bot]'
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Enforce repository and trusted release branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_NAME: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_ACTOR: ${{ github.actor }}
          DEPLOY_GREENFIELD: ${{ inputs.deploy_greenfield }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "workflow_dispatch"
          test "$REPOSITORY_NAME" = "codingwally/Bar-Exam-simulator"
          test "$RELEASE_ACTOR" != "dependabot[bot]"
          case "$RELEASE_REF" in
            refs/heads/main|refs/heads/feature/admin-pricing-builder-20260830|refs/heads/feature/pricing-september-cutover-20260831|refs/heads/fix/admin-marketing-live-20260828|refs/heads/agent/master-experience-release-20260813|refs/heads/agent/header-subject-review-correction-20260814|refs/heads/agent/subject-matter-split-review-20260814|refs/heads/agent/high-value-subject-review-20260815|refs/heads/agent/homepage-feature-ledger-20260815|refs/heads/agent/commercial-launch-20260818|refs/heads/agent/commercial-terms-acceptance-hotfix-20260818|refs/heads/agent/commercial-terms-worker-persistence-20260818|refs/heads/agent/renovation-commercial-cutover-20260820|refs/heads/agent/soft-launch-five-token-20260821|refs/heads/codex/examination-room-greenfield-20260826|refs/heads/codex/examination-room-owner-command-center-20260826) ;;
            *)
              echo "The staging gate may run only from an explicitly trusted release branch." >&2
              exit 1
              ;;
          esac
          if [[ "$DEPLOY_GREENFIELD" == "true" && -z "${APPROVAL_REFERENCE//[[:space:]]/}" ]]; then
            echo "A non-empty approval/change reference is required before a staging deployment." >&2
            exit 1
          fi
          echo "Trusted manual staging dispatch accepted."

      - name: Checkout trusted release ref
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        if: inputs.deploy_greenfield == true
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify greenfield release contracts before staging deploy
        if: inputs.deploy_greenfield == true
        run: |
          node --check examination-room/api.js
          node --check examination-room/professor.js
          node --check examination-room/student.js
          node --check worker/index.mjs
          node --check worker/examination-room-v1-core.mjs
          node --check worker/examination-room-v1-routes.mjs
          node --check assets/phase2-config.js
          node --check assets/maintenance-gate.js
          node --check assets/phase4-experience.js
          node --check assets/lex-forum.js
          node --test examination-room/*.test.cjs
          node --test admin/examination-room-admin.test.cjs
          node --test worker/*.test.mjs
          node scripts/test-admin-support-results-discoverability.mjs
          node scripts/test-examination-room-database.mjs
          node scripts/test-examination-room-commercial-stress.mjs
          node scripts/test-maintenance-lock.mjs
          node scripts/test-private-beta-admission.mjs
          node scripts/test-private-beta-frontend.mjs
          node scripts/test-private-beta-landing.mjs
          node scripts/test-private-beta-auth-regression.mjs
          node scripts/test-auth-session-persistence.mjs
          node scripts/test-phase2-contract.mjs
          node scripts/test-email-marketing-retirement.mjs
          node scripts/test-dialog-exit-controls.mjs
          node scripts/test-auth-route-overlay.mjs
          node scripts/test-onboarding-flow.mjs
          node scripts/test-post-grade-controls.mjs
          node scripts/test-beta-readiness-copy-seo.mjs
          node scripts/test-lifetime-grade-ui.mjs
          node scripts/test-audience-menu.mjs
          node scripts/test-examination-room-door-menu.mjs
          node scripts/test-examination-room-release-workflows.mjs
          node scripts/test-admin-analytics-release-bundle.mjs
          node scripts/test-support-results-release-bundle.mjs
          node scripts/test-admin-pricing-editor.mjs
          node scripts/test-pricing-public-contract.mjs
          node scripts/test-admin-pricing-release.mjs
          node scripts/test-september-pricing-sql-contract.mjs
          node scripts/test-september-pricing-release-bundle.mjs
          node scripts/test-september-pricing-release-workflow.mjs
          node scripts/test-admin-bar-forecast-release-bundle.mjs
          node scripts/test-admin-bar-forecast-content-release.mjs
          node --test scripts/test-admin-bar-forecast-deployment-smoke.mjs
          node scripts/test-admin-bar-forecast-release-workflow.mjs
          node scripts/test-approved-renovation-shell.mjs
          node scripts/test-design-correction-release.mjs
          node scripts/test-subject-matter-consolidation.mjs
          node scripts/test-subject-matter-skip-flag.mjs
          node --test scripts/test-profile-photo-release2.mjs
          node scripts/test-profile-avatar-cleanup-migration.mjs
          node scripts/test-pedro-release2-integration.mjs
          node scripts/test-pedro-migration-contract.mjs
          node scripts/test-pedro-conditional-expression-qualification-fix.mjs
          node scripts/test-pedro-exact-openers.mjs
          node --test scripts/test-pedro-frontend.mjs
          node scripts/test-pedro-navigation.mjs
          node scripts/test-gemini-examiner.mjs
          node scripts/test-master-experience-release.mjs
          node scripts/test-quorum-navigation-state.mjs
          node scripts/test-syllabus-review-reveal-contract.mjs
          node scripts/test-subject-matter-incremental-snapshot-hash-fix.mjs
          node scripts/test-historical-examination-owner-access.mjs
          node scripts/test-examinations.mjs
          node scripts/test-phase4-release4.mjs
          node scripts/test-commercial-launch-migration.mjs
          node scripts/test-correction-workflow.mjs
          node scripts/test-complete-beta-release.mjs
          node scripts/test-lex-forum.mjs
          node scripts/test-quorum.mjs
          node scripts/test-public-release1-async-races.mjs
          node scripts/test-public-release1-reliability.mjs
          node scripts/test-admin-public-reliability.mjs
          node scripts/test-public-admin-static-stress.mjs
          node scripts/test-analytics-page.mjs
          node scripts/test-auxiliary-writing-diagnostics.mjs
          node scripts/test-history-score-safety.mjs
          node scripts/test-verdict-graded-analytics.mjs
          node scripts/test-verdict-export-loading.mjs
          node scripts/audit-subject-matter-review-quality.mjs
          node scripts/test-duediligence-2026-frontend.mjs
          node scripts/test-feature-decommission-boundary.mjs
          node scripts/test-import-duediligence-2026-content.mjs
          node scripts/validate-duediligence-2026-content.mjs
          node scripts/build-pages-artifact.mjs
          node scripts/test-pages-artifact.mjs

      - name: Apply and probe only the ordered Examination Room migrations
        if: inputs.deploy_greenfield == true
        env:
          EXAMINATION_ROOM_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_STAGING_DATABASE_URL }}
          DATABASE_RELEASE_PREAPPLIED: ${{ inputs.database_release_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          release_bundle="$RUNNER_TEMP/examination-room-release.sql"
          trap 'rm -f -- "$release_bundle"' EXIT
          node scripts/build-examination-room-release-bundle.mjs --output "$release_bundle"
          if [[ -n "$EXAMINATION_ROOM_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$EXAMINATION_ROOM_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$release_bundle"
          elif [[ "$DATABASE_RELEASE_PREAPPLIED" == "true" ]]; then
            echo "The staging database URL is absent. The explicit database_release_preapplied confirmation attests that this exact reviewed bundle was manually applied and live-probed before cutover."
          else
            echo "EXAMINATION_ROOM_STAGING_DATABASE_URL is missing. Configure it, or manually apply and live-probe this exact reviewed bundle and rerun with database_release_preapplied=true." >&2
            exit 1
          fi

      - name: Require the live-probed Release 2 database contract
        if: inputs.deploy_greenfield == true
        env:
          RELEASE2_DATABASE_PREAPPLIED: ${{ inputs.release2_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260827143000_pedro_private_study_inbox.sql
          test -f supabase/migrations/20260827144000_profile_avatar_cleanup_queue.sql
          test -f supabase/migrations/20260827145000_pedro_foreign_key_indexes.sql
          if grep -R --include='*.html' -F 'phase2-config.js?v=private-maintenance-20260820-2' index.html admin examination-room; then
            echo "A legacy provider-visible phase2-config cache key remains in an HTML consumer." >&2
            exit 1
          fi
          if [[ "$RELEASE2_DATABASE_PREAPPLIED" != "true" ]]; then
            echo "Release 2 database migrations must be manually applied and live-probed before staging Worker deployment. Rerun with release2_database_preapplied=true only after verification." >&2
            exit 1
          fi
          echo "The explicit Release 2 attestation confirms the reviewed Pedro and profile-photo database contract was manually applied and live-probed before cutover."

      - name: Apply and live-probe the exact Admin analytics migrations
        if: inputs.deploy_greenfield == true
        env:
          ADMIN_ANALYTICS_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_STAGING_DATABASE_URL }}
          ADMIN_ANALYTICS_DATABASE_PREAPPLIED: ${{ inputs.admin_analytics_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          admin_analytics_release_bundle="$RUNNER_TEMP/admin-analytics-release.sql"
          trap 'rm -f -- "$admin_analytics_release_bundle"' EXIT
          node scripts/build-admin-analytics-release-bundle.mjs --output "$admin_analytics_release_bundle"
          if [[ -n "$ADMIN_ANALYTICS_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$ADMIN_ANALYTICS_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$admin_analytics_release_bundle"
          elif [[ "$ADMIN_ANALYTICS_DATABASE_PREAPPLIED" == "true" ]]; then
            echo "The staging database URL is absent. The explicit admin_analytics_database_preapplied confirmation attests that the reviewed bundle atomically applied exactly 20260828133000_optimize_internal_test_scoped_usage_helpers.sql, 20260828133500_admin_marketing_live_home_metrics.sql, and 20260828134000_exclude_admins_from_recent_sign_in_directory.sql, recorded their exact ledger names and source hashes, and passed the rollback-only live probe before Worker cutover."
          else
            echo "EXAMINATION_ROOM_STAGING_DATABASE_URL is missing. Configure it, or manually run this reviewed Admin analytics bundle and verify its exact ledger-name/source-hash postflight and rollback-only live probe before rerunning with admin_analytics_database_preapplied=true." >&2
            exit 1
          fi

      - name: Apply and live-probe the exact Support identity and results migrations
        if: inputs.deploy_greenfield == true
        env:
          SUPPORT_RESULTS_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_STAGING_DATABASE_URL }}
          SUPPORT_RESULTS_DATABASE_PREAPPLIED: ${{ inputs.support_results_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          support_results_release_bundle="$RUNNER_TEMP/support-results-release.sql"
          trap 'rm -f -- "$support_results_release_bundle"' EXIT
          node scripts/build-support-results-release-bundle.mjs --output "$support_results_release_bundle"
          if [[ -n "$SUPPORT_RESULTS_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$SUPPORT_RESULTS_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$support_results_release_bundle"
          elif [[ "$SUPPORT_RESULTS_DATABASE_PREAPPLIED" == "true" ]]; then
            echo "The staging database URL is absent. The explicit support_results_database_preapplied confirmation attests that the exact two-migration bundle, ledger names and source hashes, service-role-only privileges, and rollback-only live probe passed before Worker cutover."
          else
            echo "EXAMINATION_ROOM_STAGING_DATABASE_URL is missing. Configure it, or manually run the exact Support results bundle and verify its ledger hashes, privileges, and rollback-only live probe before rerunning with support_results_database_preapplied=true." >&2
            exit 1
          fi

      - name: Require the exact live-probed Admin pricing database contract
        if: inputs.deploy_greenfield == true
        env:
          PRICING_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_STAGING_DATABASE_URL }}
          PRICING_DATABASE_PREAPPLIED: ${{ inputs.pricing_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          pricing_migration="supabase/migrations/20260830054727_admin_pricing_revisions.sql"
          pricing_probe="scripts/probe-admin-pricing-release.sql"
          test -f "$pricing_migration"
          test -f "$pricing_probe"
          if [[ "$PRICING_DATABASE_PREAPPLIED" != "true" ]]; then
            echo "The exact Admin pricing migration and rollback-only live probe must complete before staging Worker deployment." >&2
            exit 1
          fi
          if [[ -n "$PRICING_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$PRICING_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$pricing_probe"
          else
            echo "The explicit pricing_database_preapplied confirmation attests that exact migration 20260830054727 and its rollback-only probe passed on staging."
          fi

      - name: Apply and post-apply probe the exact September pricing migrations
        if: inputs.deploy_greenfield == true
        env:
          SEPTEMBER_PRICING_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_STAGING_DATABASE_URL }}
          SEPTEMBER_PRICING_DATABASE_PREAPPLIED_SHA256: ${{ inputs.september_pricing_database_preapplied_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          september_pricing_release_bundle="$RUNNER_TEMP/september-pricing-release.sql"
          trap 'rm -f -- "$september_pricing_release_bundle"' EXIT
          node scripts/build-september-pricing-release-bundle.mjs --output "$september_pricing_release_bundle"
          expected_attestation="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write("sha256:" + createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"));' "$september_pricing_release_bundle")"
          test -n "$expected_attestation"
          if [[ -n "$SEPTEMBER_PRICING_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$SEPTEMBER_PRICING_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$september_pricing_release_bundle"
          elif [[ "$SEPTEMBER_PRICING_DATABASE_PREAPPLIED_SHA256" == "$expected_attestation" ]]; then
            echo "The exact bundle-hash attestation confirms both September pricing migrations, their ledger records, and the rollback-only post-apply probe completed on staging before Worker cutover."
          else
            echo "EXAMINATION_ROOM_STAGING_DATABASE_URL is missing. Manually apply the generated September pricing bundle, verify its embedded rollback-only probe, then rerun with this exact attestation: $expected_attestation" >&2
            exit 1
          fi

      - name: Apply and post-apply probe the exact admin-only Bar Forecast migration
        if: inputs.deploy_greenfield == true
        env:
          ADMIN_BAR_FORECAST_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_STAGING_DATABASE_URL }}
          ADMIN_BAR_FORECAST_DATABASE_PREAPPLIED_SHA256: ${{ inputs.admin_bar_forecast_database_preapplied_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          admin_bar_forecast_release_bundle="$RUNNER_TEMP/admin-bar-forecast-release.sql"
          trap 'rm -f -- "$admin_bar_forecast_release_bundle"' EXIT
          node scripts/build-admin-bar-forecast-release-bundle.mjs --output "$admin_bar_forecast_release_bundle"
          expected_attestation="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write("sha256:" + createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"));' "$admin_bar_forecast_release_bundle")"
          test -n "$expected_attestation"
          if [[ -n "$ADMIN_BAR_FORECAST_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$ADMIN_BAR_FORECAST_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$admin_bar_forecast_release_bundle"
          elif [[ "$ADMIN_BAR_FORECAST_DATABASE_PREAPPLIED_SHA256" == "$expected_attestation" ]]; then
            echo "The exact bundle-hash attestation confirms migration 20260831170000, its ledger source hash, and its rollback-only admin/schema probe completed on staging."
          else
            echo "EXAMINATION_ROOM_STAGING_DATABASE_URL is missing. Manually apply the generated Admin Bar Forecast bundle and embedded rollback-only probe, then rerun with this exact attestation: $expected_attestation" >&2
            exit 1
          fi

      - name: Import and verify the exact admin-only Bar Forecast content
        if: inputs.deploy_greenfield == true
        env:
          DD2026_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
          DD2026_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_BAR_FORECAST_CONTENT_PREAPPLIED_SHA256: ${{ inputs.admin_bar_forecast_content_preapplied_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          forecast_import_report="$RUNNER_TEMP/admin-bar-forecast-import.json"
          forecast_verify_report="$RUNNER_TEMP/admin-bar-forecast-verify.json"
          trap 'rm -f -- "$forecast_import_report" "$forecast_verify_report"' EXIT
          expected_content_attestation="$(node scripts/verify-admin-bar-forecast-content.mjs --print-attestation)"
          [[ "$expected_content_attestation" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ -n "$DD2026_SUPABASE_URL" && -n "$DD2026_SUPABASE_SERVICE_ROLE_KEY" ]]; then
            node scripts/import-duediligence-2026-content.mjs --apply --environment staging --content-type bar_forecast_question > "$forecast_import_report"
            node scripts/verify-admin-bar-forecast-content.mjs --verify --environment staging > "$forecast_verify_report"
            FORECAST_IMPORT_REPORT="$forecast_import_report" FORECAST_VERIFY_REPORT="$forecast_verify_report" EXPECTED_CONTENT_ATTESTATION="$expected_content_attestation" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const imported = JSON.parse(await readFile(process.env.FORECAST_IMPORT_REPORT, 'utf8'));
          const verified = JSON.parse(await readFile(process.env.FORECAST_VERIFY_REPORT, 'utf8'));
          if (imported.targetRef !== 'hlzqmreeoghbldnhlybr'
              || imported.contentType !== 'bar_forecast_question'
              || imported.total !== 120
              || imported.counts?.bar_forecast_question !== 120
              || verified.targetRef !== 'hlzqmreeoghbldnhlybr'
              || verified.count !== 120
              || verified.sha256 !== process.env.EXPECTED_CONTENT_ATTESTATION) {
            throw new Error('The staging Forecast import or exact content-manifest verification failed.');
          }
          NODE
          elif [[ "$ADMIN_BAR_FORECAST_CONTENT_PREAPPLIED_SHA256" == "$expected_content_attestation" ]]; then
            echo "The exact content-manifest hash attests that the 120 reviewed Forecast items were imported and checksum-verified on staging."
          else
            echo "Staging content credentials are missing. Manually import and verify the reviewed Forecast manifest, then rerun with this exact attestation: $expected_content_attestation" >&2
            exit 1
          fi

      - name: Verify staging secrets and private Supabase Storage recovery configuration
        if: inputs.deploy_greenfield == true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json --name duediligence-examinations-staging \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['GEMINI_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'EXAMINATION_ROOM_KEY_PEPPER', 'EXAMINATION_ROOM_OWNER_DATA_KEY_V1', 'EXAMINATION_ROOM_BACKUP_MASTER_KEY_V1', 'EXAMINATION_ROOM_ADMIN_EMAILS']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Required staging Worker secrets are missing: ' + missing.join(', ') + '. Configure the missing release secret; never rotate it during deploy.'); process.exit(1); } console.log('Required staging Examination Room secrets are configured.'); });"
          grep -F 'EXAMINATION_ROOM_RECOVERY_MODE = "supabase_storage"' wrangler.staging.toml
          if grep -Eq '^[[:space:]]*\[\[r2_buckets\]\]|binding[[:space:]]*=[[:space:]]*"EXAMINATION_ROOM_BACKUPS"' wrangler.staging.toml; then
            echo "Staging must use the reviewed private Supabase Storage recovery mode without an R2 binding." >&2
            exit 1
          fi
          grep -F "'examination-room-recovery'" ../supabase/migrations/20260827030000_examination_room_supabase_storage_recovery.sql
          grep -F 'public is false' ../scripts/build-examination-room-release-bundle.mjs
          grep -F 'application/vnd.duediligence.examination-room-recovery+json' ../scripts/build-examination-room-release-bundle.mjs
          echo "Private Supabase Storage recovery configuration matches the staging database probe."

      - name: Resolve the approved staging publishable configuration
        if: inputs.deploy_greenfield == true
        env:
          CONFIGURED_STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          staging_publishable_key="$CONFIGURED_STAGING_PUBLISHABLE_KEY"
          if [[ -z "$staging_publishable_key" ]]; then
            staging_publishable_key="$(node --input-type=module -e "const response = await fetch('https://duediligence-examinations-staging.wallyesteban1993.workers.dev/assets/phase2-config.js', { headers: { 'cache-control': 'no-cache' } }); if (!response.ok) process.exit(1); const source = await response.text(); const match = source.match(/sb_publishable_[A-Za-z0-9_-]{20,}/); if (!match) process.exit(1); process.stdout.write(match[0]);")"
          fi
          if [[ ! "$staging_publishable_key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]; then
            echo "The approved staging publishable configuration is unavailable." >&2
            exit 1
          fi
          echo "::add-mask::$staging_publishable_key"
          echo "STAGING_SUPABASE_PUBLISHABLE_KEY=$staging_publishable_key" >> "$GITHUB_ENV"
          unset staging_publishable_key

      - name: Build and verify isolated staging artifact
        if: inputs.deploy_greenfield == true
        env:
          STAGING_PUBLIC_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
        run: node scripts/test-staging-artifact.mjs

      - name: Deploy reviewed Worker and static artifact to staging
        if: inputs.deploy_greenfield == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.staging.toml

      - name: Verify the live admin-only Forecast boundary
        if: inputs.deploy_greenfield == true
        env:
          ADMIN_BAR_FORECAST_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          ADMIN_BAR_FORECAST_ALLOWED_ORIGIN: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        run: node scripts/verify-admin-bar-forecast-deployment.mjs

      - name: Verify public pricing and reject unauthenticated Admin pricing access
        if: inputs.deploy_greenfield == true
        env:
          PRICING_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          PRICING_ALLOWED_ORIGIN: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          pricing_response="$RUNNER_TEMP/staging-pricing.json"
          pricing_status="$(curl --fail-with-body --silent --show-error \
            --output "$pricing_response" --write-out '%{http_code}' \
            --request POST \
            --header "Origin: $PRICING_ALLOWED_ORIGIN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$PRICING_WORKER_URL/plans")"
          test "$pricing_status" = "200"
          PRICING_RESPONSE="$pricing_response" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const payload = JSON.parse(await readFile(process.env.PRICING_RESPONSE, 'utf8'));
          assert.equal(payload.ok, true);
          assert.match(String(payload.revisionId || ''), /^[0-9a-f-]{36}$/i);
          assert.ok(Date.parse(String(payload.serverNow || '')) > 0);
          assert.equal(typeof payload.pricing, 'object');
          assert.ok(Array.isArray(payload.plans));
          NODE
          for endpoint in /admin/pricing/query /admin/pricing/action /admin/pricing/assets/upload; do
            denied_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header "Origin: $PRICING_ALLOWED_ORIGIN" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$PRICING_WORKER_URL$endpoint")"
            case "$denied_status" in
              401|403) ;;
              *) echo "Unauthenticated $endpoint returned $denied_status instead of 401/403." >&2; exit 1 ;;
            esac
          done

      - name: Verify greenfield static routes and public error contracts
        if: inputs.deploy_greenfield == true || inputs.smoke_greenfield == true
        env:
          STAGING_EXAMINATION_ROOM_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        run: node scripts/test-examination-room-v1-staging-smoke.mjs

      - name: Verify staging-only endpoint contract
        run: node scripts/run-staging-e2e-suite.mjs --preflight

      - name: Complete beta staging suite
        id: complete_beta
        continue-on-error: true
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-staging-e2e-suite.mjs complete-beta

      - name: Due Diligence 2026 staging suite
        id: duediligence_2026
        continue-on-error: true
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-staging-e2e-suite.mjs duediligence-2026

      - name: Examinations staging suite
        id: examinations
        continue-on-error: true
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          node scripts/run-staging-e2e-suite.mjs examinations

      - name: Publish sanitized suite summary
        if: always()
        run: node scripts/run-staging-e2e-suite.mjs --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-sanitized-${{ github.run_id }}
          path: artifacts/staging-e2e/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce all three staging suites
        if: always()
        run: node scripts/run-staging-e2e-suite.mjs --enforce
