<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home comments and Taglish content comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #fff; background: #101827; font: 600 14px Inter, Arial, sans-serif; }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
    .panel { min-width: 0; }
    .label { display: flex; min-height: 32px; align-items: center; padding: 0 12px; border: 1px solid #c5a059; background: #0b1f38; letter-spacing: .12em; text-transform: uppercase; }
    img { display: block; width: 100%; height: auto; border: 1px solid #334155; border-top: 0; }
  </style>
</head>
<body>
  <main class="comparison">
    <section class="panel">
      <div class="label">Owner reference</div>
      <img src="home-comments-taglish-owner-reference-1880x900.png" width="1880" height="900" alt="Owner-provided Home community reference">
    </section>
    <section class="panel">
      <div class="label">Current implementation</div>
      <img src="home-comments-taglish-desktop-1880x900.png" width="1880" height="900" alt="Current Home implementation at the same viewport">
    </section>
  </main>
</body>
</html>
