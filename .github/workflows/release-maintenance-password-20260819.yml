name: One-time maintenance password release

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-triggers/maintenance-password-20260819.txt'

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: one-time-maintenance-password-20260819
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'codingwally/Bar-Exam-simulator' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'release: activate maintenance password gate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_REFERENCE: owner-approved-maintenance-gate-20260819
      APPROVED_MERGE_SHA: d11bcae75f516acb6a987efb004c66c230a0155b
      WORKER_URL: https://duediligence-gemini-examiner.wallyesteban1993.workers.dev
      SITE_URL: https://duediligence.ph
    steps:
      - name: Checkout approved release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approval and release ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .github/release-triggers/maintenance-password-20260819.txt)" = "$APPROVAL_REFERENCE"
          git merge-base --is-ancestor "$APPROVED_MERGE_SHA" HEAD
          test "$(git branch --show-current)" = "main"

      - name: Dispatch and verify production Worker
        id: worker
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-worker.yml \
            --ref main \
            -f confirm_production=true \
            -f approval_reference="$APPROVAL_REFERENCE"

          worker_run_id=""
          for attempt in $(seq 1 60); do
            worker_run_id="$(
              gh run list \
                --workflow deploy-worker.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" \
                | head -n 1
            )"
            [ -n "$worker_run_id" ] && break
            sleep 2
          done
          test -n "$worker_run_id"
          echo "run_id=$worker_run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$worker_run_id" --exit-status

      - name: Verify live Worker maintenance lock
        shell: bash
        run: |
          set -euo pipefail

          locked_status="$(curl -sS -o "$RUNNER_TEMP/locked.json" -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://duediligence.ph' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$WORKER_URL/access")"
          test "$locked_status" = "503"
          LOCKED_JSON="$(cat "$RUNNER_TEMP/locked.json")" node <<'NODE'
          const payload = JSON.parse(process.env.LOCKED_JSON || '{}');
          if (payload?.maintenance !== true || payload?.error?.code !== 'MAINTENANCE_MODE') process.exit(1);
          NODE

          wrong_status="$(curl -sS -o "$RUNNER_TEMP/wrong.json" -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://duediligence.ph' \
            -H 'Content-Type: application/json' \
            --data '{"password":"incorrect-maintenance-password"}' \
            "$WORKER_URL/maintenance/unlock")"
          test "$wrong_status" = "401"

          password="$(node -e 'process.stdout.write(String.fromCharCode(48,56,48,50))')"
          unlock_body="$(PASSWORD="$password" node -e 'process.stdout.write(JSON.stringify({password:process.env.PASSWORD}))')"
          unset password
          unlock_status="$(curl -sS -o "$RUNNER_TEMP/unlock.json" -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://duediligence.ph' \
            -H 'Content-Type: application/json' \
            --data "$unlock_body" \
            "$WORKER_URL/maintenance/unlock")"
          unset unlock_body
          test "$unlock_status" = "200"
          token="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!p.ok||!p.token) process.exit(1); process.stdout.write(p.token)' "$RUNNER_TEMP/unlock.json")"

          status_code="$(curl -sS -o "$RUNNER_TEMP/status.json" -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://duediligence.ph' \
            -H 'Content-Type: application/json' \
            -H "X-DD-Maintenance-Access: $token" \
            --data '{}' \
            "$WORKER_URL/maintenance/status")"
          test "$status_code" = "200"

          plans_code="$(curl -sS -o "$RUNNER_TEMP/plans.json" -w '%{http_code}' \
            -X POST \
            -H 'Origin: https://duediligence.ph' \
            -H 'Content-Type: application/json' \
            -H 'X-Request-ID: maintenance_release_plans_20260819' \
            -H "X-DD-Maintenance-Access: $token" \
            --data '{}' \
            "$WORKER_URL/plans")"
          unset token
          test "$plans_code" = "200"
          PLANS_JSON="$(cat "$RUNNER_TEMP/plans.json")" node <<'NODE'
          const payload = JSON.parse(process.env.PLANS_JSON || '{}');
          if (payload?.ok !== true || !Array.isArray(payload?.plans)) process.exit(1);
          NODE

      - name: Dispatch and verify production Pages
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml \
            --ref main \
            -f confirm_production=true \
            -f approval_reference="$APPROVAL_REFERENCE"

          pages_run_id=""
          for attempt in $(seq 1 60); do
            pages_run_id="$(
              gh run list \
                --workflow deploy.yml \
                --branch main \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" \
                | head -n 1
            )"
            [ -n "$pages_run_id" ] && break
            sleep 2
          done
          test -n "$pages_run_id"
          echo "run_id=$pages_run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$pages_run_id" --exit-status

      - name: Verify live maintenance page assets
        shell: bash
        run: |
          set -euo pipefail
          verified="false"
          for attempt in $(seq 1 36); do
            config="$(curl -fsS "$SITE_URL/assets/phase2-config.js?release=$GITHUB_SHA" || true)"
            gate="$(curl -fsS "$SITE_URL/assets/maintenance-gate.js?release=$GITHUB_SHA" || true)"
            root="$(curl -fsS "$SITE_URL/?release=$GITHUB_SHA" || true)"
            if grep -q "enabled: true" <<<"$config" \
              && grep -q "X-DD-Maintenance-Access" <<<"$config" \
              && grep -q "maintenance-gate.js" <<<"$config" \
              && grep -q "We are improving Due Diligence" <<<"$gate" \
              && grep -q "phase2-config.js" <<<"$root"; then
              verified="true"
              break
            fi
            sleep 5
          done
          test "$verified" = "true"

      - name: Publish production evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-comment.md" <<COMMENT
          ## Maintenance password gate deployed

          The owner-approved maintenance release passed the normal production Worker and Pages workflows and live verification.

          - Approval: \`$APPROVAL_REFERENCE\`
          - Source: \`$GITHUB_SHA\`
          - Worker workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${{ steps.worker.outputs.run_id }}
          - Pages workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/${{ steps.pages.outputs.run_id }}
          - Verified live: unauthenticated API requests are blocked, incorrect password is rejected, the approved password issues a signed token, the token reaches the existing plans endpoint, and the maintenance screen assets are live.

          No dashboard or manual key activation was required. The existing payment, subscription, examination, and Google sign-in flows remain available after maintenance unlock.
          COMMENT
          gh pr comment 153 --body-file "$RUNNER_TEMP/release-comment.md"
