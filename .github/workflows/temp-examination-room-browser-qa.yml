name: Temporary Examination Room browser QA

on:
  push:
    branches:
      - fix/examination-room-privacy-new-exam-readability-20260827
    paths:
      - .github/workflows/temp-examination-room-browser-qa.yml

permissions:
  contents: read

jobs:
  browser-qa:
    if: contains(github.event.head_commit.message, 'examination room phone overflow')
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/examination-room-preview.log 2>&1 &
          echo $! > /tmp/examination-room-preview.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/examination-room/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/examination-room-preview.log
          exit 1

      - name: Identify the overflowing phone element
        shell: bash
        run: |
          mkdir -p browser-qa
          cat > browser-qa-runner.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          function selectorFor(element) {
            if (element.id) return `#${element.id}`;
            const classes = [...element.classList].slice(0, 3).join('.');
            return `${element.tagName.toLowerCase()}${classes ? `.${classes}` : ''}`;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
              const page = await context.newPage();
              await page.addInitScript(() => localStorage.clear());
              await page.goto('http://127.0.0.1:4173/examination-room/?demo=1', { waitUntil: 'networkidle' });
              await page.waitForSelector('#app-shell:not([hidden])', { timeout: 15000 });
              const report = await page.evaluate(() => {
                const viewportWidth = document.documentElement.clientWidth;
                const bodyWidth = document.body.clientWidth;
                const overflowing = [...document.querySelectorAll('body *')]
                  .map((element) => {
                    const rect = element.getBoundingClientRect();
                    return {
                      tag: element.tagName.toLowerCase(),
                      id: element.id || '',
                      classes: [...element.classList].slice(0, 5),
                      text: String(element.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 120),
                      left: Math.round(rect.left * 100) / 100,
                      right: Math.round(rect.right * 100) / 100,
                      width: Math.round(rect.width * 100) / 100,
                      clientWidth: element.clientWidth,
                      scrollWidth: element.scrollWidth,
                      overflowX: getComputedStyle(element).overflowX,
                    };
                  })
                  .filter((entry) => entry.right > viewportWidth + 1 || entry.left < -1)
                  .sort((left, right) => Math.max(right.right - viewportWidth, -right.left) - Math.max(left.right - viewportWidth, -left.left))
                  .slice(0, 30);
                const styleOf = (selector) => {
                  const element = document.querySelector(selector);
                  if (!element) return null;
                  const style = getComputedStyle(element);
                  const rect = element.getBoundingClientRect();
                  return {
                    selector,
                    display: style.display,
                    position: style.position,
                    width: style.width,
                    minWidth: style.minWidth,
                    maxWidth: style.maxWidth,
                    flex: style.flex,
                    gridTemplateColumns: style.gridTemplateColumns,
                    whiteSpace: style.whiteSpace,
                    overflowX: style.overflowX,
                    left: rect.left,
                    right: rect.right,
                  };
                };
                return {
                  viewportWidth,
                  bodyWidth,
                  htmlScrollWidth: document.documentElement.scrollWidth,
                  bodyScrollWidth: document.body.scrollWidth,
                  overflowing,
                  keyStyles: [
                    styleOf('.brand-bar'),
                    styleOf('.command-bar'),
                    styleOf('.command-actions'),
                    styleOf('#save-draft'),
                    styleOf('#preview-exam'),
                    styleOf('#publish-exam'),
                    styleOf('#more-actions'),
                    styleOf('.creator-grid'),
                    styleOf('#exam-form'),
                    styleOf('.section-rail'),
                  ],
                };
              });
              console.log(JSON.stringify(report, null, 2));
              fs.writeFileSync('browser-qa/phone-overflow-report.json', JSON.stringify(report, null, 2));
              await page.screenshot({ path: 'browser-qa/phone-390x844-overflow.png', fullPage: true });
              await context.close();
              if (report.htmlScrollWidth > report.viewportWidth + 1) {
                throw new Error(`phone overflow: ${report.htmlScrollWidth}px document inside ${report.viewportWidth}px viewport`);
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node browser-qa-runner.cjs

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examination-room-phone-overflow-diagnostic
          path: browser-qa
          if-no-files-found: error
