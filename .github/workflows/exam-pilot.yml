name: Verify Due Diligence practice examination platform
on:
  pull_request:
    paths: ["exam-pilot/**", ".github/workflows/exam-pilot.yml"]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: Verify only, inspect available infrastructure, or release the isolated service
        required: true
        default: verify
        options: [verify, infrastructure-check, deploy-isolated]
permissions:
  contents: read
concurrency:
  group: constitutional-exam-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build private document readers from pinned dependencies
        run: |
          npm ci --prefix exam-pilot --ignore-scripts --no-audit --no-fund
          npm run build:documents --prefix exam-pilot
      - name: Verify new service without touching the existing application
        run: node exam-pilot/run-tests.mjs
  browsers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build private document readers from pinned dependencies
        run: |
          npm ci --prefix exam-pilot --ignore-scripts --no-audit --no-fund
          npm run build:documents --prefix exam-pilot
      - name: Install pinned browser review tools outside the application
        run: |
          npm install --prefix exam-pilot/.wrangler/test-deps --no-audit --no-fund --ignore-scripts playwright@1.64.1
          node exam-pilot/.wrangler/test-deps/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Start a synthetic HTTPS examination rehearsal
        shell: bash
        run: |
          mkdir -p exam-pilot/.wrangler/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout exam-pilot/.wrangler/tls/local-key.pem -out exam-pilot/.wrangler/tls/local-cert.pem
          EXAM_QA_PORT=8802 EXAM_QA_TLS_KEY=exam-pilot/.wrangler/tls/local-key.pem EXAM_QA_TLS_CERT=exam-pilot/.wrangler/tls/local-cert.pem node exam-pilot/dev-server.mjs > exam-pilot/.wrangler/server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --insecure --silent --fail https://localhost:8802/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Review actual registration, saving, recovery, deadlines and receipts on three browser engines
        env:
          DD_ALLOW_SELF_SIGNED: "true"
          DD_PLAYWRIGHT_MODULE: ${{ github.workspace }}/exam-pilot/.wrangler/test-deps/node_modules/playwright
        run: node exam-pilot/test/browser-compatibility.mjs https://localhost:8802
      - name: Repeat Firefox service-worker shell reloads on the clean runner
        env:
          DD_PLAYWRIGHT_MODULE: ${{ github.workspace }}/exam-pilot/.wrangler/test-deps/node_modules/playwright
        run: |
          node exam-pilot/test/firefox-reload-diagnostic.mjs minimal 20
          node exam-pilot/test/firefox-reload-diagnostic.mjs exam-shell 20
          node exam-pilot/test/firefox-reload-diagnostic.mjs exam-modules 20
      - name: Review the practice workspace and document upload workflows on three engines
        env:
          DD_ALLOW_SELF_SIGNED: "true"
          DD_BROWSER_ENGINES: chromium,firefox,webkit
          DD_PLAYWRIGHT_MODULE: ${{ github.workspace }}/exam-pilot/.wrangler/test-deps/node_modules/playwright
        run: |
          node exam-pilot/test/workspace-browser.mjs https://localhost:8802
          node exam-pilot/test/document-workflows-browser.mjs https://localhost:8802
      - name: Start the disposable professor authentication rehearsal
        shell: bash
        env:
          EXAM_QA_ADMIN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          EXAM_QA_PORT=8806 EXAM_QA_TLS_KEY=exam-pilot/.wrangler/tls/local-key.pem EXAM_QA_TLS_CERT=exam-pilot/.wrangler/tls/local-cert.pem node exam-pilot/dev-server.mjs > exam-pilot/.wrangler/professor-auth-server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --insecure --silent --fail https://localhost:8806/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Review private professor sign-in, sign-out and expired-session draft preservation
        env:
          EXAM_QA_ADMIN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DD_ALLOW_SELF_SIGNED: "true"
          DD_BROWSER_ENGINES: chromium,firefox,webkit
          DD_PLAYWRIGHT_MODULE: ${{ github.workspace }}/exam-pilot/.wrangler/test-deps/node_modules/playwright
        run: node exam-pilot/test/professor-login-review.mjs https://localhost:8806
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: constitutional-exam-synthetic-browser-review
          path: |
            exam-pilot/.wrangler/evidence/
            exam-pilot/.wrangler/server.log
            exam-pilot/.wrangler/professor-auth-server.log
          retention-days: 30
  connection:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Inspect existing Cloudflare authorization without creating resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXAM_PILOT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_AUTH_MODE: password
        run: node exam-pilot/infrastructure.mjs check
  infrastructure:
    needs: [verify, browsers, connection]
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build private document readers for deployment
        if: inputs.action == 'deploy-isolated'
        run: |
          npm ci --prefix exam-pilot --ignore-scripts --no-audit --no-fund
          npm run build:documents --prefix exam-pilot
      - name: Read available isolated infrastructure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXAM_PILOT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_AUTH_MODE: password
        run: node exam-pilot/infrastructure.mjs check
      - name: Provision the free isolated practice database
        if: inputs.action == 'deploy-isolated'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXAM_PILOT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.EXAM_PILOT_ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.EXAM_PILOT_ACCESS_AUD }}
          ADMIN_AUTH_MODE: password
          GOOGLE_SPREADSHEET_ID: ${{ vars.EXAM_PILOT_GOOGLE_SPREADSHEET_ID }}
          EMAIL_DELIVERY_ENABLED: ${{ vars.EXAM_PILOT_EMAIL_DELIVERY_ENABLED || 'false' }}
        run: node exam-pilot/infrastructure.mjs provision
      - name: Apply only the new isolated exam schema
        if: inputs.action == 'deploy-isolated'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXAM_PILOT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 d1 execute duediligence-constitutional-exam --remote --file exam-pilot/schema.sql --config exam-pilot/.wrangler/deploy.json
      - name: Deploy the isolated service with no changes to the main website or Worker
        if: inputs.action == 'deploy-isolated'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXAM_PILOT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 deploy --config exam-pilot/.wrangler/deploy.json
      - name: Activate the private professor sign-in
        if: inputs.action == 'deploy-isolated'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.EXAM_PILOT_CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXAM_ADMIN_LOGIN_SECRET: ${{ secrets.EXAM_PILOT_ADMIN_LOGIN_SECRET }}
        run: |
          test -n "$EXAM_ADMIN_LOGIN_SECRET"
          printf '%s' "$EXAM_ADMIN_LOGIN_SECRET" | npx --yes wrangler@4.152.0 secret put ADMIN_LOGIN_SECRET --config exam-pilot/.wrangler/deploy.json
