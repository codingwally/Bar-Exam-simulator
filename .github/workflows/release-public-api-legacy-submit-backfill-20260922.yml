name: Emergency Examination Room single-submit API release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-public-api-legacy-submit-backfill-20260922.yml

permissions:
  contents: read

concurrency:
  group: public-api-legacy-submit-backfill
  cancel-in-progress: false

env:
  BASE_SHA: 560ef29895d01a8667f96c6e1528e2322cf4cb27
  RELEASE_SOURCE_SHA: 0a1b667d3dcd49145eab2dcdc156f40b9d3e7411
  PUBLIC_API_URL: https://duediligence-api.wallyesteban1993.workers.dev

jobs:
  deploy:
    name: Verify and deploy single-submit API boundary
    if: "${{ github.event.head_commit.message == 'release: deploy Examination Room single-submit fix' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-worker

    steps:
      - name: Checkout exact alias hotfix source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove reviewed Examination Room hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          python - <<'PY'
          import os, subprocess
          base=os.environ['BASE_SHA']
          source=os.environ['RELEASE_SOURCE_SHA']
          expected={
            'examination-room/api.demo.test.cjs',
            'examination-room/api.js',
            'examination-room/student.client.test.cjs',
            'examination-room/student.html',
            'examination-room/student.js',
            'service-worker.js',
            'worker/public-api-alias.mjs',
            'worker/public-api-alias.test.mjs',
          }
          changed=set(subprocess.check_output(
            ['git','diff','--name-only',f'{base}..{source}'],
            text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected public API hotfix scope: {sorted(changed)}')
          print('Exact Examination Room single-submit scope verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate single-submit and recovery fallback
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/public-api-alias.mjs
          node --check examination-room/api.js
          node --test worker/public-api-alias.test.mjs examination-room/api.demo.test.cjs worker/examination-room-v1-routes.test.mjs
          git diff --check "$BASE_SHA..$RELEASE_SOURCE_SHA"
          grep -Fq "command?.operation === 'submit'" worker/public-api-alias.mjs
          grep -Fq "Submit is forwarded exactly once" worker/public-api-alias.mjs
          grep -Fq "submittedAt: submission.receivedAt" worker/public-api-alias.mjs
          grep -Fq "forwardStudentSaveWithRepair" worker/public-api-alias.mjs
          grep -Fq "canonicalQuestionId" worker/public-api-alias.mjs
          grep -Fq "sanitizeAnswerText" worker/public-api-alias.mjs
          grep -Fq "ANSWER_RECOVERY_URL" worker/public-api-alias.mjs
          grep -Fq "recoverStudentAnswer" worker/public-api-alias.mjs
          grep -Fq "X-Examination-Answer-Recovery" worker/public-api-alias.mjs
          grep -Fq "attemptStudentAnswerRecovery" worker/public-api-alias.mjs
          grep -Fq "ANSWER_RECOVERY_TIMEOUT_MS" worker/public-api-alias.mjs
          grep -Fq "complete local snapshot" examination-room/api.js

      - name: Deploy provider-neutral public API alias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.public-api.toml

      - name: Verify canonical Examination Room origin
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/origin-probe.json"
          headers="$RUNNER_TEMP/origin-probe.headers"
          status="$(curl --silent --show-error             --output "$body"             --dump-header "$headers"             --write-out '%{http_code}'             --request POST             --header 'Origin: https://duediligence.ph'             --header 'Content-Type: application/json'             --data '{}'             "$PUBLIC_API_URL/examination-room/v1/student/preview")"
          if [[ "$status" = "403" ]] && grep -Fq '"code":"ORIGIN_NOT_ALLOWED"' "$body"; then
            cat "$body" >&2
            exit 1
          fi
          grep -qi '^access-control-allow-origin: https://duediligence.ph' "$headers"
          echo "Public API alias is live and the canonical Examination Room origin is accepted."

      - name: Verify submit reaches the application without an alias recovery delay
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/exam-room-submit-probe.json"
          metrics="$RUNNER_TEMP/exam-room-submit-probe.metrics"
          status="$(curl --silent --show-error --max-time 8 \
            --output "$body" \
            --write-out '%{http_code} %{time_total}' \
            --request POST \
            --header 'Origin: https://duediligence.ph' \
            --header 'Content-Type: application/json' \
            --header 'X-Request-ID: submission:single-submit-release-probe' \
            --data '{"operation":"submit","payload":{"sessionId":"00000000-0000-0000-0000-000000000000","sessionToken":"ers1_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","answers":[{"questionId":"q001","answer":"probe"}]},"idempotencyKey":"submission:single-submit-release-probe"}' \
            "$PUBLIC_API_URL/examination-room/v1/student/command")"
          printf '%s\n' "$status" > "$metrics"
          code="${status%% *}"
          seconds="${status##* }"
          test "$code" = "400"
          grep -Fq 'EXAM_ROOM_V1_IDENTIFIER_INVALID' "$body"
          awk -v seconds="$seconds" 'BEGIN { exit !(seconds < 5) }'
          echo "Production submit crossed the alias once and reached application validation in ${seconds}s."
