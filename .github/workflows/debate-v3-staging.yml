name: Debate V3 restricted staging

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Capture/storage-headers are read-only; upload-diagnostic uses reviewed staging deployment and temporary fixtures for one upload without timers; hosted-rehearsal runs the full control journey
        required: true
        type: choice
        default: capture
        options: [capture, storage-headers, prepare-auth, deploy, prepare-hosted, hosted-rehearsal, upload-diagnostic]
      candidate_sha:
        description: Exact current main SHA reviewed for this staging release
        required: true
        type: string
      expected_baseline_sha256:
        description: Reviewed fingerprint from this workflow's earlier read-only baseline capture
        required: false
        type: string
      expected_version_id:
        description: Complete active Worker version UUID from that reviewed baseline
        required: false
        type: string
      review_evidence_json:
        description: Reviewed JSON matching docs/debate-v3-staging-release.md, including manually applied database proof
        required: false
        type: string
      hosted_preparation_run_id:
        description: Successful prepare-hosted run for this exact candidate and unchanged staging baseline
        required: false
        type: string
      hosted_preparation_sha256:
        description: Reviewed SHA-256 of that run's sanitized hosted driver.json receipt
        required: false
        type: string

permissions:
  contents: read
  actions: read

# Also used by the existing staging gate; never interrupt another staging owner.
concurrency:
  group: duediligence-staging-worker
  cancel-in-progress: false

jobs:
  storage-headers:
    if: ${{ inputs.operation == 'storage-headers' && github.repository == 'codingwally/Bar-Exam-simulator' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' }}
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      DEBATE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      REQUESTED_STAGING_OPERATION: storage-headers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEBATE_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEBATE_CANDIDATE_SHA"
          test "$GITHUB_SHA" = "$DEBATE_CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Test bounded diagnostic with inert transport only
        run: node --test scripts/test-debate-storage-headers.mjs
      - name: Compare exactly two read-only staging bucket requests
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/diagnose-debate-storage-headers.mjs
      - name: Preserve only sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debate-v3-storage-headers-${{ github.sha }}
          path: artifacts/debate-local-rehearsal/staging-release/storage-headers.json
          if-no-files-found: warn
          retention-days: 14
  hosted-cleanup-postgres:
    if: inputs.operation != 'capture' && inputs.operation != 'storage-headers'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: debate_ci_only
          POSTGRES_DB: debate_cleanup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d debate_cleanup_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify staging-only cleanup without provider credentials
        env:
          DEBATE_HOSTED_SQL_CI: '1'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: debate_cleanup_ci
          PGPASSWORD: debate_ci_only
        run: node scripts/test-debate-hosted-atomic-cleanup.mjs
      - name: Preserve native cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debate-v3-native-cleanup-evidence
          path: artifacts/debate-local-rehearsal/hosted-atomic-cleanup-ci/report.json
          if-no-files-found: warn
          retention-days: 14
  staging:
    needs: hosted-cleanup-postgres
    if: ${{ !cancelled() && inputs.operation != 'storage-headers' && github.repository == 'codingwally/Bar-Exam-simulator' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' && (inputs.operation == 'capture' || needs.hosted-cleanup-postgres.result == 'success') }}
    environment: staging-e2e
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.operation == 'hosted-rehearsal' && 180 || 45 }}
    env:
      DEBATE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DEBATE_EXPECTED_BASELINE_SHA256: ${{ inputs.expected_baseline_sha256 }}
      DEBATE_EXPECTED_VERSION_ID: ${{ inputs.expected_version_id }}
      DEBATE_RELEASE_REVIEW: ${{ inputs.review_evidence_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact trusted checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEBATE_CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEBATE_CANDIDATE_SHA"
          test "$GITHUB_SHA" = "$DEBATE_CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Read-only current staging backup
        if: inputs.operation == 'capture'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/debate-staging-release.mjs capture
      - name: Verify provenance of the earlier hosted fixture preparation
        if: inputs.operation == 'hosted-rehearsal' || inputs.operation == 'upload-diagnostic'
        env:
          GH_TOKEN: ${{ github.token }}
          DEBATE_HOSTED_PREPARATION_RUN_ID: ${{ inputs.hosted_preparation_run_id }}
          DEBATE_HOSTED_PREPARATION_SHA256: ${{ inputs.hosted_preparation_sha256 }}
        run: node scripts/resolve-debate-hosted-preparation.mjs provenance
      - name: Download the reviewed sanitized preparation evidence
        if: inputs.operation == 'hosted-rehearsal' || inputs.operation == 'upload-diagnostic'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.hosted_preparation_run_id }}
          name: debate-v3-staging-release-${{ github.sha }}
          path: artifacts/debate-local-rehearsal/hosted-preparation
      - name: Pin the exact prior preparation receipt
        if: inputs.operation == 'hosted-rehearsal' || inputs.operation == 'upload-diagnostic'
        env:
          DEBATE_HOSTED_PREPARATION_SHA256: ${{ inputs.hosted_preparation_sha256 }}
        run: node scripts/resolve-debate-hosted-preparation.mjs resolve
      - name: Install locked dependencies without install scripts
        if: inputs.operation != 'capture'
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund
      - name: Verify the complete candidate and release gates
        if: inputs.operation != 'capture'
        run: |
          node --test scripts/test-debate-staging-release.mjs
          node scripts/test-feature-decommission-boundary.mjs
          node scripts/test-debate-v3.mjs
          node -e "const fs=require('fs'),p='artifacts/debate-local-rehearsal';const names=fs.readdirSync(p).filter(n=>n.startsWith('suite-')).sort();if(names.length!==1)throw Error('Expected one fresh suite');fs.appendFileSync(process.env.GITHUB_ENV,'DEBATE_LOCAL_SUITE_REPORT='+p+'/'+names[0]+'/report.json\n');"
      - name: Resolve the existing audited staging public configuration
        if: inputs.operation != 'capture'
        env:
          CONFIGURED_STAGING_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module -e "import {resolveStagingPublishableKey} from './scripts/debate-staging-release.mjs';import {appendFileSync} from 'node:fs';const {key}=await resolveStagingPublishableKey({configuredKey:process.env.CONFIGURED_STAGING_PUBLISHABLE_KEY});console.log('::add-mask::'+key);appendFileSync(process.env.GITHUB_ENV,'STAGING_SUPABASE_PUBLISHABLE_KEY='+key+'\n');"
      - name: Build the existing target-locked sanitized staging artifact
        if: inputs.operation != 'capture'
        env:
          STAGING_PUBLIC_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
          STAGING_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ env.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/build-staging-artifact.mjs
          node scripts/test-debate-artifact.mjs
      - name: Install the existing pinned staging deploy tool in an isolated directory
        if: inputs.operation != 'capture'
        run: npm install --prefix artifacts/debate-local-rehearsal/staging-tooling --no-save --no-package-lock --ignore-scripts --no-audit --no-fund wrangler@4.114.0
      - name: Verify actual upload metadata before provisioning any test account
        if: inputs.operation != 'capture'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n unshare --net -- env -i PATH="$PATH" DEBATE_HOST_NETWORK_NAMESPACE="$(readlink /proc/self/ns/net)" node scripts/test-debate-wrangler-metadata.mjs
      - name: Install existing pinned browser tooling for the hosted control rehearsal
        if: inputs.operation == 'hosted-rehearsal'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.54.2
      - name: Verify gates, provision scoped test sessions, execute requested operation and clean exact fixtures
        if: inputs.operation != 'capture'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ env.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          REQUESTED_STAGING_OPERATION: ${{ inputs.operation }}
        run: |
          if [[ "$REQUESTED_STAGING_OPERATION" == 'hosted-rehearsal' ]]; then
            DEBATE_HOSTED_REHEARSAL=1 DEBATE_HOSTED_BROWSER_CI=1 node scripts/run-debate-hosted-rehearsal.mjs run
          elif [[ "$REQUESTED_STAGING_OPERATION" == 'upload-diagnostic' ]]; then
            DEBATE_HOSTED_REHEARSAL=1 node scripts/run-debate-hosted-rehearsal.mjs upload-diagnostic
          elif [[ "$REQUESTED_STAGING_OPERATION" == 'prepare-hosted' ]]; then
            DEBATE_HOSTED_REHEARSAL=1 node scripts/run-debate-hosted-rehearsal.mjs prepare
          else
            node scripts/run-debate-staging-auth.mjs "$REQUESTED_STAGING_OPERATION"
          fi
      - name: Retain sanitized release evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debate-v3-staging-release-${{ github.sha }}
          path: |
            artifacts/debate-local-rehearsal/staging-release/*.json
            artifacts/debate-local-rehearsal/staging-release/hosted-*/driver.json
            artifacts/debate-local-rehearsal/staging-release/hosted-*/fixtures.json
            artifacts/debate-local-rehearsal/staging-release/hosted-*/upload-diagnostic.json
            artifacts/debate-local-rehearsal/staging-release/hosted-*/browser/report.json
            artifacts/debate-local-rehearsal/staging-release/hosted-*/browser/screenshots/*.png
            artifacts/debate-local-rehearsal/staging-release/hosted-*/browser/downloads/*.pdf
            artifacts/debate-local-rehearsal/staging-release/hosted-*/browser/downloads/*.csv
            artifacts/debate-local-rehearsal/suite-*/report.json
            artifacts/debate-local-rehearsal/staging-dml-probe-ci/report.json
            artifacts/debate-local-rehearsal/wrangler-metadata/report.json
          if-no-files-found: warn
          retention-days: 14
