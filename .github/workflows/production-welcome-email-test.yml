name: Send production welcome email test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-welcome-email-test
  cancel-in-progress: false

jobs:
  send:
    if: github.repository == 'codingwally/Bar-Exam-simulator'
    runs-on: ubuntu-latest
    environment: production-worker
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send through the existing production Worker and restore its version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-worker-welcome.mjs
