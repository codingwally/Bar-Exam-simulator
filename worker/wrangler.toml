name = "duediligence-gemini-examiner"
main = "index.mjs"
compatibility_date = "2026-07-26"
preview_urls = false

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_GROUNDING_ENABLED = "false"
ALLOWED_ORIGIN = "https://duediligence.ph"

[observability]
enabled = true

[observability.logs]
enabled = true

# GEMINI_API_KEY must remain a Cloudflare secret. Never add it to this file.
