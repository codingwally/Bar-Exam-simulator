name: Temporary Examination Room browser QA

on:
  push:
    branches:
      - fix/examination-room-privacy-new-exam-readability-20260827
    paths:
      - .github/workflows/temp-examination-room-browser-qa.yml

permissions:
  contents: read

jobs:
  browser-qa:
    if: contains(github.event.head_commit.message, 'stage temporary examination room browser QA')
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/examination-room-preview.log 2>&1 &
          echo $! > /tmp/examination-room-preview.pid
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173/examination-room/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/examination-room-preview.log
          exit 1

      - name: Verify consecutive creation and responsive readability
        shell: bash
        run: |
          mkdir -p browser-qa
          cat > /tmp/examination-room-browser-qa.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('node:fs');

          const viewports = [
            { name: 'laptop-1366x768', width: 1366, height: 768 },
            { name: 'desktop-1920x1080', width: 1920, height: 1080 },
            { name: 'phone-390x844', width: 390, height: 844 },
          ];

          function numericStyle(value) {
            return Number.parseFloat(String(value || '').replace('px', ''));
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = { viewports: [], creation: [] };
            try {
              for (const viewport of viewports) {
                const context = await browser.newContext({ viewport });
                const page = await context.newPage();
                await page.addInitScript(() => localStorage.clear());
                await page.goto('http://127.0.0.1:4173/examination-room/?demo=1', { waitUntil: 'networkidle' });
                await page.waitForSelector('#app-shell:not([hidden])', { timeout: 15000 });
                const styles = await page.evaluate(() => {
                  const body = getComputedStyle(document.body);
                  const save = getComputedStyle(document.querySelector('#save-draft'));
                  const title = getComputedStyle(document.querySelector('#exam-title'));
                  const prompt = getComputedStyle(document.querySelector('.question-prompt'));
                  const field = getComputedStyle(document.querySelector('#instructions'));
                  return {
                    bodyFontSize: body.fontSize,
                    bodyLineHeight: body.lineHeight,
                    saveFontSize: save.fontSize,
                    saveMinHeight: save.minHeight,
                    titleFontSize: title.fontSize,
                    promptFontSize: prompt.fontSize,
                    fieldFontSize: field.fontSize,
                    scrollWidth: document.documentElement.scrollWidth,
                    clientWidth: document.documentElement.clientWidth,
                  };
                });
                if (numericStyle(styles.bodyFontSize) < 15) throw new Error(`${viewport.name}: body text below 15px`);
                if (numericStyle(styles.saveFontSize) < 14) throw new Error(`${viewport.name}: button text below 14px`);
                if (numericStyle(styles.saveMinHeight) < 42) throw new Error(`${viewport.name}: button target below 42px`);
                if (numericStyle(styles.promptFontSize) < 15) throw new Error(`${viewport.name}: question text below 15px`);
                if (numericStyle(styles.fieldFontSize) < 15) throw new Error(`${viewport.name}: field text below 15px`);
                if (styles.scrollWidth > styles.clientWidth + 1) throw new Error(`${viewport.name}: horizontal overflow detected`);
                await page.screenshot({ path: `browser-qa/${viewport.name}.png`, fullPage: true });
                report.viewports.push({ ...viewport, ...styles });
                await context.close();
              }

              const context = await browser.newContext({ viewport: { width: 1366, height: 768 } });
              const page = await context.newPage();
              await page.addInitScript(() => localStorage.clear());
              await page.goto('http://127.0.0.1:4173/examination-room/?demo=1', { waitUntil: 'networkidle' });
              await page.waitForSelector('#app-shell:not([hidden])', { timeout: 15000 });
              for (let attempt = 1; attempt <= 2; attempt += 1) {
                await page.click('#more-actions');
                await page.click('[data-action="new-exam"]');
                await page.waitForLoadState('networkidle');
                await page.waitForSelector('#app-shell:not([hidden])', { timeout: 15000 });
                const state = await page.evaluate(() => ({
                  url: location.href,
                  title: document.querySelector('#exam-title')?.value || '',
                  saved: document.querySelector('#saved-status')?.textContent?.trim() || '',
                  errorHidden: document.querySelector('#error-banner')?.hidden === true,
                  privacyFixLoaded: window.ExaminationRoomV1Api?.__professorDraftPolicyFixApplied === true,
                }));
                if (!state.url.includes('exam=')) throw new Error(`creation ${attempt}: examination URL was not assigned`);
                if (state.title !== 'Untitled examination') throw new Error(`creation ${attempt}: server-backed untitled draft was not restored`);
                if (!state.errorHidden) throw new Error(`creation ${attempt}: an error banner remained visible`);
                if (!state.privacyFixLoaded) throw new Error(`creation ${attempt}: privacy policy normalizer was not loaded`);
                report.creation.push({ attempt, ...state });
              }
              await page.screenshot({ path: 'browser-qa/consecutive-new-examinations.png', fullPage: true });
              await context.close();
              fs.writeFileSync('browser-qa/report.json', JSON.stringify(report, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/examination-room-browser-qa.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examination-room-browser-qa
          path: browser-qa
          if-no-files-found: error
