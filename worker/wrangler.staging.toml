name = "duediligence-examinations-staging"
main = "commercial-entry.mjs"
compatibility_date = "2026-07-26"
preview_urls = true

[placement]
region = "gcp:us-east4"

[vars]
SUPABASE_URL = "https://hlzqmreeoghbldnhlybr.supabase.co"
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_GROUNDING_ENABLED = "false"
ALLOWED_ORIGIN = "https://duediligence-examinations-staging.wallyesteban1993.workers.dev"
ALLOW_LEGACY_GUESTS = "false"
PHASE4_ACCESS_ENFORCEMENT = "true"
PHASE4_MODEL_QUALITY_ENFORCEMENT = "true"
REQUIRE_AUTHENTICATED_SUBMISSIONS = "true"
EXAMINATION_ROOM_ENABLED = "true"
EXAMINATION_ROOM_EMAIL_MODE = "suppressed"
EXAMINATION_ROOM_RECOVERY_MODE = "supabase_storage"
OUTBOUND_EMAIL_MODE = "suppressed"
ADMIN_DIRECTORY_EMAIL_MODE = "suppressed"
ADMIN_DIRECTORY_EMAIL_FROM = "Due Diligence Administration <support@duediligence.ph>"
SUPPORT_NOTIFICATION_EMAIL_MODE = "suppressed"
SUPPORT_NOTIFICATION_EMAIL_FROM = "Due Diligence Support <support@duediligence.ph>"
SIGN_IN_NOTIFICATION_EMAIL_MODE = "suppressed"
SIGN_IN_NOTIFICATION_EMAIL_FROM = "Due Diligence Sign-in Notice <support@duediligence.ph>"
PRIVATE_BETA_GATE_ENABLED = "false"
PRIVATE_BETA_DISCLOSURE_VERSION = "beta-disclosure-v1-2026-07-31"
VERDICT_PDF_ENABLED = "true"
VERDICT_PDF_PREMIUM_REQUIRED = "false"
BAR_EASY_ENABLED = "true"
CHAIR_CASES_ENABLED = "true"
DOCTRINES_ENABLED = "true"
ANCHOR_CASE_DIGESTS_ENABLED = "true"
AI_PREPARED_BETA_BADGE = "false"
CONTENT_HUMAN_REVIEW_REQUIRED = "false"
BAR_QUESTION_PRACTICE_RANDOMIZATION_V2_ENABLED = "true"
SYLLABUS_BASED_REVIEW_RANDOMIZATION_V2_ENABLED = "true"
BAR_EXAM_SIMULATION_RANDOMIZATION_V1_SCHEMA_READY = "true"
BAR_EXAM_SIMULATION_RANDOMIZATION_V1_ENABLED = "true"

[assets]
directory = "../.staging-dist"

[observability]
enabled = true

[observability.logs]
enabled = true

[triggers]
crons = ["*/2 * * * *"]

# Staging secrets are configured directly in Cloudflare and never committed:
# GEMINI_API_KEY
# GUEST_USAGE_HMAC_KEY
# SUPABASE_SERVICE_ROLE_KEY
# EXAMINATION_ROOM_KEY_PEPPER
# EXAMINATION_ROOM_OWNER_DATA_KEY_V1
# EXAMINATION_ROOM_BACKUP_MASTER_KEY_V1
# EXAMINATION_ROOM_ADMIN_EMAILS
# PRIVATE_BETA_ACCESS_CODE_VERIFIER
# PRIVATE_BETA_ACCESS_CODE_PEPPER
# PRIVATE_BETA_FLOW_SIGNING_KEY
# ADMIN_DIRECTORY_RECIPIENTS_JSON
# GOOGLE_OAUTH_CLIENT_ID
# GOOGLE_OAUTH_CLIENT_SECRET
# GOOGLE_OAUTH_REFRESH_TOKEN
