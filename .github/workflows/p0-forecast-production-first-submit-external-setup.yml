name: P0 Forecast production first-submit external setup

on:
  push:
    branches:
      - hotfix/p0-production-first-submit-proof-20260903
    paths:
      - .github/workflows/p0-forecast-production-first-submit-external-setup.yml

permissions:
  contents: read

concurrency:
  group: p0-forecast-production-first-submit-external-setup
  cancel-in-progress: true

jobs:
  prove:
    name: Create disposable user, submit once, and require coaching
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: https://hbllomlijfznnuudpdvr.supabase.co
      SITE_URL: https://duediligence.ph
      WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create disposable unconfirmed account and wait for protected setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-production-first-submit
          publishable_key="$(grep -Eo 'sb_publishable_[A-Za-z0-9_-]{20,}' assets/phase2-config.js | head -n 1)"
          [[ "$publishable_key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]
          user_email="dd-p0-prod-${GITHUB_RUN_ID}@example.com"
          user_password="Dd!$(node --input-type=module -e "import { randomBytes } from 'node:crypto'; process.stdout.write(randomBytes(36).toString('base64url'))")9z"
          echo "::add-mask::$publishable_key"
          echo "::add-mask::$user_email"
          echo "::add-mask::$user_password"
          echo "P0_PUBLISHABLE_KEY=$publishable_key" >> "$GITHUB_ENV"
          echo "P0_USER_EMAIL=$user_email" >> "$GITHUB_ENV"
          echo "P0_USER_PASSWORD=$user_password" >> "$GITHUB_ENV"

          signup_response="$RUNNER_TEMP/p0-forecast-signup.json"
          signup_status="$(curl --silent --show-error \
            --output "$signup_response" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: $publishable_key" \
            --header "Authorization: Bearer $publishable_key" \
            --header 'Content-Type: application/json' \
            --data "$(jq -nc --arg email "$user_email" --arg password "$user_password" '{email:$email,password:$password,data:{display_name:"Forecast P0 Production Proof",full_name:"Forecast P0 Production Proof"}}')" \
            "$SUPABASE_URL/auth/v1/signup")"
          case "$signup_status" in
            200|201) ;;
            *)
              echo "Disposable Auth signup failed with HTTP $signup_status." >&2
              jq -c '{code:(.code // .error_code // "unknown"),message:(.msg // .message // "signup failed")}' "$signup_response" >&2 || true
              exit 1
              ;;
          esac
          user_id="$(jq -r '.user.id // .id // empty' "$signup_response")"
          [[ "$user_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]
          echo "::add-mask::$user_id"
          echo "P0_USER_ID=$user_id" >> "$GITHUB_ENV"
          rm -f -- "$signup_response"
          printf '{"signupCreated":true,"production":true,"runId":"%s"}\n' "$GITHUB_RUN_ID" \
            > artifacts/p0-production-first-submit/setup.json

          authenticated=false
          for attempt in {1..120}; do
            token_response="$RUNNER_TEMP/p0-token.json"
            token_status="$(curl --silent --show-error \
              --output "$token_response" \
              --write-out '%{http_code}' \
              --request POST \
              --header "apikey: $publishable_key" \
              --header "Authorization: Bearer $publishable_key" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg email "$user_email" --arg password "$user_password" '{email:$email,password:$password}')" \
              "$SUPABASE_URL/auth/v1/token?grant_type=password")"
            if [[ "$token_status" == '200' ]] && jq -e '.access_token | type == "string" and length > 20' "$token_response" >/dev/null; then
              authenticated=true
              rm -f -- "$token_response"
              break
            fi
            rm -f -- "$token_response"
            sleep 5
          done
          test "$authenticated" = 'true'
          echo 'Disposable account is confirmed and ready for the protected first-submit proof.'

      - name: Submit exactly once and require all 20 visible coaching cards
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.54.2
          cat > "$RUNNER_TEMP/p0-production-first-submit.mjs" <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const siteUrl = process.env.SITE_URL;
          const workerUrl = process.env.WORKER_URL;
          const email = process.env.P0_USER_EMAIL;
          const password = process.env.P0_USER_PASSWORD;
          const expectedUserId = process.env.P0_USER_ID;
          const runId = process.env.GITHUB_RUN_ID;
          const forecastPath = '/admin/dd2026/bar-forecast';
          const marker = `P0PROD-${runId}`;
          const browser = await chromium.launch({ channel: 'chrome', headless: true });
          const context = await browser.newContext({
            viewport: { width: 1280, height: 900 },
            serviceWorkers: 'block',
            acceptDownloads: false,
          });
          const page = await context.newPage();
          page.setDefaultTimeout(60_000);
          let pageErrors = 0;
          let consoleErrors = 0;
          let unexpectedConsoleErrors = 0;
          let submitRequests = 0;
          const submitStatuses = [];
          page.on('pageerror', () => { pageErrors += 1; });
          page.on('console', (message) => {
            if (message.type() !== 'error') return;
            consoleErrors += 1;
            if (!/Failed to load resource:[\s\S]*status of (?:401|403|404|409)\b/iu.test(message.text())) {
              unexpectedConsoleErrors += 1;
            }
          });
          page.on('request', (request) => {
            let url;
            try { url = new URL(request.url()); } catch { return; }
            if (url.pathname !== forecastPath) return;
            try {
              if (request.postDataJSON()?.operation === 'submit') submitRequests += 1;
            } catch {}
          });
          page.on('response', (response) => {
            let url;
            try { url = new URL(response.url()); } catch { return; }
            if (url.pathname !== forecastPath) return;
            try {
              if (response.request().postDataJSON()?.operation === 'submit') submitStatuses.push(response.status());
            } catch {}
          });

          try {
            await page.goto(`${siteUrl}/?p0-production-first-submit=${encodeURIComponent(runId)}`, {
              waitUntil: 'domcontentloaded',
              timeout: 60_000,
            });
            await page.waitForFunction(() => Boolean(
              window.supabase?.createClient && window.DueDiligencePhase2Config?.supabase,
            ));
            const auth = await page.evaluate(async ({ credentials, expectedWorker }) => {
              const config = window.DueDiligencePhase2Config;
              if (config.workerUrl !== expectedWorker) return { ok: false, code: 'WORKER_MISMATCH' };
              const client = window.supabase.createClient(config.supabase.url, config.supabase.publishableKey, {
                auth: {
                  persistSession: true,
                  storage: window.DueDiligenceAuthSessionStorage?.prepare?.(config.supabase.url) || window.localStorage,
                  autoRefreshToken: true,
                  detectSessionInUrl: false,
                },
              });
              const { data, error } = await client.auth.signInWithPassword(credentials);
              return { ok: !error && Boolean(data?.session?.access_token), userId: data?.user?.id || '', code: error?.code || '' };
            }, { credentials: { email, password }, expectedWorker: workerUrl });
            assert.equal(auth.ok, true, `Production proof sign-in failed (${auth.code || 'unknown'}).`);
            assert.equal(auth.userId, expectedUserId);

            await page.waitForFunction(() => Boolean(
              window.DueDiligenceBarForecast?.open && window.DueDiligencePhase4?.ensureRequiredSetup,
            ));
            await page.evaluate(() => window.DueDiligenceBarForecast.open());
            await page.waitForFunction(() => (
              Boolean(document.querySelector('.bf26-picker'))
              || document.querySelector('[data-bf26-status]')?.dataset?.kind === 'error'
            ), null, { timeout: 90_000 });
            await page.evaluate(() => {
              const root = document.getElementById('bf26-root');
              if (root) root.inert = false;
              document.querySelectorAll('.dd2-overlay.is-open, .modal-overlay.open, #private-beta-dialog[open]')
                .forEach((surface) => {
                  surface.classList.remove('is-open', 'open');
                  if (surface instanceof HTMLDialogElement && surface.open) surface.close();
                  surface.hidden = true;
                });
            });
            await page.getByRole('heading', { name: 'Choose a 2026 Bar subject.' })
              .waitFor({ state: 'visible', timeout: 60_000 });
            const subjects = page.locator('[data-subject]');
            assert.equal(await subjects.count(), 6);
            const startPromise = page.waitForResponse((response) => {
              let url;
              try { url = new URL(response.url()); } catch { return false; }
              if (url.pathname !== forecastPath) return false;
              try { return response.request().postDataJSON()?.operation === 'start'; } catch { return false; }
            });
            await subjects.first().evaluate((button) => button.click());
            const startResponse = await startPromise;
            await startResponse.finished();
            assert.equal(startResponse.status(), 200);
            await page.locator('.bf26-exam').waitFor({ state: 'visible', timeout: 60_000 });
            assert.equal(await page.locator('.bf26-question-jump').count(), 20);

            for (let index = 0; index < 20; index += 1) {
              await page.locator('.bf26-question-jump').nth(index).evaluate((button) => button.click());
              await page.locator('#bf26-current-answer').fill(
                `${marker}-Q${index + 1}. Yes. Applying the controlling rule to every material fact, the requested conclusion follows from the stated legal basis.`,
              );
            }

            const submit = page.locator('.bf26-exam-footer').getByRole('button', { name: 'Submit all answers' });
            assert.equal(await submit.isEnabled(), true);
            page.once('dialog', (dialog) => dialog.accept());
            const submitPromise = page.waitForResponse((response) => {
              let url;
              try { url = new URL(response.url()); } catch { return false; }
              if (url.pathname !== forecastPath) return false;
              try { return response.request().postDataJSON()?.operation === 'submit'; } catch { return false; }
            }, { timeout: 15 * 60_000 });
            const submittedAt = Date.now();
            await submit.click();
            const submitResponse = await submitPromise;
            await submitResponse.finished();
            const durationMs = Date.now() - submittedAt;
            const payload = await submitResponse.json();
            assert.equal(submitResponse.status(), 200);
            assert.equal(payload?.ok, true);
            assert.equal(payload?.maxScore, 100);
            assert.equal(Array.isArray(payload?.results), true);
            assert.equal(payload.results.length, 20);
            payload.results.forEach((result, index) => {
              assert.ok(String(result?.userAnswer || '').includes(`${marker}-Q${index + 1}`));
              assert.ok(String(result?.feedback || '').trim());
              assert.ok(String(result?.suggestedAnswer || '').trim());
              assert.ok(String(result?.explanation || '').trim());
              assert.ok(String(result?.mockBarCoaching?.strength || '').trim());
              assert.ok(String(result?.mockBarCoaching?.priorityImprovement || '').trim());
              assert.ok(String(result?.mockBarCoaching?.nextStep || '').trim());
            });

            await page.locator('.bf26-results').waitFor({ state: 'visible', timeout: 60_000 });
            const visible = await page.locator('.bf26-result').evaluateAll((items) => items.map((item) => {
              const sections = new Map([...item.querySelectorAll('.bf26-result-section')].map((section) => [
                section.querySelector('h4')?.textContent?.trim() || '',
                section.querySelector('p')?.textContent?.trim() || '',
              ]));
              return {
                answer: sections.get('Your answer') || '',
                coaching: (item.querySelector('.bf26-coaching-summary')?.textContent?.trim() || '').length,
                suggested: (sections.get('Suggested answer') || '').length,
                rationale: (sections.get('Score rationale') || '').length,
              };
            }));
            assert.equal(visible.length, 20);
            visible.forEach((result, index) => {
              assert.ok(result.answer.includes(`${marker}-Q${index + 1}`));
              assert.ok(result.coaching > 0);
              assert.ok(result.suggested > 0);
              assert.ok(result.rationale > 0);
            });
            assert.equal(submitRequests, 1);
            assert.deepEqual(submitStatuses, [200]);
            assert.equal(pageErrors, 0);
            assert.equal(unexpectedConsoleErrors, 0);

            const signedOut = await page.evaluate(async () => {
              const config = window.DueDiligencePhase2Config?.supabase;
              if (!config || !window.supabase?.createClient) return false;
              const client = window.supabase.createClient(config.url, config.publishableKey, {
                auth: {
                  persistSession: true,
                  storage: window.DueDiligenceAuthSessionStorage?.prepare?.(config.url) || window.localStorage,
                  autoRefreshToken: false,
                  detectSessionInUrl: false,
                },
              });
              const { error } = await client.auth.signOut({ scope: 'global' });
              return !error;
            });
            assert.equal(signedOut, true);
            await writeFile('artifacts/p0-production-first-submit/result.json', JSON.stringify({
              ok: true,
              environment: 'production',
              firstAttempt: true,
              submitRequests,
              submitStatus: submitStatuses[0],
              durationMs,
              resultCount: payload.results.length,
              visibleResultCount: visible.length,
              pageErrors,
              consoleErrors,
              unexpectedConsoleErrors,
              signedOut,
            }, null, 2));
          } finally {
            await context.close().catch(() => undefined);
            await browser.close().catch(() => undefined);
          }
          NODE
          node "$RUNNER_TEMP/p0-production-first-submit.mjs"
          cat artifacts/p0-production-first-submit/result.json

      - name: Upload sanitized proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-forecast-production-first-submit-external-${{ github.run_id }}
          path: artifacts/p0-production-first-submit/*.json
          if-no-files-found: warn
          retention-days: 30
