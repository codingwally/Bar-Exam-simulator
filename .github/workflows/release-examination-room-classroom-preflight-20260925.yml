name: Examination Room classroom-preflight release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-classroom-preflight-20260925.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  LIVE_BASE_SHA: c1213b614756fb3fbde8778e08ae59abcb3830a7
  PATCH_SOURCE_SHA: f3a8629ccea76c6e29c419ddfc63a9547707c062
  SITE_URL: https://duediligence.ph

jobs:
  deploy:
    name: Verify and deploy classroom-preflight client
    if: "${{ github.event.head_commit.message == 'release: deploy Examination Room classroom preflight' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact live Pages baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIVE_BASE_SHA }}
          fetch-depth: 0

      - name: Overlay only reviewed classroom-preflight assets
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PATCH_SOURCE_SHA^{commit}"
          for file in             examination-room/student.js             examination-room/student.html             examination-room/professor.js             examination-room/index.html             examination-room/student.client.test.cjs             service-worker.js; do
            git show "$PATCH_SOURCE_SHA:$file" > "$file"
          done

          changed="$(git diff --name-only)"
          expected="$(printf '%s\n'             examination-room/index.html             examination-room/professor.js             examination-room/student.client.test.cjs             examination-room/student.html             examination-room/student.js             service-worker.js | sort)"
          test "$(printf '%s\n' "$changed" | sort)" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate classroom-preflight behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check examination-room/student.js
          node --check examination-room/professor.js
          node --check examination-room/api.js
          node --check service-worker.js
          node --test             examination-room/student.client.test.cjs             examination-room/api.demo.test.cjs             examination-room/view-models.test.cjs
          git diff --check

          grep -Fq "HEARTBEAT_INTERVAL_MS = 15000" examination-room/student.js
          grep -Fq "studentCommand('heartbeat'" examination-room/student.js
          grep -Fq "handleClipboardIntegrityEvent" examination-room/student.js
          grep -Fq "Examination event log" examination-room/professor.js
          grep -Fq "<th>Last seen</th>" examination-room/index.html
          grep -Fq "Search name, email, or student number" examination-room/index.html
          grep -Fq "student.js?v=classroom-preflight-20260925-1" examination-room/student.html
          grep -Fq "professor.js?v=classroom-preflight-20260925-1" examination-room/index.html
          grep -Fq "duediligence-shell-examination-classroom-preflight-20260925-1" service-worker.js

      - name: Build and verify patched Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$PATCH_SOURCE_SHA" node scripts/test-pages-artifact.mjs
          test "$(cat .pages-dist/.well-known/duediligence-release.txt)" = "$PATCH_SOURCE_SHA"
          grep -Fq "HEARTBEAT_INTERVAL_MS = 15000" .pages-dist/examination-room/student.js
          grep -Fq "Examination event log" .pages-dist/examination-room/professor.js
          grep -Fq "student.js?v=classroom-preflight-20260925-1" .pages-dist/examination-room/student.html
          grep -Fq "professor.js?v=classroom-preflight-20260925-1" .pages-dist/examination-room/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload exact patched Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live classroom-preflight assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            marker="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/.well-known/duediligence-release.txt?release=$PATCH_SOURCE_SHA" || true)"
            professor="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/professor.js?v=classroom-preflight-20260925-1&release=$PATCH_SOURCE_SHA" || true)"
            student="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.js?v=classroom-preflight-20260925-1&release=$PATCH_SOURCE_SHA" || true)"
            page="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.html?release=$PATCH_SOURCE_SHA" || true)"

            if [[ "$marker" == "$PATCH_SOURCE_SHA" ]]               && grep -Fq "HEARTBEAT_INTERVAL_MS = 15000" <<<"$student"               && grep -Fq "studentCommand('heartbeat'" <<<"$student"               && grep -Fq "Examination event log" <<<"$professor"               && grep -Fq "student.js?v=classroom-preflight-20260925-1" <<<"$page"; then
              echo "Classroom-preflight Examination Room client is live."
              exit 0
            fi
            sleep 5
          done

          echo "Classroom-preflight assets did not converge in time." >&2
          exit 1
