name: Examination Room professor answer downloads release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-professor-downloads-20260922.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PRODUCTION_BASE_SHA: 43b4730825f68abb324fe3826a7bbfdca47c5a92
  RELEASE_SOURCE_SHA: aad73bf011435a38a228cefe99c8c19548fb0397
  SITE_URL: https://duediligence.ph
  APPROVAL_REFERENCE: owner-chat-professor-answer-downloads-2026-09-22

jobs:
  deploy:
    name: Verify and deploy professor answer downloads
    if: "${{ github.event.head_commit.message == 'release: deploy professor answer downloads' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact reviewed release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove isolated production scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git cat-file -e "$PRODUCTION_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$RELEASE_SOURCE_SHA"
          python - <<'PY'
          import os
          import subprocess

          base = os.environ['PRODUCTION_BASE_SHA']
          source = os.environ['RELEASE_SOURCE_SHA']
          expected = {
              '.github/workflows/release-examination-room-resilient-submit-20260922.yml',
              'examination-room/index.html',
              'examination-room/professor.client.test.cjs',
              'examination-room/professor.js',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..{source}'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f'Unexpected professor-download release scope. expected={sorted(expected)} actual={sorted(changed)}'
              )
          print('Exact professor-download release scope verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate complete Examination Room workflow
        shell: bash
        run: |
          set -euo pipefail
          node --check examination-room/professor.js
          node --test             examination-room/api.demo.test.cjs             examination-room/media-capture.contract.test.cjs             examination-room/offline-grading.test.cjs             examination-room/professor.client.test.cjs             examination-room/student.client.test.cjs             examination-room/view-models.test.cjs
          git diff --check "$PRODUCTION_BASE_SHA..$RELEASE_SOURCE_SHA"
          grep -Fq 'id="download-all-submitted-answers"' examination-room/index.html
          grep -Fq 'function downloadAllSubmittedAnswers' examination-room/professor.js
          grep -Fq 'URL.revokeObjectURL(url), 60_000' examination-room/professor.js
          grep -Fq 'no coding or file conversion is required' examination-room/professor.js

      - name: Build and verify exact Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node scripts/test-pages-artifact.mjs
          grep -Fq 'id="download-all-submitted-answers"' .pages-dist/examination-room/index.html
          grep -Fq 'professor.js?v=professor-answer-downloads-20260922-1' .pages-dist/examination-room/index.html
          grep -Fq 'function downloadAllSubmittedAnswers' .pages-dist/examination-room/professor.js
          grep -Fq 'type: '"'"'text/html;charset=utf-8'"'"'' .pages-dist/examination-room/professor.js
          test "$(cat .pages-dist/.well-known/duediligence-release.txt)" = "$RELEASE_SOURCE_SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload exact sanitized Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live professor downloads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            marker="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/.well-known/duediligence-release.txt?release=$RELEASE_SOURCE_SHA" || true)"
            page="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/?release=$RELEASE_SOURCE_SHA" || true)"
            professor="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/professor.js?v=professor-answer-downloads-20260922-1&release=$RELEASE_SOURCE_SHA" || true)"
            if [[ "$marker" == "$RELEASE_SOURCE_SHA" ]]               && grep -Fq 'id="download-all-submitted-answers"' <<<"$page"               && grep -Fq 'professor.js?v=professor-answer-downloads-20260922-1' <<<"$page"               && grep -Fq 'function downloadAllSubmittedAnswers' <<<"$professor"               && grep -Fq 'URL.revokeObjectURL(url), 60_000' <<<"$professor"; then
              echo "Professor answer downloads are live."
              exit 0
            fi
            sleep 5
          done
          echo "Pages deployed but professor answer downloads did not converge in time." >&2
          exit 1
