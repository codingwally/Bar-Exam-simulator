name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify authentication, admission, and public-shell contracts
        run: |
          node scripts/test-private-beta-admission.mjs
          node scripts/test-private-beta-frontend.mjs
          node scripts/test-private-beta-landing.mjs
          node scripts/test-private-beta-auth-regression.mjs
          node scripts/test-phase2-contract.mjs
          node scripts/test-auth-route-overlay.mjs
          node scripts/test-onboarding-flow.mjs
          node scripts/test-post-grade-controls.mjs
          node scripts/test-beta-readiness-copy-seo.mjs
          node scripts/test-lifetime-grade-ui.mjs
          node scripts/test-audience-menu.mjs

      - name: Build sanitized Pages artifact
        run: node scripts/build-pages-artifact.mjs

      - name: Verify sanitized Pages artifact
        run: node scripts/test-pages-artifact.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
