name = "duediligence-gemini-examiner"
main = "maintenance-entry.mjs"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]
preview_urls = false

[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[placement]
region = "gcp:us-east4"

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_GROUNDING_ENABLED = "false"
ALLOWED_ORIGIN = "https://duediligence.ph"
MAINTENANCE_MODE = "false"
MAINTENANCE_PASSWORD_HASH = "47774b9663224515a9e6a10a81c45e30655bcfa3a1073175e0e46798de2aa672"
MAINTENANCE_TOKEN_TTL_SECONDS = "604800"
ALLOW_LEGACY_GUESTS = "false"
PHASE4_ACCESS_ENFORCEMENT = "true"
PHASE4_MODEL_QUALITY_ENFORCEMENT = "true"
REQUIRE_AUTHENTICATED_SUBMISSIONS = "true"
EXAMINATION_ROOM_ENABLED = "true"
EXAMINATION_ROOM_EMAIL_MODE = "enabled"
EXAMINATION_ROOM_RECOVERY_MODE = "supabase_storage"
OUTBOUND_EMAIL_MODE = "suppressed"
ADMIN_DIRECTORY_EMAIL_MODE = "suppressed"
ADMIN_DIRECTORY_EMAIL_FROM = "Due Diligence Administration <support@duediligence.ph>"
SUPPORT_NOTIFICATION_EMAIL_MODE = "suppressed"
SUPPORT_NOTIFICATION_EMAIL_FROM = "Due Diligence Support <support@duediligence.ph>"
SIGN_IN_NOTIFICATION_EMAIL_MODE = "suppressed"
SIGN_IN_NOTIFICATION_EMAIL_FROM = "Due Diligence Sign-in Notice <support@duediligence.ph>"
ADMIN_PULSE_ENABLED = "true"
ADMIN_PULSE_WEB_PUSH_ENABLED = "true"
ADMIN_PULSE_VAPID_PUBLIC_KEY = "BMm9cPIA2Su28Y9s0EPFFy4dQasWbAWl1GsisYa9_48zeejnzPGYdF-YfkqqNlurue1WRrQczw-w6C1lH51pF7A"
ADMIN_PULSE_VAPID_SUBJECT = "mailto:support@duediligence.ph"
PAYMENT_NOTIFICATION_EMAIL_MODE = "enabled"
PAYMENT_NOTIFICATION_EMAIL_FROM = "Due Diligence Payments <support@duediligence.ph>"
PRIVATE_BETA_GATE_ENABLED = "false"
PRIVATE_BETA_DISCLOSURE_VERSION = "beta-disclosure-v1-2026-07-31"
VERDICT_PDF_ENABLED = "true"
VERDICT_PDF_PREMIUM_REQUIRED = "false"
BAR_EASY_ENABLED = "true"
CHAIR_CASES_ENABLED = "true"
DOCTRINES_ENABLED = "true"
ANCHOR_CASE_DIGESTS_ENABLED = "true"
AI_PREPARED_BETA_BADGE = "false"
CONTENT_HUMAN_REVIEW_REQUIRED = "false"
BAR_QUESTION_PRACTICE_RANDOMIZATION_V2_ENABLED = "true"
SYLLABUS_BASED_REVIEW_RANDOMIZATION_V2_ENABLED = "true"
BAR_EXAM_SIMULATION_RANDOMIZATION_V1_SCHEMA_READY = "true"
BAR_EXAM_SIMULATION_RANDOMIZATION_V1_ENABLED = "true"
STUDY_ROOM_ENABLED = "true"
STUDY_ROOM_NAME = "dd-study-room-admin-beta-prod-v1"

[secrets]
required = ["LIVEKIT_URL", "LIVEKIT_API_KEY", "LIVEKIT_API_SECRET"]

[observability]
enabled = true

[observability.logs]
enabled = true

[triggers]
crons = ["*/2 * * * *"]

# GEMINI_API_KEY, RESEND_API_KEY, SUPABASE_SERVICE_ROLE_KEY, and
# MAINTENANCE_SIGNING_KEY must remain Cloudflare secrets. The signing key is
# generated automatically by the approved deployment workflow and is never
# exposed to the browser or committed to this repository.
# Payment-verification email is enabled only in production and uses the existing
# Resend secret without exposing it to the browser.
# PRIVATE_BETA_ACCESS_CODE_VERIFIER, PRIVATE_BETA_ACCESS_CODE_PEPPER, and
# PRIVATE_BETA_FLOW_SIGNING_KEY must also remain Cloudflare secrets.
# EXAMINATION_ROOM_KEY_PEPPER must remain a Cloudflare secret. It protects
# room-key, student-session, and idempotency verifiers; never expose or commit it.
# EXAMINATION_ROOM_OWNER_DATA_KEY_V1 must remain a 32-byte Cloudflare secret.
# It encrypts recoverable room-key envelopes and never enters Supabase or a browser.
# EXAMINATION_ROOM_BACKUP_MASTER_KEY_V1 must remain a 32-byte Cloudflare secret.
# It encrypts immutable recovery objects before they are written to private Supabase Storage.
# EXAMINATION_ROOM_ADMIN_EMAILS must remain a Cloudflare secret containing a JSON
# array (or object values) of owner email addresses that receive BCC key copies.
# EXAMINATION_ROOM_EMAIL_FROM may be configured as a non-secret sender address.
# ADMIN_DIRECTORY_RECIPIENTS_JSON must remain a Cloudflare secret containing
# only the approved founder recipient-key to personal-email mapping.
# SUPABASE_URL must be configured as a Worker environment variable.
# ADMIN_PULSE_VAPID_PUBLIC_KEY may be configured as a non-secret Worker variable.
# ADMIN_PULSE_VAPID_PRIVATE_KEY must remain a Cloudflare secret. Both Admin Pulse
# feature switches are enabled for the reviewed pilot, while the independent
# database capture and delivery switches remain the immediate kill switches.
# LIVEKIT_URL, LIVEKIT_API_KEY, and LIVEKIT_API_SECRET must remain Cloudflare
# secrets. They are injected atomically by the Study Room release workflow and
# are never exposed in Pages, logs, or committed configuration.
# Never add secret values to this file.
# Google OAuth client ID, client secret, and refresh token must remain encrypted
# Worker secrets for the retained content synchronization path.
