name: Deploy approved frontend-only release to Pages

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this isolated frontend-only production release has explicit approval"
        required: true
        default: false
        type: boolean
      approval_reference:
        description: "Approval/change reference recorded in the release log"
        required: true
        type: string
      expected_base_sha:
        description: "Exact currently deployed Pages source SHA"
        required: true
        type: string
      expected_source_sha:
        description: "Exact reviewed frontend release source SHA"
        required: true
        type: string
      validation_run_id:
        description: "Successful mandatory pull-request validation for the exact merged candidate tree"
        required: true
        type: string
      staging_preview_url:
        description: "Exact isolated asset-recovery static preview URL; not an authenticated backend smoke"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "examination-room-production-cutover"
  cancel-in-progress: false

jobs:
  deploy_pages:
    name: Verify and deploy the isolated Pages artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact reviewed frontend release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authorize the isolated production release
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRM_PRODUCTION" = "true"
          test -n "${APPROVAL_REFERENCE//[[:space:]]/}"
          [[ "$EXPECTED_BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          git cat-file -e "$EXPECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_SOURCE_SHA"

          allowed='^(\.github/workflows/deploy-pages-only\.yml|assets/feature-loader\.js|assets/icons/(community/image|navigation/(circle-check|cloud-upload|hand|mic|monitor-up|pin|settings|shield-check))\.svg|assets/lex-forum\.css|assets/lex-forum\.js|assets/payments/(bpi-instapay-199-qr\.png|bpi-mark\.png)|assets/pedro-navigation\.js|assets/phase2-experience\.js|assets/phase4-experience\.js|assets/phase2\.css|assets/pricing-checkout-safety\.js|assets/pricing-renderer\.(css|js)|assets/private-beta-landing\.js|assets/study-room-backgrounds\.js|assets/study-room-live\.(css|js)|assets/study-room-preview\.(css|js)|assets/study-room/(dimasalang-library|participant-2-tropical|participant-3-bedroom|participant-4-condo|virtual-background-due-diligence-branded|virtual-background-due-diligence-polished-20260908)\.webp|assets/subscription-cta\.css|assets/subscription-cta\.js|assets/vendor/mediapipe/(LICENSE|PROVENANCE)\.txt|assets/vendor/mediapipe/selfie_segmenter-float16-2023-05-07\.tflite|design-qa\.md|index\.html|scripts/build-pages-artifact\.mjs|scripts/test-approved-renovation-shell\.mjs|scripts/test-auth-session-persistence\.mjs|scripts/test-bar-forecast-frontend\.mjs|scripts/test-design-correction-release\.mjs|scripts/test-home-post-collapse\.mjs|scripts/test-lex-forum\.mjs|scripts/test-login-loop-p0\.mjs|scripts/test-mobile-responsive-hotfix\.mjs|scripts/test-pages-artifact\.mjs|scripts/test-pedro-navigation\.mjs|scripts/test-pedro-release2-integration\.mjs|scripts/test-phase4-release1\.mjs|scripts/test-pricing-checkout-safety\.mjs|scripts/test-public-home-responsive-css\.mjs|scripts/test-public-release1-reliability\.mjs|scripts/test-quorum\.mjs|scripts/test-september-pricing-(sql|ui)-contract\.mjs|scripts/test-study-room-(always-open|background-picker|backgrounds|catalog-sql|hotfix-behavior|live|preview)\.mjs|scripts/test-syllabus-review-reveal-contract\.mjs|service-worker\.js|study-room/index\.html)$'
          recovery_allowed='^(\.gitattributes|admin/index\.html|admin-pulse/index\.html|examination-room/index\.html|assets/vendor/(supabase-2\.49\.8\.(umd\.js|LICENSE\.txt|PROVENANCE\.txt)|591\.supabase\.js)|scripts/test-(phase2-contract|unlimited-feature-access|forecast-poll-rate-contract)\.mjs)$'
          unexpected="$(git diff --name-only "$EXPECTED_BASE_SHA..$EXPECTED_SOURCE_SHA" | grep -Ev "$allowed|$recovery_allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "The frontend-only release contains files outside the approved isolation boundary:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify P0 authentication and unchanged frontend contracts
        run: |
          node --check assets/subscription-cta.js
          node --check assets/pricing-checkout-safety.js
          node --check assets/pricing-renderer.js
          node --check assets/study-room-backgrounds.js
          node --check assets/study-room-live.js
          node --check assets/study-room-preview.js
          node --check assets/phase2-experience.js
          node --check assets/feature-loader.js
          node --check assets/phase4-experience.js
          node --check assets/private-beta-landing.js
          node scripts/test-auth-session-persistence.mjs
          node scripts/test-phase2-contract.mjs
          node scripts/test-phase4-release1.mjs
          node scripts/test-bar-forecast-frontend.mjs
          node scripts/test-study-room-backgrounds.mjs
          node scripts/test-study-room-always-open.mjs
          node scripts/test-study-room-background-picker.mjs
          node scripts/test-study-room-live.mjs
          node scripts/test-study-room-hotfix-behavior.mjs
          node scripts/test-study-room-preview.mjs
          node scripts/test-study-room-catalog-sql.mjs
          node --test worker/study-room-catalog.test.mjs
          node scripts/test-syllabus-review-reveal-contract.mjs
          node scripts/test-quorum.mjs
          node scripts/test-public-home-responsive-css.mjs
          node scripts/test-lex-forum.mjs
          node scripts/test-public-release1-reliability.mjs
          node scripts/test-pedro-navigation.mjs
          node scripts/test-pricing-checkout-safety.mjs
          node scripts/test-september-pricing-ui-contract.mjs
          node scripts/test-september-pricing-sql-contract.mjs

      - name: Build and verify the sanitized Pages artifact
        run: node scripts/test-pages-artifact.mjs

      - name: Require exact main, mandatory validation, live baseline, and static preview
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          STAGING_PREVIEW_URL: ${{ inputs.staging_preview_url }}
        run: |
          node --input-type=module <<'NODE'
          // BEGIN asset-recovery-source-gate
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const env = process.env;
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const api = (route) => JSON.parse(execFileSync('gh', ['api', `repos/${env.GITHUB_REPOSITORY}/${route}`], { encoding: 'utf8' }));
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.equal(env.GITHUB_REPOSITORY, 'codingwally/Bar-Exam-simulator');
          assert.equal(env.GITHUB_REF, 'refs/heads/main');
          assert.notEqual(env.GITHUB_ACTOR, 'dependabot[bot]');
          assert.match(env.EXPECTED_BASE_SHA, /^[a-f0-9]{40}$/u);
          assert.match(env.EXPECTED_SOURCE_SHA, /^[a-f0-9]{40}$/u);
          assert.match(env.VALIDATION_RUN_ID, /^[1-9][0-9]{0,19}$/u);
          assert.equal(env.EXPECTED_SOURCE_SHA, env.GITHUB_SHA);
          assert.equal(git('rev-parse', 'HEAD'), env.GITHUB_SHA);
          assert.equal(api('git/ref/heads/main').object.sha, env.GITHUB_SHA);
          const run = api(`actions/runs/${env.VALIDATION_RUN_ID}`);
          assert.equal(run.event, 'pull_request');
          assert.equal(run.path, '.github/workflows/validate-mandatory-early-access.yml');
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.match(run.head_sha, /^[a-f0-9]{40}$/u);
          let number = run.pull_requests?.[0]?.number;
          if (!number) {
            const candidates = api(`commits/${run.head_sha}/pulls`).filter(pr => pr.base.ref === 'main'
              && pr.head.sha === run.head_sha && pr.head.repo.full_name === env.GITHUB_REPOSITORY);
            assert.equal(candidates.length, 1); number = candidates[0].number;
          }
          assert.ok(Number.isSafeInteger(number) && number > 0);
          const pr = api(`pulls/${number}`);
          assert.equal(pr.base.ref, 'main');
          assert.equal(pr.base.repo.full_name, env.GITHUB_REPOSITORY);
          assert.equal(pr.head.repo.full_name, env.GITHUB_REPOSITORY);
          assert.equal(pr.head.sha, run.head_sha);
          assert.equal(pr.merged, true);
          git('fetch', '--no-tags', 'origin', `pull/${number}/head:refs/remotes/origin/asset-recovery-validation-head`);
          assert.equal(git('rev-parse', 'refs/remotes/origin/asset-recovery-validation-head'), run.head_sha);
          assert.equal(git('rev-parse', `${run.head_sha}^{tree}`), git('rev-parse', `${env.GITHUB_SHA}^{tree}`));
          git('diff', '--quiet', run.head_sha, env.GITHUB_SHA, '--', '.');
          assert.equal(env.STAGING_PREVIEW_URL, 'https://duediligence-asset-recovery-preview.wallyesteban1993.workers.dev');
          // Public GETs deliberately carry no GitHub/environment credentials.
          const publicBytes = async (origin, file) => {
            const publicPath = file.replace(/index\.html$/u, '');
            const response = await fetch(`${origin}/${publicPath}?release=${env.GITHUB_SHA}`, {
              redirect: 'error', cache: 'no-store', signal: AbortSignal.timeout(20_000),
            });
            assert.equal(response.status, 200, `Public asset unavailable: ${file}`);
            return Buffer.from(await response.arrayBuffer());
          };
          const marker = '.well-known/duediligence-release.txt';
          assert.equal((await publicBytes('https://duediligence.ph', marker)).toString().trim(), env.EXPECTED_BASE_SHA);
          assert.equal((await publicBytes(env.STAGING_PREVIEW_URL, marker)).toString().trim(), env.GITHUB_SHA);
          const criticalAssets = [
            'index.html', 'admin/index.html', 'admin-pulse/index.html',
            'study-room/index.html', 'examination-room/index.html',
            'assets/phase2-experience.js', 'assets/feature-loader.js', 'service-worker.js',
            'assets/vendor/supabase-2.49.8.umd.js', 'assets/vendor/591.supabase.js',
            'assets/examinations.css',
          ];
          await Promise.all(criticalAssets.map(async file => {
            const expected = sha256(execFileSync('git', ['show', `${env.GITHUB_SHA}:${file}`]));
            assert.equal(sha256(readFileSync(`.pages-dist/${file}`)), expected, `Built asset differs: ${file}`);
            assert.equal(sha256(await publicBytes(env.STAGING_PREVIEW_URL, file)), expected, `Static preview differs: ${file}`);
          }));
          console.log(`Exact merged validation, live baseline and static preview verified (${criticalAssets.length} assets). Authenticated backend behavior is not asserted.`);
          // END asset-recovery-source-gate
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload the reviewed artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the exact frontend release is live
        env:
          SITE_URL: https://duediligence.ph
        shell: bash
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 36); do
            index="$(curl -fsS "$SITE_URL/?release=$GITHUB_SHA" || true)"
            cta_js="$(curl -fsS "$SITE_URL/assets/subscription-cta.js?release=$GITHUB_SHA" || true)"
            cta_css="$(curl -fsS "$SITE_URL/assets/subscription-cta.css?release=$GITHUB_SHA" || true)"
            loader="$(curl -fsS "$SITE_URL/assets/feature-loader.js?release=$GITHUB_SHA" || true)"
            forum_js="$(curl -fsS "$SITE_URL/assets/lex-forum.js?release=$GITHUB_SHA" || true)"
            forum_css="$(curl -fsS "$SITE_URL/assets/lex-forum.css?release=$GITHUB_SHA" || true)"
            navigation_js="$(curl -fsS "$SITE_URL/assets/private-beta-landing.js?release=$GITHUB_SHA" || true)"
            pedro_js="$(curl -fsS "$SITE_URL/assets/pedro-navigation.js?release=$GITHUB_SHA" || true)"
            pricing_js="$(curl -fsS "$SITE_URL/assets/phase2-experience.js?release=$GITHUB_SHA" || true)"
            access_js="$(curl -fsS "$SITE_URL/assets/phase4-experience.js?release=$GITHUB_SHA" || true)"
            study_room_js="$(curl -fsS "$SITE_URL/assets/study-room-preview.js?release=$GITHUB_SHA" || true)"
            study_room_css="$(curl -fsS "$SITE_URL/assets/study-room-preview.css?release=$GITHUB_SHA" || true)"
            study_room_page="$(curl -fsS "$SITE_URL/study-room/?release=$GITHUB_SHA" || true)"
            study_room_live="$(curl -fsS "$SITE_URL/assets/study-room-live.js?release=$GITHUB_SHA" || true)"
            study_room_backgrounds="$(curl -fsS "$SITE_URL/assets/study-room-backgrounds.js?release=$GITHUB_SHA" || true)"
            study_room_processors="$(curl -fsS "$SITE_URL/assets/vendor/livekit-track-processors.iife.js?release=$GITHUB_SHA" || true)"
            study_room_images=true
            for image in dimasalang-library participant-2-tropical participant-3-bedroom participant-4-condo; do
              if ! curl -fsS -o /dev/null "$SITE_URL/assets/study-room/$image.webp?release=$GITHUB_SHA"; then
                study_room_images=false
              fi
            done
            study_room_runtime=true
            for asset in \
              assets/icons/community/image.svg \
              assets/icons/navigation/hand.svg \
              assets/icons/navigation/mic.svg \
              assets/icons/navigation/monitor-up.svg \
              assets/icons/navigation/pin.svg \
              assets/icons/navigation/settings.svg \
              assets/study-room/virtual-background-due-diligence-branded.webp \
              assets/study-room/virtual-background-due-diligence-polished-20260908.webp \
              assets/vendor/mediapipe/selfie_segmenter-float16-2023-05-07.tflite \
              assets/vendor/mediapipe/wasm/vision_wasm_internal.js \
              assets/vendor/mediapipe/wasm/vision_wasm_internal.wasm \
              assets/vendor/mediapipe/wasm/vision_wasm_nosimd_internal.js \
              assets/vendor/mediapipe/wasm/vision_wasm_nosimd_internal.wasm; do
              if ! curl -fsSI -o /dev/null "$SITE_URL/$asset?release=$GITHUB_SHA"; then
                study_room_runtime=false
              fi
            done
            if grep -q 'home-subscription-cta-20260828-3' <<<"$index" \
              && grep -q 'private-beta-landing.js?v=public-reliability-20260827-2&amp;feedback=quiet-navigation-20260828-1' <<<"$index" \
              && grep -q 'auth=login-loop-p0-20260901-1' <<<"$index" \
              && grep -q 'pedro-navigation.js?v=pedro-release2-20260827-1&amp;feedback=quiet-navigation-20260828-1' <<<"$index" \
              && grep -q 'home-subscription-20260828-2' <<<"$loader" \
              && grep -q 'collapse=home-read-more-20260828-1' <<<"$loader" \
              && grep -q 'refreshWhenAuthReady' <<<"$cta_js" \
              && grep -q 'duediligence:subscription-cta' <<<"$cta_js" \
              && grep -q 'dd2-subscription-invitation' <<<"$cta_css" \
              && grep -q 'function renderPostBody(item)' <<<"$forum_js" \
              && grep -q 'lex-post-read-more' <<<"$forum_css" \
              && grep -q "classList.toggle('dd2-sr-only'" <<<"$navigation_js" \
              && grep -q 'handleLandingSessionChange' <<<"$navigation_js" \
              && grep -q "announcementOnly = kind === 'loading'" <<<"$pedro_js" \
              && grep -q 'routineSessionRefreshReasons' <<<"$pricing_js" \
              && grep -q 'session && sessionChanged' <<<"$pricing_js" \
              && grep -q 'ACCESS_AUTH_RETRY_COOLDOWN_MS' <<<"$access_js" \
              && grep -q 'handlePhase4SessionChange' <<<"$access_js" \
              && grep -q 'id="dd2-pricing-retry"' <<<"$pricing_js" \
              && grep -q 'Plans &amp; Pricing could not load just now\.' <<<"$pricing_js" \
              && grep -q 'pricing-checkout-safety.js?v=regular-checkout-r2' <<<"$index" \
              && grep -q 'phase2-experience.js[^" ]*pricing=regular-checkout-r3' <<<"$index" \
              && grep -q 'id="dd-study-room-trigger"' <<<"$index" \
              && grep -q 'id="dd-study-room-dialog"' <<<"$index" \
              && grep -q 'You won&rsquo;t have to study alone\.' <<<"$index" \
              && grep -q 'studyRoomPreviewModule' <<<"$study_room_js" \
              && grep -q 'openMarketingPreview' <<<"$study_room_js" \
              && grep -q '\.dd-study-room-overlay' <<<"$study_room_css" \
              && grep -q 'dd-study-room-radiance' <<<"$study_room_css" \
              && grep -q 'study-room-always-open-20260908-1' <<<"$study_room_page" \
              && grep -q 'study-room-background-images-20260908-1' <<<"$study_room_page" \
              && grep -Fq 'layout=stable-pins-20260908-1' <<<"$study_room_page" \
              && grep -Fq 'catalog=admin-room-manager-20260908-1' <<<"$study_room_page" \
              && grep -Fq 'study-room-live.css?v=study-room-admin-manager-20260908-1' <<<"$study_room_page" \
              && grep -Fq 'data-max-rooms="24"' <<<"$study_room_page" \
              && grep -Fq 'id="sr-room-editor"' <<<"$study_room_page" \
              && grep -Fq 'Inner Chamber always remains admin-only.' <<<"$study_room_page" \
              && grep -Fq 'const MAX_ROOMS = 24;' <<<"$study_room_live" \
              && grep -Fq "name: 'Room 4'" <<<"$study_room_live" \
              && grep -Fq "const audience = roomKey === '5' ? 'admin' : candidate?.audience;" <<<"$study_room_live" \
              && grep -Fq "workerRequest('/admin/study-room/rooms'" <<<"$study_room_live" \
              && grep -Fq 'expectedRevision: editor.revision' <<<"$study_room_live" \
              && grep -q "workerRequest('/study-room/rooms'" <<<"$study_room_live" \
              && grep -q "workerRequest('/study-room/join'" <<<"$study_room_live" \
              && grep -q 'registerTextStreamHandler' <<<"$study_room_live" \
              && grep -q 'setScreenShareEnabled' <<<"$study_room_live" \
              && grep -q 'DueDiligenceStudyRoomMandatoryBackground' <<<"$study_room_backgrounds" \
              && grep -q 'virtual-background-due-diligence-polished-20260908.webp' <<<"$study_room_backgrounds" \
              && grep -q 'due-diligence-mandatory-virtual-background-no-raw-first-frame' <<<"$study_room_processors" \
              && test "$study_room_images" = "true" \
              && test "$study_room_runtime" = "true"; then
              verified=true
              break
            fi
            sleep 5
          done
          test "$verified" = "true"

      - name: Verify exact critical recovery assets on the canonical origin
        run: |
          node --input-type=module <<'NODE'
          // BEGIN asset-recovery-live-gate
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { setTimeout as pause } from 'node:timers/promises';
          const sha = process.env.GITHUB_SHA;
          assert.match(sha, /^[a-f0-9]{40}$/u);
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const criticalAssets = [
            'index.html', 'admin/index.html', 'admin-pulse/index.html',
            'study-room/index.html', 'examination-room/index.html',
            'assets/phase2-experience.js', 'assets/feature-loader.js', 'service-worker.js',
            'assets/vendor/supabase-2.49.8.umd.js', 'assets/vendor/591.supabase.js',
            'assets/examinations.css',
          ];
          const expectedHashes = new Map(criticalAssets.map(file => [file,
            sha256(execFileSync('git', ['show', `${sha}:${file}`]))]));
          const publicBytes = async file => {
            const publicPath = file.replace(/index\.html$/u, '');
            const response = await fetch(`https://duediligence.ph/${publicPath}?release=${sha}`, {
              redirect: 'error', cache: 'no-store', signal: AbortSignal.timeout(20_000),
            });
            assert.equal(response.status, 200, `Public asset unavailable: ${file}`);
            return Buffer.from(await response.arrayBuffer());
          };
          let verified = false;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            try {
              assert.equal((await publicBytes('.well-known/duediligence-release.txt')).toString().trim(), sha);
              await Promise.all(criticalAssets.map(async file => {
                assert.equal(sha256(await publicBytes(file)), expectedHashes.get(file), `Live asset differs: ${file}`);
              }));
              verified = true;
              break;
            } catch (error) {
              if (attempt === 11) throw error;
              await pause(5_000);
            }
          }
          assert.equal(verified, true);
          console.log(`Canonical release marker and ${criticalAssets.length} critical assets match exact Git blobs. No authenticated backend smoke was performed.`);
          // END asset-recovery-live-gate
          NODE
