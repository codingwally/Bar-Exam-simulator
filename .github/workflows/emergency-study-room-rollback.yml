name: Emergency Study Room outbound camera sanitizer release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/emergency-study-room-rollback.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  KNOWN_GOOD_SHA: 895380afa2b6dbb8892e29a8c250d1923235fd00
  KNOWN_GOOD_STUDY_LIVE_BLOB: 0822278a88cfb264fa3a5332adae25bd66473bf4
  GREEN_FRAME_MARKER: chrome152-outbound-sanitizer-20260911-5

jobs:
  restore:
    name: Deploy sender-side Study Room camera sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove this push changed only the emergency release workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "codingwally/Bar-Exam-simulator"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/emergency-study-room-rollback.yml"

      - name: Checkout exact pre-issue production source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KNOWN_GOOD_SHA }}
          path: release-src
          fetch-depth: 1

      - name: Verify exact pre-issue Study Room source
        working-directory: release-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$KNOWN_GOOD_SHA"
          test "$(git rev-parse HEAD:assets/study-room-live.js)" = "$KNOWN_GOOD_STUDY_LIVE_BLOB"
          grep -Fq 'Background off is genuinely processor-free.' assets/study-room-live.js
          grep -Fq 'Talking is a visual indicator, never a layout, tile-order, or media event.' assets/study-room-live.js
          grep -Fq 'simulcast: true' assets/study-room-live.js
          grep -Fq 'dynacast: true' assets/study-room-live.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        working-directory: release-src
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify unchanged source contracts and build artifact
        working-directory: release-src
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/study-room-live.js
          node --check assets/study-room-backgrounds.js
          node --check assets/study-room-preview.js
          node scripts/test-study-room-live.mjs
          node scripts/test-study-room-backgrounds.mjs
          node scripts/test-study-room-always-open.mjs
          node scripts/test-study-room-background-picker.mjs
          node scripts/test-study-room-hotfix-behavior.mjs
          node scripts/test-study-room-preview.mjs
          node scripts/test-pages-artifact.mjs

      - name: Apply sender-side green-frame sanitizer to Pages artifact only
        working-directory: release-src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          marker = 'chrome152-outbound-sanitizer-20260911-5'
          dist = Path('.pages-dist')
          css_path = dist / 'assets/study-room-live.css'
          html_path = dist / 'study-room/index.html'
          guard_path = dist / 'assets/study-room-green-frame-guard.js'

          css = css_path.read_text()
          css += f'''\n\n/* {marker}: local raw camera is never painted directly on affected Chromium clients. */\n.sr-preview-frame video,\n.sr-participant-tile.is-self > video,\n.sr-participant-tile.is-self.is-camera > video {{\n  opacity: 0 !important;\n  transform: none !important;\n  filter: none !important;\n  will-change: auto !important;\n  pointer-events: none !important;\n}}\n.sr-greenframe-safe-canvas {{\n  position: absolute !important;\n  inset: 0 !important;\n  z-index: 4 !important;\n  display: block !important;\n  width: 100% !important;\n  height: 100% !important;\n  pointer-events: none !important;\n  background: #071b30 !important;\n}}\n'''
          css_path.write_text(css)

          guard = r'''(function studyRoomGreenFrameGuard(global) {
            'use strict';
            const MARKER = 'chrome152-outbound-sanitizer-20260911-5';
            const ua = String(global.navigator?.userAgent || '');
            const chromeMatch = ua.match(/Chrome\/(\d+)/u);
            const chromeMajor = Number(chromeMatch?.[1] || 0);
            const IS_AFFECTED_CHROMIUM = /Windows NT/u.test(ua)
              && chromeMajor >= 152
              && !/(?:Edg|OPR)\//u.test(ua);

            const nativeReplaceTrack = global.RTCRtpSender?.prototype?.replaceTrack;
            const nativeAddTrack = global.RTCPeerConnection?.prototype?.addTrack;
            const nativeAddTransceiver = global.RTCPeerConnection?.prototype?.addTransceiver;
            const senderPipelines = new WeakMap();
            const safeTracks = new WeakSet();
            const localVisuals = new WeakMap();

            function trackLooksLikeScreenShare(track) {
              if (!track || track.kind !== 'video') return false;
              const settings = track.getSettings?.() || {};
              if (settings.displaySurface) return true;
              return /(?:screen|window|display|monitor|tab|share)/iu.test(String(track.label || ''));
            }

            function shouldSanitizeOutbound(track) {
              return IS_AFFECTED_CHROMIUM
                && track?.kind === 'video'
                && !safeTracks.has(track)
                && !trackLooksLikeScreenShare(track);
            }

            function greenFrameDetector() {
              const sample = document.createElement('canvas');
              sample.width = 12;
              sample.height = 7;
              const ctx = sample.getContext('2d', { willReadFrequently: true });
              return function isBad(source) {
                if (!ctx) return false;
                try {
                  ctx.drawImage(source, 0, 0, sample.width, sample.height);
                  const data = ctx.getImageData(0, 0, sample.width, sample.height).data;
                  let visible = 0, strong = 0, vivid = 0;
                  let sumR = 0, sumG = 0, sumB = 0;
                  for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                    if (a < 24) continue;
                    visible += 1;
                    sumR += r; sumG += g; sumB += b;
                    if (g > 105 && g - r > 52 && g - b > 52) strong += 1;
                    if (g > 135 && g - r > 78 && g - b > 72) vivid += 1;
                  }
                  if (!visible) return true;
                  const strongRatio = strong / visible;
                  const vividRatio = vivid / visible;
                  const meanR = sumR / visible, meanG = sumG / visible, meanB = sumB / visible;
                  const lead = meanG - Math.max(meanR, meanB);
                  return vividRatio > 0.42 || (strongRatio > 0.58 && lead > 44) || (meanG > 150 && lead > 76);
                } catch {
                  return false;
                }
              };
            }

            function fitSize(width, height, maxWidth = 640, maxHeight = 360) {
              const sourceWidth = Math.max(2, Number(width) || maxWidth);
              const sourceHeight = Math.max(2, Number(height) || maxHeight);
              const scale = Math.min(1, maxWidth / sourceWidth, maxHeight / sourceHeight);
              return {
                width: Math.max(2, Math.round(sourceWidth * scale)),
                height: Math.max(2, Math.round(sourceHeight * scale)),
              };
            }

            function createProcessorPipeline(sourceTrack) {
              if (!global.MediaStreamTrackProcessor || !global.MediaStreamTrackGenerator || !global.VideoFrame) return null;
              const settings = sourceTrack.getSettings?.() || {};
              const fitted = fitSize(settings.width, settings.height);
              const canvas = typeof global.OffscreenCanvas === 'function'
                ? new global.OffscreenCanvas(fitted.width, fitted.height)
                : Object.assign(document.createElement('canvas'), fitted);
              const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true, willReadFrequently: false });
              if (!ctx) return null;
              const isBad = greenFrameDetector();
              const processor = new global.MediaStreamTrackProcessor({ track: sourceTrack });
              const generator = new global.MediaStreamTrackGenerator({ kind: 'video' });
              safeTracks.add(generator);
              try { generator.contentHint = 'motion'; } catch {}
              const reader = processor.readable.getReader();
              const writer = generator.writable.getWriter();
              let stopped = false;
              let opened = false;
              let cleanStreak = 0;

              (async () => {
                try {
                  while (!stopped) {
                    const { value: frame, done } = await reader.read();
                    if (done || !frame) break;
                    try {
                      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                      if (isBad(canvas)) {
                        cleanStreak = 0;
                        continue;
                      }
                      cleanStreak += 1;
                      if (!opened && cleanStreak < 2) continue;
                      opened = true;
                      const outgoing = new global.VideoFrame(canvas, {
                        timestamp: Number.isFinite(frame.timestamp) ? frame.timestamp : undefined,
                        duration: Number.isFinite(frame.duration) ? frame.duration : undefined,
                        alpha: 'discard',
                      });
                      try {
                        await writer.write(outgoing);
                      } finally {
                        outgoing.close();
                      }
                    } finally {
                      frame.close();
                    }
                  }
                } catch (error) {
                  console.warn('[Study Room] outbound camera sanitizer stopped:', error?.message || error);
                }
              })();

              return {
                sourceTrack,
                track: generator,
                stop() {
                  if (stopped) return;
                  stopped = true;
                  try { reader.cancel(); } catch {}
                  try { writer.close(); } catch {}
                  try { generator.stop(); } catch {}
                },
              };
            }

            function createCanvasPipeline(sourceTrack) {
              const settings = sourceTrack.getSettings?.() || {};
              const fitted = fitSize(settings.width, settings.height);
              const video = document.createElement('video');
              video.autoplay = true;
              video.muted = true;
              video.playsInline = true;
              video.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;opacity:0;pointer-events:none';
              video.srcObject = new MediaStream([sourceTrack]);
              document.body.appendChild(video);
              video.play().catch(() => {});
              const canvas = document.createElement('canvas');
              canvas.width = fitted.width;
              canvas.height = fitted.height;
              const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
              if (!ctx || typeof canvas.captureStream !== 'function') {
                video.remove();
                return null;
              }
              const stream = canvas.captureStream(0);
              const output = stream.getVideoTracks()[0];
              if (!output) {
                video.remove();
                return null;
              }
              safeTracks.add(output);
              try { output.contentHint = 'motion'; } catch {}
              const isBad = greenFrameDetector();
              let stopped = false;
              let opened = false;
              let cleanStreak = 0;

              function schedule() {
                if (stopped) return;
                if (typeof video.requestVideoFrameCallback === 'function') video.requestVideoFrameCallback(frame);
                else global.setTimeout(frame, 66);
              }
              function frame() {
                if (stopped) return;
                if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
                  if (isBad(video)) {
                    cleanStreak = 0;
                  } else {
                    cleanStreak += 1;
                    if (opened || cleanStreak >= 2) {
                      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                      output.requestFrame?.();
                      opened = true;
                    }
                  }
                }
                schedule();
              }
              schedule();
              return {
                sourceTrack,
                track: output,
                stop() {
                  if (stopped) return;
                  stopped = true;
                  try { output.stop(); } catch {}
                  video.srcObject = null;
                  video.remove();
                },
              };
            }

            function createOutboundPipeline(sourceTrack) {
              return createProcessorPipeline(sourceTrack) || createCanvasPipeline(sourceTrack);
            }

            function cleanSender(sender) {
              const existing = senderPipelines.get(sender);
              if (!existing) return;
              senderPipelines.delete(sender);
              existing.stop();
            }

            function sanitizedTrackForSender(sender, sourceTrack) {
              if (!shouldSanitizeOutbound(sourceTrack)) {
                cleanSender(sender);
                return sourceTrack;
              }
              const existing = senderPipelines.get(sender);
              if (existing?.sourceTrack === sourceTrack && existing.track?.readyState !== 'ended') return existing.track;
              cleanSender(sender);
              const pipeline = createOutboundPipeline(sourceTrack);
              if (!pipeline) return sourceTrack;
              senderPipelines.set(sender, pipeline);
              console.info('[Study Room] sender-side camera sanitizer active:', MARKER);
              return pipeline.track;
            }

            if (IS_AFFECTED_CHROMIUM && typeof nativeReplaceTrack === 'function') {
              global.RTCRtpSender.prototype.replaceTrack = function guardedReplaceTrack(track) {
                const safe = track ? sanitizedTrackForSender(this, track) : track;
                if (!track) cleanSender(this);
                return nativeReplaceTrack.call(this, safe);
              };
            }

            if (IS_AFFECTED_CHROMIUM && typeof nativeAddTrack === 'function') {
              global.RTCPeerConnection.prototype.addTrack = function guardedAddTrack(track, ...streams) {
                if (!shouldSanitizeOutbound(track)) return nativeAddTrack.call(this, track, ...streams);
                const pipeline = createOutboundPipeline(track);
                if (!pipeline) return nativeAddTrack.call(this, track, ...streams);
                const sender = nativeAddTrack.call(this, pipeline.track, ...streams);
                senderPipelines.set(sender, pipeline);
                console.info('[Study Room] sender-side camera sanitizer active:', MARKER);
                return sender;
              };
            }

            if (IS_AFFECTED_CHROMIUM && typeof nativeAddTransceiver === 'function') {
              global.RTCPeerConnection.prototype.addTransceiver = function guardedAddTransceiver(trackOrKind, init) {
                if (!shouldSanitizeOutbound(trackOrKind)) return nativeAddTransceiver.call(this, trackOrKind, init);
                const pipeline = createOutboundPipeline(trackOrKind);
                if (!pipeline) return nativeAddTransceiver.call(this, trackOrKind, init);
                const transceiver = nativeAddTransceiver.call(this, pipeline.track, init);
                senderPipelines.set(transceiver.sender, pipeline);
                console.info('[Study Room] sender-side camera sanitizer active:', MARKER);
                return transceiver;
              };
            }

            function installLocalVisual(video, mirror) {
              if (!IS_AFFECTED_CHROMIUM || !video || localVisuals.has(video)) return;
              const parent = video.parentElement;
              if (!parent) return;
              const canvas = document.createElement('canvas');
              canvas.className = 'sr-greenframe-safe-canvas';
              canvas.dataset.greenframeGuard = MARKER;
              canvas.setAttribute('aria-hidden', 'true');
              const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
              if (!ctx) return;
              parent.appendChild(canvas);
              const isBad = greenFrameDetector();
              let stopped = false;
              let opened = false;
              let cleanStreak = 0;

              function drawCover() {
                const rect = parent.getBoundingClientRect();
                const fitted = fitSize(rect.width || 480, rect.height || 270, 480, 270);
                if (canvas.width !== fitted.width || canvas.height !== fitted.height) {
                  canvas.width = fitted.width;
                  canvas.height = fitted.height;
                }
                const vw = video.videoWidth || canvas.width;
                const vh = video.videoHeight || canvas.height;
                const srcRatio = vw / vh;
                const dstRatio = canvas.width / canvas.height;
                let sx = 0, sy = 0, sw = vw, sh = vh;
                if (srcRatio > dstRatio) { sw = vh * dstRatio; sx = (vw - sw) / 2; }
                else if (srcRatio < dstRatio) { sh = vw / dstRatio; sy = (vh - sh) / 2; }
                ctx.save();
                if (mirror) { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
                ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
                ctx.restore();
              }

              function schedule() {
                if (stopped) return;
                if (typeof video.requestVideoFrameCallback === 'function') video.requestVideoFrameCallback(frame);
                else global.setTimeout(frame, 66);
              }
              function frame() {
                if (stopped || !video.isConnected || !canvas.isConnected) return;
                if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
                  if (isBad(video)) {
                    cleanStreak = 0;
                  } else {
                    cleanStreak += 1;
                    if (opened || cleanStreak >= 2) {
                      drawCover();
                      opened = true;
                    }
                  }
                }
                schedule();
              }
              localVisuals.set(video, { stop() { stopped = true; canvas.remove(); } });
              schedule();
            }

            function scanLocalVisuals() {
              if (!IS_AFFECTED_CHROMIUM) return;
              const selfTile = document.querySelector('.sr-participant-tile.is-self.is-camera video, .sr-participant-tile.is-self video');
              if (selfTile) installLocalVisual(selfTile, true);
              const preview = document.getElementById('sr-local-preview');
              const dialog = document.getElementById('sr-entry-dialog');
              if (!selfTile && preview && dialog?.open) installLocalVisual(preview, true);
            }

            const observer = new MutationObserver(scanLocalVisuals);
            observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['class', 'open'] });
            document.addEventListener('play', scanLocalVisuals, true);
            global.addEventListener('pagehide', () => observer.disconnect(), { once: true });
            scanLocalVisuals();
            console.info('[Study Room] camera compatibility layer:', MARKER, IS_AFFECTED_CHROMIUM ? 'enabled' : 'not required');
          })(window);'''
          guard_path.write_text(guard)

          html = html_path.read_text()
          html = html.replace(
              '../assets/study-room-live.css?v=study-room-admin-manager-20260908-1&amp;share=screen-recovery-20260909-1&amp;entry=v3-20260909-1',
              f'../assets/study-room-live.css?v=study-room-admin-manager-20260908-1&amp;share=screen-recovery-20260909-1&amp;entry=v3-20260909-1&amp;greenframe={marker}',
          )
          guard_tag = f'  <script src="../assets/study-room-green-frame-guard.js?v={marker}"></script>\n'
          live_tag = '  <script src="../assets/study-room-live.js?v=study-room-always-open-20260908-1&amp;layout=stable-pins-20260908-1&amp;catalog=admin-room-manager-20260908-1&amp;join=free-join-20260909-1&amp;share=screen-recovery-20260909-1&amp;entry=v3-20260909-1&amp;responsiveness=catalog-read-20260910-1"></script>\n'
          if live_tag not in html:
              raise SystemExit('Expected Study Room live script tag not found')
          html = html.replace(live_tag, guard_tag + live_tag.replace('responsiveness=catalog-read-20260910-1', f'responsiveness=catalog-read-20260910-1&amp;greenframe={marker}'))
          if marker not in html or 'study-room-green-frame-guard.js' not in html:
              raise SystemExit('Failed to install sender-side camera sanitizer')
          html_path.write_text(html)
          PY

          node --check .pages-dist/assets/study-room-live.js
          node --check .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq "$GREEN_FRAME_MARKER" .pages-dist/assets/study-room-live.css
          grep -Fq "$GREEN_FRAME_MARKER" .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq 'sender-side camera sanitizer active' .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq 'MediaStreamTrackProcessor' .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq 'guardedReplaceTrack' .pages-dist/assets/study-room-green-frame-guard.js
          grep -Fq 'study-room-green-frame-guard.js' .pages-dist/study-room/index.html
          grep -Fq 'simulcast: true' .pages-dist/assets/study-room-live.js
          grep -Fq 'dynacast: true' .pages-dist/assets/study-room-live.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload patched Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release-src/.pages-dist

      - name: Deploy patched Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify sender-side sanitizer is live
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            html_ok=0
            guard_ok=0
            live_ok=0
            if curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' \
              "https://duediligence.ph/study-room/?greenframe=$GREEN_FRAME_MARKER&attempt=$attempt" \
              --output /tmp/study-room.html; then
              grep -Fq "$GREEN_FRAME_MARKER" /tmp/study-room.html \
                && grep -Fq 'study-room-green-frame-guard.js' /tmp/study-room.html && html_ok=1 || true
            fi
            if curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' \
              "https://duediligence.ph/assets/study-room-green-frame-guard.js?greenframe=$GREEN_FRAME_MARKER&attempt=$attempt" \
              --output /tmp/green-frame-guard.js; then
              grep -Fq "$GREEN_FRAME_MARKER" /tmp/green-frame-guard.js \
                && grep -Fq 'sender-side camera sanitizer active' /tmp/green-frame-guard.js \
                && grep -Fq 'guardedReplaceTrack' /tmp/green-frame-guard.js && guard_ok=1 || true
            fi
            if curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' \
              "https://duediligence.ph/assets/study-room-live.js?greenframe=$GREEN_FRAME_MARKER&attempt=$attempt" \
              --output /tmp/study-room-live.js; then
              grep -Fq 'simulcast: true' /tmp/study-room-live.js \
                && grep -Fq 'dynacast: true' /tmp/study-room-live.js && live_ok=1 || true
            fi
            if [[ "$html_ok" == 1 && "$guard_ok" == 1 && "$live_ok" == 1 ]]; then
              echo "Sender-side Study Room camera sanitizer is live on production Pages."
              exit 0
            fi
            sleep 10
          done
          echo "Pages deployed but sender-side sanitizer verification did not converge." >&2
          exit 1
