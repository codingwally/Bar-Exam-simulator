<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071a31">
  <title>Due Diligence — Offline study</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#10243e;background:#071a31}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 15%,#12395c,#071a31 55%)}
    main{width:min(760px,100%);padding:36px;border:1px solid #c5a059;border-top-width:3px;border-radius:18px;background:#faf9f6;box-shadow:0 24px 80px #0006}
    h1{margin:.15em 0;font:700 clamp(34px,7vw,62px)/1.05 Georgia,serif;color:#08294d}p{line-height:1.65;color:#516078}.eyebrow{color:#8b671a;font:800 11px/1.4 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}
    button,a{display:inline-flex;min-height:44px;align-items:center;padding:10px 16px;border:1px solid #b58c37;border-radius:8px;color:#071a31;background:#e1b94f;font-weight:800;text-decoration:none;cursor:pointer}
    #saved-items{display:grid;gap:10px;margin-top:24px}.item{padding:16px;border:1px solid #d8dee7;border-radius:10px;background:#fff}.item h2{margin:0 0 8px;font:700 20px/1.3 Georgia,serif}.item p{white-space:pre-wrap}.note{padding:10px;border-left:3px solid #c5a059;background:#fffaf0}
  </style>
</head>
<body><main>
  <p class="eyebrow">Warm offline study</p><h1>You’re offline.</h1>
  <p>Reconnect to open Due Diligence normally. Study items that you explicitly saved on this device appear below; protected question banks, Quorum, and Examination Room records are never cached here.</p>
  <button type="button" onclick="location.reload()">Try reconnecting</button>
  <section id="saved-items" aria-live="polite"><p>Checking this device for prepared study items…</p></section>
</main><script>
(() => {
  const root=document.getElementById('saved-items');let owner='';try{owner=sessionStorage.getItem('duediligence.offline.owner-hint.v1')||''}catch{}
  if(!owner){root.innerHTML='<p>No signed-in offline workspace is active on this device.</p>';return}
  const request=indexedDB.open('duediligence-study-v1',1);request.onerror=()=>{root.innerHTML='<p>Saved study items could not be opened.</p>'};
  request.onsuccess=()=>{const db=request.result;const get=db.transaction('items').objectStore('items').getAll();get.onsuccess=()=>{const rows=get.result.filter(x=>x.ownerUserId===owner&&x.savedOffline).sort((a,b)=>b.savedAt-a.savedAt);root.replaceChildren();if(!rows.length){root.innerHTML='<p>No study item has been prepared for offline use yet.</p>';return}rows.forEach(row=>{const article=document.createElement('article');article.className='item';const title=document.createElement('h2');title.textContent=row.title||'Study item';const text=document.createElement('p');text.textContent=row.text||'';article.append(title,text);if(row.noteText){const note=document.createElement('p');note.className='note';note.textContent='Your note: '+row.noteText;article.append(note)}root.append(article)});db.close()}}
})();
</script></body></html>
