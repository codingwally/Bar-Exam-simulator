name: Examination Room midterm protected staging deploy and E2E

on:
  push:
    branches:
      - fix/examination-room-submit-retry-normalization
      - hotfix/examination-room-nov07-user-test
      - hotfix/examination-room-two-input-only-20261106
      - hotfix/examination-room-ph-clock-no-timer-20261106
      - hotfix/examination-monitor-submitted-answers-20261106
    paths:
      - .github/workflows/examination-room-midterm-staging.yml
      - scripts/verify-examination-room-v1-staging.mjs
      - scripts/test-examinations-staging.mjs
      - worker/wrangler.staging.toml
      - worker/examination-room-email.mjs
      - worker/examination-room-email.test.mjs
      - worker/index.mjs
      - worker/examination-room-v1-routes.mjs
      - examination-room/student.js
      - examination-room/professor.js
      - examination-room/professor.client.test.cjs
      - examination-room/api.js
      - examination-room/student.html
      - examination-room/index.html
      - examination-room/offline-shell.test.cjs
      - examination-room/student.client.test.cjs
      - service-worker.js
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examination-room-midterm-staging-deploy
  cancel-in-progress: false

jobs:
  examination-staging:
    name: Deploy reviewed examination to isolated staging and test real browser submission
    if: >-
      github.repository == 'codingwally/Bar-Exam-simulator' &&
      github.ref == 'refs/heads/hotfix/examination-monitor-submitted-answers-20261106'
    runs-on: ubuntu-latest
    environment: staging-e2e
    timeout-minutes: 65
    steps:
      - name: Checkout reviewed release branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check source, migrations and examination regression tests
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'hotfix/examination-monitor-submitted-answers-20261106'
          grep -Fq 'EXAMINATION_ROOM_DURABLE_INTAKE = "true"' worker/wrangler.staging.toml
          grep -Fq 'EXAMINATION_ROOM_EMAIL_MODE = "suppressed"' worker/wrangler.staging.toml
          test -f supabase/migrations/20261105101000_examination_room_durable_submission.sql
          test -f supabase/migrations/20261106011130_examination_room_snapshot_before_reconciliation.sql
          test -f supabase/migrations/20261106203000_examination_room_no_student_timer.sql
          npm ci --prefix worker --ignore-scripts --no-audit --no-fund
          node --test examination-room/*.test.cjs admin/examination-room-admin.test.cjs worker/*.test.mjs
          node scripts/test-examination-room-database.mjs
          node scripts/test-examination-room-release-workflows.mjs
      - name: Resolve existing staging publishable key without exposing credentials
        shell: bash
        env:
          CONFIGURED_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          key="$CONFIGURED_KEY"
          if [[ -z "$key" ]]; then
            key="$(node --input-type=module -e "const r=await fetch('https://duediligence-examinations-staging.wallyesteban1993.workers.dev/assets/phase2-config.js',{headers:{'cache-control':'no-cache'}});if(!r.ok)process.exit(1);const m=(await r.text()).match(/sb_publishable_[A-Za-z0-9_-]{20,}/);if(!m)process.exit(1);process.stdout.write(m[0]);")"
          fi
          [[ "$key" =~ ^sb_publishable_[A-Za-z0-9_-]{20,}$ ]]
          echo "::add-mask::$key"
          printf 'STAGING_SUPABASE_PUBLISHABLE_KEY=%s\n' "$key" >> "$GITHUB_ENV"
      - name: Build isolated staging artifact (never production Pages)
        run: node scripts/test-staging-artifact.mjs
      - name: Deploy Worker and examination assets to isolated staging
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.114.0'
          command: deploy --config wrangler.staging.toml
      - name: Verify actual staging routes
        env:
          STAGING_EXAMINATION_ROOM_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        run: node scripts/test-examination-room-v1-staging-smoke.mjs
      - name: Verify hosted V1 professor-to-student submission and monitoring
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          EXAMINATION_ROOM_V1_ONLY: 'true'
          STAGING_SUPABASE_URL: https://hlzqmreeoghbldnhlybr.supabase.co
          STAGING_EXAMINATION_WORKER_URL: https://duediligence-examinations-staging.wallyesteban1993.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-examinations-staging.mjs
      - name: Publish exact-commit Examination Room V1 test evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/staging-e2e
          # The previous hosted test must have exited successfully; only then
          # is an immutable exact-SHA release evidence artifact generated.
          node --input-type=module -e "import{writeFileSync}from'node:fs';writeFileSync('artifacts/staging-e2e/examination-room-v1.json',JSON.stringify({kind:'midterm-examination-room-v1',status:'PASS',target:'isolated-staging',sha:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,verification:['professor_save','professor_publish','student_key_approved','student_preview','student_begin','no_time_limit_room_bound','student_autosave','official_submission','professor_monitor','professor_submitted_answers','professor_grade_save','synthetic_exam_cleaned']},null,2)+'\\n')"
      - name: Preserve sanitized staging release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examination-room-midterm-staging-${{ github.run_id }}
          path: artifacts/staging-e2e/examination-room-v1.json
          retention-days: 14
          if-no-files-found: warn
