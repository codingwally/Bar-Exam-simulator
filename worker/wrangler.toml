name = "duediligence-gemini-examiner"
main = "index.mjs"
compatibility_date = "2026-07-26"
preview_urls = false

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_GROUNDING_ENABLED = "false"
ALLOWED_ORIGIN = "https://duediligence.ph"
WEBSITE_BANK_URL = "https://duediligence.ph/content/question-bank/website-upload.json"
ALLOW_LEGACY_GUESTS = "false"

[observability]
enabled = true

[observability.logs]
enabled = true

# GEMINI_API_KEY and SUPABASE_SERVICE_ROLE_KEY must remain Cloudflare secrets.
# SUPABASE_URL must be configured as a Worker environment variable.
# Never add secret values to this file.
