name: Examination Room professor PDF downloads release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-professor-pdf-downloads-20260923.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  LIVE_BASE_SHA: aad73bf011435a38a228cefe99c8c19548fb0397
  REVIEW_BASE_SHA: ec6bb6d77b3e15af943097c7eba8c41b0a093e9d
  RELEASE_SOURCE_SHA: af412bd7f11ac060ec32cfdc4abf05d93ea6b6d2
  SITE_URL: https://duediligence.ph

jobs:
  deploy:
    name: Verify and deploy professor PDF downloads
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact reviewed release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove isolated reviewed scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git cat-file -e "$LIVE_BASE_SHA^{commit}"
          git cat-file -e "$REVIEW_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$LIVE_BASE_SHA" "$RELEASE_SOURCE_SHA"
          git merge-base --is-ancestor "$REVIEW_BASE_SHA" "$RELEASE_SOURCE_SHA"
          python - <<'PY'
          import os
          import subprocess

          base = os.environ['REVIEW_BASE_SHA']
          source = os.environ['RELEASE_SOURCE_SHA']
          expected = {
              'examination-room/index.html',
              'examination-room/professor.client.test.cjs',
              'examination-room/professor.css',
              'examination-room/professor.js',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..{source}'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f'Unexpected professor PDF release scope. expected={sorted(expected)} actual={sorted(changed)}'
              )
          print('Exact professor PDF release scope verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate complete Examination Room workflow
        shell: bash
        run: |
          set -euo pipefail
          node --check examination-room/professor.js
          node --test \
            examination-room/api.demo.test.cjs \
            examination-room/media-capture.contract.test.cjs \
            examination-room/offline-grading.test.cjs \
            examination-room/professor.client.test.cjs \
            examination-room/student.client.test.cjs \
            examination-room/view-models.test.cjs
          git diff --check "$REVIEW_BASE_SHA..$RELEASE_SOURCE_SHA"
          grep -Fq 'id="download-all-submitted-answers"' examination-room/index.html
          grep -Fq 'id="download-all-graded-answers"' examination-room/index.html
          grep -Fq 'Download all answers (PDF)' examination-room/index.html
          grep -Fq 'Download all with grades (PDF)' examination-room/index.html
          ! grep -Fq 'Download offline copy' examination-room/index.html
          grep -Fq "type: 'application/pdf'" examination-room/professor.js
          grep -Fq 'CLASS GRADE SUMMARY' examination-room/professor.js
          grep -Fq 'data-download-student-grades' examination-room/professor.js
          grep -Fq 'URL.revokeObjectURL(url), 60_000' examination-room/professor.js

      - name: Build and verify exact Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$RELEASE_SOURCE_SHA" node scripts/test-pages-artifact.mjs
          grep -Fq 'id="download-all-submitted-answers"' .pages-dist/examination-room/index.html
          grep -Fq 'id="download-all-graded-answers"' .pages-dist/examination-room/index.html
          grep -Fq 'professor.js?v=professor-pdf-downloads-20260923-1' .pages-dist/examination-room/index.html
          grep -Fq "type: 'application/pdf'" .pages-dist/examination-room/professor.js
          grep -Fq 'TOTAL GRADE:' .pages-dist/examination-room/professor.js
          test "$(cat .pages-dist/.well-known/duediligence-release.txt)" = "$RELEASE_SOURCE_SHA"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload exact sanitized Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live professor PDF downloads
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            marker="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/.well-known/duediligence-release.txt?release=$RELEASE_SOURCE_SHA" || true)"
            page="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/?release=$RELEASE_SOURCE_SHA" || true)"
            professor="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/professor.js?v=professor-pdf-downloads-20260923-1&release=$RELEASE_SOURCE_SHA" || true)"
            if [[ "$marker" == "$RELEASE_SOURCE_SHA" ]] \
              && grep -Fq 'id="download-all-submitted-answers"' <<<"$page" \
              && grep -Fq 'id="download-all-graded-answers"' <<<"$page" \
              && grep -Fq 'professor.js?v=professor-pdf-downloads-20260923-1' <<<"$page" \
              && ! grep -Fq 'Download offline copy' <<<"$page" \
              && grep -Fq "type: 'application/pdf'" <<<"$professor" \
              && grep -Fq 'CLASS GRADE SUMMARY' <<<"$professor" \
              && grep -Fq 'data-download-student-grades' <<<"$professor"; then
              echo "Professor PDF downloads are live."
              exit 0
            fi
            sleep 5
          done
          echo "Pages deployed but professor PDF downloads did not converge in time." >&2
          exit 1
