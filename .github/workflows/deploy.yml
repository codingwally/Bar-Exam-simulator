name: Deploy static content to Pages

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "I confirm this production Pages release has explicit approval"
        required: true
        default: false
        type: boolean
      database_release_preapplied:
        description: "The reviewed Examination Room database release was manually applied and live-probed"
        required: true
        default: false
        type: boolean
      release2_database_preapplied:
        description: "The reviewed Pedro and profile-photo database release was manually applied and live-probed"
        required: true
        default: false
        type: boolean
      admin_analytics_database_preapplied:
        description: "Exact 20260828133000 + 20260828133500 + 20260828134000 bundle, ledger hashes, and live probe are complete"
        required: true
        default: false
        type: boolean
      support_results_database_preapplied:
        description: "Exact Support identity + Bar Simulation history bundle, ledger hashes, privileges, and rollback-only probe are complete"
        required: true
        default: false
        type: boolean
      pricing_database_preapplied:
        description: "Exact 20260830054727 Admin pricing migration and rollback-only live probe are complete"
        required: true
        default: false
        type: boolean
      september_pricing_database_preapplied_sha256:
        description: "When DB URL is absent: SHA-256 of exact 20260831100000/20260831101000 bundle + probe"
        required: false
        default: ""
        type: string
      admin_bar_forecast_database_preapplied_sha256:
        description: "When DB URL is absent: SHA-256 of exact 20260831170000 bundle + rollback-only probe"
        required: false
        default: ""
        type: string
      admin_bar_forecast_content_preapplied_sha256:
        description: "When content credentials are absent: exact reviewed Forecast content-manifest SHA-256"
        required: false
        default: ""
        type: string
      approval_reference:
        description: "Approval/change reference recorded in the release log"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "examination-room-production-cutover"
  cancel-in-progress: false

jobs:
  authorize:
    name: Confirm approved production release
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch and explicit confirmation
        env:
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production releases may only run from main." >&2
            exit 1
          fi
          if [[ "$CONFIRM_PRODUCTION" != "true" ]]; then
            echo "Explicit production confirmation is required." >&2
            exit 1
          fi
          if [[ -z "${APPROVAL_REFERENCE//[[:space:]]/}" ]]; then
            echo "A non-empty approval/change reference is required." >&2
            exit 1
          fi

  deploy_worker:
    needs: authorize
    environment:
      name: production-worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Verify authentication, maintenance, admission, and public-shell contracts
        run: |
          node --check assets/phase2-config.js
          node --check assets/maintenance-gate.js
          node --check assets/phase4-experience.js
          node --check assets/lex-forum.js
          node --test examination-room/*.test.cjs
          node --test admin/examination-room-admin.test.cjs
          node --test worker/*.test.mjs
          node scripts/test-admin-support-results-discoverability.mjs
          node scripts/test-examination-room-database.mjs
          node scripts/test-examination-room-commercial-stress.mjs
          node scripts/test-maintenance-lock.mjs
          node scripts/test-private-beta-admission.mjs
          node scripts/test-private-beta-frontend.mjs
          node scripts/test-private-beta-landing.mjs
          node scripts/test-private-beta-auth-regression.mjs
          node scripts/test-auth-session-persistence.mjs
          node scripts/test-phase2-contract.mjs
          node scripts/test-email-marketing-retirement.mjs
          node scripts/test-dialog-exit-controls.mjs
          node scripts/test-auth-route-overlay.mjs
          node scripts/test-onboarding-flow.mjs
          node scripts/test-post-grade-controls.mjs
          node scripts/test-beta-readiness-copy-seo.mjs
          node scripts/test-lifetime-grade-ui.mjs
          node scripts/test-audience-menu.mjs
          node scripts/test-examination-room-door-menu.mjs
          node scripts/test-examination-room-release-workflows.mjs
          node scripts/test-admin-analytics-release-bundle.mjs
          node scripts/test-support-results-release-bundle.mjs
          node scripts/test-admin-pricing-editor.mjs
          node scripts/test-pricing-public-contract.mjs
          node scripts/test-admin-pricing-release.mjs
          node scripts/test-september-pricing-sql-contract.mjs
          node scripts/test-september-pricing-release-bundle.mjs
          node scripts/test-september-pricing-release-workflow.mjs
          node scripts/test-admin-bar-forecast-release-bundle.mjs
          node scripts/test-admin-bar-forecast-content-release.mjs
          node scripts/test-admin-bar-forecast-release-workflow.mjs
          node scripts/test-approved-renovation-shell.mjs
          node scripts/test-design-correction-release.mjs
          node scripts/test-subject-matter-consolidation.mjs
          node scripts/test-subject-matter-skip-flag.mjs
          node --test scripts/test-profile-photo-release2.mjs
          node scripts/test-profile-avatar-cleanup-migration.mjs
          node scripts/test-pedro-release2-integration.mjs
          node scripts/test-pedro-migration-contract.mjs
          node scripts/test-pedro-conditional-expression-qualification-fix.mjs
          node scripts/test-pedro-exact-openers.mjs
          node --test scripts/test-pedro-frontend.mjs
          node scripts/test-pedro-navigation.mjs
          node scripts/test-gemini-examiner.mjs
          node scripts/test-master-experience-release.mjs
          node scripts/test-quorum-navigation-state.mjs
          node scripts/test-syllabus-review-reveal-contract.mjs
          node scripts/test-subject-matter-incremental-snapshot-hash-fix.mjs
          node scripts/test-historical-examination-owner-access.mjs
          node scripts/test-examinations.mjs
          node scripts/test-phase4-release4.mjs
          node scripts/test-commercial-launch-migration.mjs
          node scripts/test-correction-workflow.mjs
          node scripts/test-complete-beta-release.mjs
          node scripts/test-lex-forum.mjs
          node scripts/test-quorum.mjs
          node scripts/test-public-release1-async-races.mjs
          node scripts/test-public-release1-reliability.mjs
          node scripts/test-admin-public-reliability.mjs
          node scripts/test-public-admin-static-stress.mjs
          node scripts/test-analytics-page.mjs
          node scripts/test-auxiliary-writing-diagnostics.mjs
          node scripts/test-history-score-safety.mjs
          node scripts/test-verdict-graded-analytics.mjs
          node scripts/test-verdict-export-loading.mjs
          node scripts/audit-subject-matter-review-quality.mjs
          node scripts/test-duediligence-2026-frontend.mjs
          node scripts/test-feature-decommission-boundary.mjs
          node scripts/test-import-duediligence-2026-content.mjs
          node scripts/validate-duediligence-2026-content.mjs

      - name: Apply and probe only the ordered Examination Room migrations
        env:
          EXAMINATION_ROOM_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_PRODUCTION_DATABASE_URL }}
          DATABASE_RELEASE_PREAPPLIED: ${{ inputs.database_release_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          release_bundle="$RUNNER_TEMP/examination-room-release.sql"
          trap 'rm -f -- "$release_bundle"' EXIT
          node scripts/build-examination-room-release-bundle.mjs --output "$release_bundle"
          if [[ -n "$EXAMINATION_ROOM_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$EXAMINATION_ROOM_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$release_bundle"
          elif [[ "$DATABASE_RELEASE_PREAPPLIED" == "true" ]]; then
            echo "The production database URL is absent. The explicit database_release_preapplied confirmation attests that this exact reviewed bundle was manually applied and live-probed before cutover."
          else
            echo "EXAMINATION_ROOM_PRODUCTION_DATABASE_URL is missing. Configure it, or manually apply and live-probe this exact reviewed bundle and rerun with database_release_preapplied=true." >&2
            exit 1
          fi

      - name: Require the live-probed Release 2 database contract
        env:
          RELEASE2_DATABASE_PREAPPLIED: ${{ inputs.release2_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260827143000_pedro_private_study_inbox.sql
          test -f supabase/migrations/20260827144000_profile_avatar_cleanup_queue.sql
          test -f supabase/migrations/20260827145000_pedro_foreign_key_indexes.sql
          if grep -R --include='*.html' -F 'phase2-config.js?v=private-maintenance-20260820-2' index.html admin examination-room; then
            echo "A legacy provider-visible phase2-config cache key remains in an HTML consumer." >&2
            exit 1
          fi
          if [[ "$RELEASE2_DATABASE_PREAPPLIED" != "true" ]]; then
            echo "Release 2 database migrations must be manually applied and live-probed before Worker deployment. Rerun with release2_database_preapplied=true only after verification." >&2
            exit 1
          fi
          echo "The explicit Release 2 attestation confirms the reviewed Pedro and profile-photo database contract was manually applied and live-probed before cutover."

      - name: Apply and live-probe the exact Admin analytics migrations
        env:
          ADMIN_ANALYTICS_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_PRODUCTION_DATABASE_URL }}
          ADMIN_ANALYTICS_DATABASE_PREAPPLIED: ${{ inputs.admin_analytics_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          admin_analytics_release_bundle="$RUNNER_TEMP/admin-analytics-release.sql"
          trap 'rm -f -- "$admin_analytics_release_bundle"' EXIT
          node scripts/build-admin-analytics-release-bundle.mjs --output "$admin_analytics_release_bundle"
          if [[ -n "$ADMIN_ANALYTICS_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$ADMIN_ANALYTICS_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$admin_analytics_release_bundle"
          elif [[ "$ADMIN_ANALYTICS_DATABASE_PREAPPLIED" == "true" ]]; then
            echo "The production database URL is absent. The explicit admin_analytics_database_preapplied confirmation attests that the reviewed bundle atomically applied exactly 20260828133000_optimize_internal_test_scoped_usage_helpers.sql, 20260828133500_admin_marketing_live_home_metrics.sql, and 20260828134000_exclude_admins_from_recent_sign_in_directory.sql, recorded their exact ledger names and source hashes, and passed the rollback-only live probe before Worker cutover."
          else
            echo "EXAMINATION_ROOM_PRODUCTION_DATABASE_URL is missing. Configure it, or manually run this reviewed Admin analytics bundle and verify its exact ledger-name/source-hash postflight and rollback-only live probe before rerunning with admin_analytics_database_preapplied=true." >&2
            exit 1
          fi

      - name: Apply and live-probe the exact Support identity and results migrations
        env:
          SUPPORT_RESULTS_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_PRODUCTION_DATABASE_URL }}
          SUPPORT_RESULTS_DATABASE_PREAPPLIED: ${{ inputs.support_results_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          support_results_release_bundle="$RUNNER_TEMP/support-results-release.sql"
          trap 'rm -f -- "$support_results_release_bundle"' EXIT
          node scripts/build-support-results-release-bundle.mjs --output "$support_results_release_bundle"
          if [[ -n "$SUPPORT_RESULTS_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$SUPPORT_RESULTS_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$support_results_release_bundle"
          elif [[ "$SUPPORT_RESULTS_DATABASE_PREAPPLIED" == "true" ]]; then
            echo "The production database URL is absent. The explicit support_results_database_preapplied confirmation attests that the exact two-migration bundle, ledger names and source hashes, service-role-only privileges, and rollback-only live probe passed before Worker cutover."
          else
            echo "EXAMINATION_ROOM_PRODUCTION_DATABASE_URL is missing. Configure it, or manually run the exact Support results bundle and verify its ledger hashes, privileges, and rollback-only live probe before rerunning with support_results_database_preapplied=true." >&2
            exit 1
          fi

      - name: Require the exact live-probed Admin pricing database contract
        env:
          PRICING_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_PRODUCTION_DATABASE_URL }}
          PRICING_DATABASE_PREAPPLIED: ${{ inputs.pricing_database_preapplied }}
        shell: bash
        run: |
          set -euo pipefail
          pricing_migration="supabase/migrations/20260830054727_admin_pricing_revisions.sql"
          pricing_probe="scripts/probe-admin-pricing-release.sql"
          test -f "$pricing_migration"
          test -f "$pricing_probe"
          if [[ "$PRICING_DATABASE_PREAPPLIED" != "true" ]]; then
            echo "The exact Admin pricing migration and rollback-only live probe must complete before production Worker deployment." >&2
            exit 1
          fi
          if [[ -n "$PRICING_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$PRICING_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$pricing_probe"
          else
            echo "The explicit pricing_database_preapplied confirmation attests that exact migration 20260830054727 and its rollback-only probe passed on production."
          fi

      - name: Apply and post-apply probe the exact September pricing migrations
        env:
          SEPTEMBER_PRICING_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_PRODUCTION_DATABASE_URL }}
          SEPTEMBER_PRICING_DATABASE_PREAPPLIED_SHA256: ${{ inputs.september_pricing_database_preapplied_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          september_pricing_release_bundle="$RUNNER_TEMP/september-pricing-release.sql"
          trap 'rm -f -- "$september_pricing_release_bundle"' EXIT
          node scripts/build-september-pricing-release-bundle.mjs --output "$september_pricing_release_bundle"
          expected_attestation="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write("sha256:" + createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"));' "$september_pricing_release_bundle")"
          test -n "$expected_attestation"
          if [[ -n "$SEPTEMBER_PRICING_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$SEPTEMBER_PRICING_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$september_pricing_release_bundle"
          elif [[ "$SEPTEMBER_PRICING_DATABASE_PREAPPLIED_SHA256" == "$expected_attestation" ]]; then
            echo "The exact bundle-hash attestation confirms both September pricing migrations, their ledger records, and the rollback-only post-apply probe completed on production before Worker cutover."
          else
            echo "EXAMINATION_ROOM_PRODUCTION_DATABASE_URL is missing. Manually apply the generated September pricing bundle, verify its embedded rollback-only probe, then rerun with this exact attestation: $expected_attestation" >&2
            exit 1
          fi

      - name: Apply and post-apply probe the exact admin-only Bar Forecast migration
        env:
          ADMIN_BAR_FORECAST_DATABASE_URL: ${{ secrets.EXAMINATION_ROOM_PRODUCTION_DATABASE_URL }}
          ADMIN_BAR_FORECAST_DATABASE_PREAPPLIED_SHA256: ${{ inputs.admin_bar_forecast_database_preapplied_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          admin_bar_forecast_release_bundle="$RUNNER_TEMP/admin-bar-forecast-release.sql"
          trap 'rm -f -- "$admin_bar_forecast_release_bundle"' EXIT
          node scripts/build-admin-bar-forecast-release-bundle.mjs --output "$admin_bar_forecast_release_bundle"
          expected_attestation="$(node --input-type=module -e 'import { createHash } from "node:crypto"; import { readFileSync } from "node:fs"; process.stdout.write("sha256:" + createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"));' "$admin_bar_forecast_release_bundle")"
          test -n "$expected_attestation"
          if [[ -n "$ADMIN_BAR_FORECAST_DATABASE_URL" ]]; then
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install --yes postgresql-client
            fi
            psql --version
            psql "$ADMIN_BAR_FORECAST_DATABASE_URL" -X --set=ON_ERROR_STOP=1 --file "$admin_bar_forecast_release_bundle"
          elif [[ "$ADMIN_BAR_FORECAST_DATABASE_PREAPPLIED_SHA256" == "$expected_attestation" ]]; then
            echo "The exact bundle-hash attestation confirms migration 20260831170000, its ledger source hash, and its rollback-only admin/schema probe completed on production."
          else
            echo "EXAMINATION_ROOM_PRODUCTION_DATABASE_URL is missing. Manually apply the generated Admin Bar Forecast bundle and embedded rollback-only probe, then rerun with this exact attestation: $expected_attestation" >&2
            exit 1
          fi

      - name: Import and verify the exact admin-only Bar Forecast content
        env:
          DD2026_SUPABASE_URL: https://hbllomlijfznnuudpdvr.supabase.co
          ADMIN_BAR_FORECAST_CONTENT_PREAPPLIED_SHA256: ${{ inputs.admin_bar_forecast_content_preapplied_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          expected_content_attestation="$(node scripts/verify-admin-bar-forecast-content.mjs --print-attestation)"
          [[ "$expected_content_attestation" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$ADMIN_BAR_FORECAST_CONTENT_PREAPPLIED_SHA256" != "$expected_content_attestation" ]]; then
            echo "No production service-role credential is exposed to GitHub Actions. Using a protected external service-role credential, run the Forecast-only importer against project hbllomlijfznnuudpdvr and run the exact current-published read-back verifier. Then rerun with this exact content-manifest attestation: $expected_content_attestation" >&2
            echo "Required external commands: node scripts/import-duediligence-2026-content.mjs --apply --environment production --content-type bar_forecast_question --confirm-production hbllomlijfznnuudpdvr ; node scripts/verify-admin-bar-forecast-content.mjs --verify --environment production --confirm-production hbllomlijfznnuudpdvr" >&2
            exit 1
          fi
          echo "The exact content-manifest hash attests that an external protected operator imported only the 120 reviewed Forecast items and verified their current-published ids, subjects, titles, payload checksums, and source metadata on production."

      - name: Verify production Examination Room Worker secrets exist
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.114.0 secret list --format json \
            | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const names = new Set(JSON.parse(value).map(item => item.name)); const required = ['GEMINI_API_KEY', 'RESEND_API_KEY', 'SUPABASE_SERVICE_ROLE_KEY', 'SUPABASE_URL', 'EXAMINATION_ROOM_KEY_PEPPER', 'EXAMINATION_ROOM_OWNER_DATA_KEY_V1', 'EXAMINATION_ROOM_BACKUP_MASTER_KEY_V1', 'EXAMINATION_ROOM_ADMIN_EMAILS']; const missing = required.filter(name => !names.has(name)); if (missing.length) { console.error('Required production Worker secrets are missing: ' + missing.join(', ') + '.'); process.exit(1); } console.log('Required production Examination Room Worker secrets are configured.'); });"

      - name: Verify private Supabase Storage recovery configuration before cutover
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'EXAMINATION_ROOM_RECOVERY_MODE = "supabase_storage"' wrangler.toml
          if grep -Eq '^[[:space:]]*\[\[r2_buckets\]\]|binding[[:space:]]*=[[:space:]]*"EXAMINATION_ROOM_BACKUPS"' wrangler.toml; then
            echo "Production must use the reviewed private Supabase Storage recovery mode without an R2 binding." >&2
            exit 1
          fi
          grep -F "'examination-room-recovery'" ../supabase/migrations/20260827030000_examination_room_supabase_storage_recovery.sql
          grep -F 'public is false' ../scripts/build-examination-room-release-bundle.mjs
          grep -F 'application/vnd.duediligence.examination-room-recovery+json' ../scripts/build-examination-room-release-bundle.mjs
          echo "Private Supabase Storage recovery configuration matches the live-probed database release contract."

      - name: Deploy Worker before exposing the new Pages client
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy

      - name: Deploy provider-neutral public API alias before exposing the new Pages client
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.public-api.toml

      - name: Verify public pricing and reject unauthenticated Admin pricing access before Pages
        env:
          PRICING_WORKER_URL: https://duediligence-api.wallyesteban1993.workers.dev
          PRICING_ALLOWED_ORIGIN: https://duediligence.ph
        shell: bash
        run: |
          set -euo pipefail
          pricing_response="$RUNNER_TEMP/production-pricing.json"
          pricing_status="$(curl --fail-with-body --silent --show-error \
            --output "$pricing_response" --write-out '%{http_code}' \
            --request POST \
            --header "Origin: $PRICING_ALLOWED_ORIGIN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$PRICING_WORKER_URL/plans")"
          test "$pricing_status" = "200"
          PRICING_RESPONSE="$pricing_response" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const payload = JSON.parse(await readFile(process.env.PRICING_RESPONSE, 'utf8'));
          assert.equal(payload.ok, true);
          assert.match(String(payload.revisionId || ''), /^[0-9a-f-]{36}$/i);
          assert.ok(Date.parse(String(payload.serverNow || '')) > 0);
          assert.equal(typeof payload.pricing, 'object');
          assert.ok(Array.isArray(payload.plans));
          NODE
          for endpoint in /admin/pricing/query /admin/pricing/action /admin/pricing/assets/upload; do
            denied_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST \
              --header "Origin: $PRICING_ALLOWED_ORIGIN" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$PRICING_WORKER_URL$endpoint")"
            case "$denied_status" in
              401|403) ;;
              *) echo "Unauthenticated $endpoint returned $denied_status instead of 401/403." >&2; exit 1 ;;
            esac
          done

  deploy_pages:
    needs: deploy_worker
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install reviewed Worker dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Build sanitized Pages artifact
        run: node scripts/build-pages-artifact.mjs

      - name: Verify sanitized Pages artifact
        run: node scripts/test-pages-artifact.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
