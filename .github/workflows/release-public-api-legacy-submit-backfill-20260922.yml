name: Emergency Examination Room recovery-first answer-save release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-public-api-legacy-submit-backfill-20260922.yml

permissions:
  contents: read

concurrency:
  group: public-api-answer-save-recovery
  cancel-in-progress: false

env:
  BASE_SHA: 2f829101e00f1a65ec81dc4de989e6653eec669a
  RELEASE_SOURCE_SHA: 24e1dbbef9fd0e035fcdf063cda45be6ad744180
  PUBLIC_API_URL: https://duediligence-api.wallyesteban1993.workers.dev

jobs:
  deploy:
    name: Verify and deploy recovery-first answer saves
    if: "${{ github.event.head_commit.message == 'release: deploy Examination Room recovery-first saves' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-worker

    steps:
      - name: Checkout exact alias hotfix source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SOURCE_SHA }}
          fetch-depth: 0

      - name: Prove reviewed Examination Room hotfix scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          python - <<'PY'
          import os, subprocess
          base=os.environ['BASE_SHA']
          source=os.environ['RELEASE_SOURCE_SHA']
          expected={
            'worker/public-api-alias.mjs',
            'worker/public-api-alias.test.mjs',
          }
          changed=set(subprocess.check_output(
            ['git','diff','--name-only',f'{base}..{source}'],
            text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected public API hotfix scope: {sorted(changed)}')
          print('Exact Examination Room answer-save recovery scope verified.')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate recovery-first answer saves and single-submit isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check worker/public-api-alias.mjs
          node --test worker/public-api-alias.test.mjs
          git diff --check "$BASE_SHA..$RELEASE_SOURCE_SHA"
          grep -Fq "command?.operation === 'save_answer' && approvedBrowserOrigin(request)" worker/public-api-alias.mjs
          grep -Fq "const recovered = await attemptStudentAnswerRecovery(command, requestKey)" worker/public-api-alias.mjs
          grep -Fq "Final submit intentionally does NOT use this per-answer recovery path." worker/public-api-alias.mjs
          grep -Fq "Submit is forwarded exactly once" worker/public-api-alias.mjs
          grep -Fq "submittedAt: submission.receivedAt" worker/public-api-alias.mjs
          grep -Fq "unapproved origins cannot invoke the authenticated answer recovery writer" worker/public-api-alias.test.mjs

      - name: Deploy provider-neutral public API alias
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.114.0"
          command: deploy --config wrangler.public-api.toml

      - name: Verify canonical Examination Room origin
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/origin-probe.json"
          headers="$RUNNER_TEMP/origin-probe.headers"
          status="$(curl --silent --show-error             --output "$body"             --dump-header "$headers"             --write-out '%{http_code}'             --request POST             --header 'Origin: https://duediligence.ph'             --header 'Content-Type: application/json'             --data '{}'             "$PUBLIC_API_URL/examination-room/v1/student/preview")"
          if [[ "$status" = "403" ]] && grep -Fq '"code":"ORIGIN_NOT_ALLOWED"' "$body"; then
            cat "$body" >&2
            exit 1
          fi
          grep -qi '^access-control-allow-origin: https://duediligence.ph' "$headers"
          echo "Public API alias is live and the canonical Examination Room origin is accepted."

      - name: Verify approved-origin answer save no longer leaks origin rejection
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/exam-room-save-probe.json"
          headers="$RUNNER_TEMP/exam-room-save-probe.headers"
          status="$(curl --silent --show-error --max-time 8 \
            --output "$body" \
            --dump-header "$headers" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://duediligence.ph' \
            --header 'Content-Type: application/json' \
            --header 'X-Request-ID: operation:recovery-first-release-probe' \
            --data '{"operation":"save_answer","payload":{"sessionId":"00000000-0000-0000-0000-000000000000","sessionToken":"ers1_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","questionId":"q001","answer":"probe","flagged":false},"idempotencyKey":"operation:recovery-first-release-probe"}' \
            "$PUBLIC_API_URL/examination-room/v1/student/command")"
          if [[ "$status" = "403" ]] && grep -Fq '"code":"ORIGIN_NOT_ALLOWED"' "$body"; then
            echo "Approved-origin answer save still leaks ORIGIN_NOT_ALLOWED." >&2
            cat "$body" >&2
            exit 1
          fi
          grep -qi '^access-control-allow-origin: https://duediligence.ph' "$headers"
          echo "Approved-origin answer save crossed the recovery/application boundary without ORIGIN_NOT_ALLOWED (HTTP $status)."

      - name: Verify submit remains single-request and fast
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/exam-room-submit-probe.json"
          metrics="$RUNNER_TEMP/exam-room-submit-probe.metrics"
          status="$(curl --silent --show-error --max-time 8 \
            --output "$body" \
            --write-out '%{http_code} %{time_total}' \
            --request POST \
            --header 'Origin: https://duediligence.ph' \
            --header 'Content-Type: application/json' \
            --header 'X-Request-ID: submission:recovery-first-release-probe' \
            --data '{"operation":"submit","payload":{"sessionId":"00000000-0000-0000-0000-000000000000","sessionToken":"ers1_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","answers":[{"questionId":"q001","answer":"probe"}]},"idempotencyKey":"submission:recovery-first-release-probe"}' \
            "$PUBLIC_API_URL/examination-room/v1/student/command")"
          printf '%s\n' "$status" > "$metrics"
          code="${status%% *}"
          seconds="${status##* }"
          test "$code" = "400"
          grep -Fq 'EXAM_ROOM_V1_IDENTIFIER_INVALID' "$body"
          awk -v seconds="$seconds" 'BEGIN { exit !(seconds < 5) }'
          echo "Production submit remained single-request and reached application validation in ${seconds}s."
