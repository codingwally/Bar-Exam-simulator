name = "duediligence-examinations-staging"
main = "index.mjs"
compatibility_date = "2026-07-26"
preview_urls = true

[placement]
region = "gcp:us-east4"

[vars]
SUPABASE_URL = "https://hlzqmreeoghbldnhlybr.supabase.co"
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_GROUNDING_ENABLED = "false"
ALLOWED_ORIGIN = "https://duediligence-examinations-staging.wallyesteban1993.workers.dev"
ALLOW_LEGACY_GUESTS = "false"
PHASE4_ACCESS_ENFORCEMENT = "true"
PHASE4_MODEL_QUALITY_ENFORCEMENT = "true"
REQUIRE_AUTHENTICATED_SUBMISSIONS = "true"
EXAMINATION_EMAIL_MODE = "suppressed"
EXAMINATION_EMAIL_FROM = "Due Diligence Examinations <examinations@duediligence.ph>"
ADMIN_DIRECTORY_EMAIL_MODE = "suppressed"
ADMIN_DIRECTORY_EMAIL_FROM = "Due Diligence Administration <support@duediligence.ph>"
PRIVATE_BETA_GATE_ENABLED = "true"
PRIVATE_BETA_DISCLOSURE_VERSION = "beta-disclosure-v1-2026-07-31"

[assets]
directory = "../.staging-dist"

[observability]
enabled = true

[observability.logs]
enabled = true

# Staging secrets are configured directly in Cloudflare and never committed:
# GEMINI_API_KEY
# GUEST_USAGE_HMAC_KEY
# SUPABASE_SERVICE_ROLE_KEY
# PRIVATE_BETA_ACCESS_CODE_VERIFIER
# PRIVATE_BETA_ACCESS_CODE_PEPPER
# PRIVATE_BETA_FLOW_SIGNING_KEY
# ADMIN_DIRECTORY_RECIPIENTS_JSON
