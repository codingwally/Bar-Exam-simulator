name: Examination Room event-log release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-examination-room-event-logs-20260925.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  LIVE_BASE_SHA: 7ea2327e88985c18e04ec0d066762b0b780d8041
  PATCH_SOURCE_SHA: c1213b614756fb3fbde8778e08ae59abcb3830a7
  SITE_URL: https://duediligence.ph

jobs:
  deploy:
    name: Verify and deploy Examination Room event logs
    if: "${{ github.event.head_commit.message == 'release: deploy Examination Room event logs' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout exact live Pages baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LIVE_BASE_SHA }}
          fetch-depth: 0

      - name: Overlay only reviewed Examination Room event-log assets
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PATCH_SOURCE_SHA^{commit}"
          for file in             examination-room/api.js             examination-room/student.js             examination-room/student.html             examination-room/professor.js             examination-room/professor.css             examination-room/index.html             service-worker.js; do
            git show "$PATCH_SOURCE_SHA:$file" > "$file"
          done

          changed="$(git diff --name-only)"
          expected="$(printf '%s\n'             examination-room/api.js             examination-room/index.html             examination-room/professor.css             examination-room/professor.js             examination-room/student.html             examination-room/student.js             service-worker.js | sort)"
          test "$(printf '%s\n' "$changed" | sort)" = "$expected"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pages build dependencies
        run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund

      - name: Validate event-log client
        shell: bash
        run: |
          set -euo pipefail
          node --check examination-room/api.js
          node --check examination-room/student.js
          node --check examination-room/professor.js
          node --check service-worker.js
          git diff --check

          grep -Fq "clipboard_paste" examination-room/api.js
          grep -Fq "clientEventType: eventType" examination-room/api.js
          grep -Fq "handleClipboardIntegrityEvent" examination-room/student.js
          grep -Fq "Event logs" examination-room/professor.js
          grep -Fq "Examination event log" examination-room/professor.js
          grep -Fq "event-logs-20260925-1" examination-room/index.html
          grep -Fq "event-logs-20260925-1" examination-room/student.html
          grep -Fq "duediligence-shell-examination-event-logs-20260925-1" service-worker.js

      - name: Build and verify patched Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$PATCH_SOURCE_SHA" node scripts/test-pages-artifact.mjs
          test "$(cat .pages-dist/.well-known/duediligence-release.txt)" = "$PATCH_SOURCE_SHA"
          grep -Fq "clipboard_paste" .pages-dist/examination-room/api.js
          grep -Fq "handleClipboardIntegrityEvent" .pages-dist/examination-room/student.js
          grep -Fq "Event logs" .pages-dist/examination-room/professor.js
          grep -Fq "professor.js?v=event-logs-20260925-1" .pages-dist/examination-room/index.html
          grep -Fq "student.js?v=event-logs-20260925-1" .pages-dist/examination-room/student.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload exact patched Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live event-log assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            marker="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/.well-known/duediligence-release.txt?release=$PATCH_SOURCE_SHA" || true)"
            professor="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/professor.js?v=event-logs-20260925-1&release=$PATCH_SOURCE_SHA" || true)"
            student="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/student.js?v=event-logs-20260925-1&release=$PATCH_SOURCE_SHA" || true)"
            api="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' "$SITE_URL/examination-room/api.js?v=event-logs-20260925-1&release=$PATCH_SOURCE_SHA" || true)"

            if [[ "$marker" == "$PATCH_SOURCE_SHA" ]]               && grep -Fq "Event logs" <<<"$professor"               && grep -Fq "Examination event log" <<<"$professor"               && grep -Fq "handleClipboardIntegrityEvent" <<<"$student"               && grep -Fq "clientEventType: eventType" <<<"$api"; then
              echo "Examination Room event logs are live."
              exit 0
            fi
            sleep 5
          done

          echo "Event-log assets did not converge in time." >&2
          exit 1
