<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <title>Examination platform · Due Diligence</title>
    <link rel="stylesheet" href="/student.css" />
    <script type="module" src="/student.mjs"></script>
  </head>
  <body>
    <a class="skip" href="#main" tabindex="0">Skip to examination</a>
    <header class="masthead">
      <span class="wordmark"
        >Due Diligence<span class="brand-dot">.</span></span
      >
      <span class="masthead-label">Examination platform</span>
    </header>
    <main id="main" tabindex="-1">
      <div id="app" aria-busy="true">
        <section class="system-screen">
          <p class="eyebrow">Examination platform</p>
          <h1>Preparing your examination</h1>
          <p>Checking the exam and any saved work.</p>
        </section>
      </div>
      <noscript
        ><section class="notice error">
          <h1>JavaScript is required</h1>
          <p>
            Enable JavaScript in your browser to save answers and display the
            examination timer. Use the practice link to check this browser
            before your exam.
          </p>
        </section></noscript
      >
    </main>
    <footer>
      Due Diligence · Philippines
      <span>Keep this browser and profile for your examination.</span>
    </footer>
  </body>
</html>
